<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" font-family="Helvetica, Arial, sans-serif">
  <!-- The E. coli K-12 chromosome as a circular map in minutes (0-100), generated by make_fig04.py.
       Gene positions are the real MG1655 coordinates (NC_000913.3, NCBI Gene, 2026-11-20) converted to
       minutes as 100 * start / 4 641 652. Inner ticks give the position in Mb.
       Hfr A (origin 92.6 min, clockwise) is the simulated Hfr of the R exercise; Hfr B (origin 50 min,
       counter-clockwise) is a second, hypothetical Hfr. Arcs show the first ~35-40 min of transfer. -->
  <defs>
    <marker id="ag" markerWidth="14" markerHeight="14" refX="8" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6a994e"/>
    </marker>
    <marker id="ao" markerWidth="14" markerHeight="14" refX="8" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d08c2f"/>
    </marker>
  </defs>
  <circle cx="252" cy="218" r="150" fill="none" stroke="#2a6f97" stroke-width="5"/>
  <!-- minute ticks every 10 min, outside the circle -->
  <line x1="252.0" y1="65.0" x2="252.0" y2="58.0" stroke="#7a8794" stroke-width="1.5"/>
  <line x1="341.9" y1="94.2" x2="346.0" y2="88.6" stroke="#7a8794" stroke-width="1.5"/>
  <line x1="397.5" y1="170.7" x2="404.2" y2="168.6" stroke="#7a8794" stroke-width="1.5"/>
  <line x1="397.5" y1="265.3" x2="404.2" y2="267.4" stroke="#7a8794" stroke-width="1.5"/>
  <line x1="341.9" y1="341.8" x2="346.0" y2="347.4" stroke="#7a8794" stroke-width="1.5"/>
  <line x1="252.0" y1="371.0" x2="252.0" y2="378.0" stroke="#7a8794" stroke-width="1.5"/>
  <line x1="162.1" y1="341.8" x2="158.0" y2="347.4" stroke="#7a8794" stroke-width="1.5"/>
  <line x1="106.5" y1="265.3" x2="99.8" y2="267.4" stroke="#7a8794" stroke-width="1.5"/>
  <line x1="106.5" y1="170.7" x2="99.8" y2="168.6" stroke="#7a8794" stroke-width="1.5"/>
  <line x1="162.1" y1="94.2" x2="158.0" y2="88.6" stroke="#7a8794" stroke-width="1.5"/>
  <!-- Mb ticks inside the circle -->
  <line x1="252.0" y1="71.0" x2="252.0" y2="80.0" stroke="#1b2a3a" stroke-width="2"/>
  <text x="252.0" y="98.0" font-size="12" fill="#1b2a3a" text-anchor="middle">0 Mb</text>
  <line x1="395.5" y1="186.3" x2="386.8" y2="188.3" stroke="#1b2a3a" stroke-width="2"/>
  <text x="373.1" y="195.3" font-size="12" fill="#1b2a3a" text-anchor="middle">1 Mb</text>
  <line x1="313.9" y1="351.4" x2="310.1" y2="343.2" stroke="#1b2a3a" stroke-width="2"/>
  <text x="304.2" y="334.5" font-size="12" fill="#1b2a3a" text-anchor="middle">2 Mb</text>
  <line x1="135.1" y1="307.1" x2="142.3" y2="301.7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="153.4" y="297.2" font-size="12" fill="#1b2a3a" text-anchor="middle">3 Mb</text>
  <line x1="139.8" y1="123.1" x2="146.6" y2="128.9" stroke="#1b2a3a" stroke-width="2"/>
  <text x="157.3" y="141.9" font-size="12" fill="#1b2a3a" text-anchor="middle">4 Mb</text>
  <!-- genes: dot on the circle, italic label outside, minute value under the name -->
  <circle cx="252.0" cy="68.0" r="4.5" fill="#1b2a3a"/>
  <text x="260.0" y="46.0" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">thr</text>
  <text x="286.8" y="46.0" font-size="12" fill="#5b6b7a">0</text>
  <circle cx="322.6" cy="85.7" r="4.5" fill="#1b2a3a"/>
  <text x="333.0" y="66.2" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">lac</text>
  <text x="359.8" y="66.2" font-size="12" fill="#5b6b7a">7.8</text>
  <circle cx="354.0" cy="108.0" r="4.5" fill="#1b2a3a"/>
  <text x="369.0" y="91.9" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">pur</text>
  <text x="395.8" y="91.9" font-size="12" fill="#5b6b7a">11.9</text>
  <circle cx="383.4" cy="145.7" r="4.5" fill="#1b2a3a"/>
  <text x="402.7" y="140.1" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">gal</text>
  <text x="429.5" y="140.1" font-size="12" fill="#5b6b7a">17</text>
  <circle cx="398.6" cy="249.8" r="4.5" fill="#1b2a3a"/>
  <text x="420.1" y="259.5" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">trp</text>
  <text x="446.9" y="259.5" font-size="12" fill="#5b6b7a">28.4</text>
  <circle cx="298.4" cy="360.7" r="4.5" fill="#1b2a3a"/>
  <text x="305.2" y="391.6" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">his</text>
  <text x="332.0" y="391.6" font-size="12" fill="#5b6b7a">45</text>
  <circle cx="137.0" cy="314.3" r="4.5" fill="#1b2a3a"/>
  <text x="67.0" y="338.5" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">thy</text>
  <text x="93.8" y="338.5" font-size="12" fill="#5b6b7a">63.9</text>
  <circle cx="102.0" cy="219.9" r="4.5" fill="#1b2a3a"/>
  <text x="26.8" y="225.2" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">str</text>
  <text x="53.6" y="225.2" font-size="12" fill="#5b6b7a">74.8</text>
  <circle cx="110.2" cy="169.0" r="4.5" fill="#1b2a3a"/>
  <text x="36.2" y="166.8" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">xyl</text>
  <text x="63.0" y="166.8" font-size="12" fill="#5b6b7a">80.3</text>
  <circle cx="132.3" cy="127.6" r="4.5" fill="#1b2a3a"/>
  <text x="61.6" y="114.3" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">ilv</text>
  <text x="88.4" y="114.3" font-size="12" fill="#5b6b7a">85.3</text>
  <circle cx="160.1" cy="99.5" r="4.5" fill="#1b2a3a"/>
  <text x="93.4" y="82.1" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">arg</text>
  <text x="120.2" y="82.1" font-size="12" fill="#5b6b7a">89.5</text>
  <circle cx="217.4" cy="72.0" r="4.5" fill="#1b2a3a"/>
  <text x="185.8" y="50.6" font-size="14" font-style="italic" font-weight="bold" fill="#1b2a3a">pyr</text>
  <text x="212.6" y="50.6" font-size="12" fill="#5b6b7a">96.3</text>
  <!-- Hfr A: origin 92.6 min, clockwise (sweep 1); Hfr B: origin 50 min, counter-clockwise (sweep 0) -->
  <path d="M207.2,128.6 A100,100 0 0 1 347.1,248.9" fill="none" stroke="#6a994e" stroke-width="4" marker-end="url(#ag)"/>
  <circle cx="207.2" cy="128.6" r="5" fill="#6a994e"/>
  <path d="M252.0,298.0 A80,80 0 0 0 310.3,163.2" fill="none" stroke="#d08c2f" stroke-width="4" marker-end="url(#ao)"/>
  <circle cx="252.0" cy="298.0" r="5" fill="#d08c2f"/>
  <text x="206.0" y="167.6" font-size="14" font-weight="bold" fill="#6a994e" text-anchor="start">Hfr A</text>
  <text x="252.0" y="272.0" font-size="14" font-weight="bold" fill="#d08c2f" text-anchor="middle">Hfr B</text>
  <!-- explanation panel -->
  <text x="500" y="34" font-size="16" font-weight="bold" fill="#1b2a3a"><tspan font-style='italic'>E. coli</tspan> K-12 MG1655</text>
  <text x="500" y="56" font-size="14" font-weight="normal" fill="#1b2a3a">one circular chromosome, 4 641 652 bp</text>
  <text x="500" y="90" font-size="15" font-weight="bold" fill="#1b2a3a">Map unit: the minute</text>
  <text x="500" y="112" font-size="14" font-weight="normal" fill="#1b2a3a">time an Hfr needs to transfer that stretch</text>
  <text x="500" y="132" font-size="14" font-weight="normal" fill="#1b2a3a">100 min = the whole chromosome</text>
  <text x="500" y="152" font-size="14" font-weight="normal" fill="#1b2a3a">1 min ≈ 46 kb</text>
  <text x="500" y="188" font-size="15" font-weight="bold" fill="#6a994e">Hfr A: origin 92.6 min, clockwise</text>
  <text x="500" y="210" font-size="14" font-weight="normal" fill="#1b2a3a">enters <tspan font-style='italic'>pyr thr lac pur gal trp</tspan> …</text>
  <text x="500" y="244" font-size="15" font-weight="bold" fill="#d08c2f">Hfr B: origin 50 min, anticlockwise</text>
  <text x="500" y="266" font-size="14" font-weight="normal" fill="#1b2a3a">enters <tspan font-style='italic'>his trp gal pur lac thr</tspan> …</text>
  <text x="500" y="302" font-size="14" font-weight="normal" fill="#1b2a3a">Different Hfr strains start at different</text>
  <text x="500" y="322" font-size="14" font-weight="normal" fill="#1b2a3a">places and go in either direction, but the</text>
  <text x="500" y="342" font-size="14" font-weight="normal" fill="#1b2a3a">orders overlap: the map closes into a circle.</text>
  <text x="500" y="378" font-size="13" font-weight="normal" fill="#5b6b7a">Gene positions: NCBI Gene, NC_000913.3.</text>
  <text x="500" y="396" font-size="13" font-weight="normal" fill="#5b6b7a">Hfr A and B are teaching examples.</text>
</svg>
