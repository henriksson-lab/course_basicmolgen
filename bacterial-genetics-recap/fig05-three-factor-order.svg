<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" font-family="Helvetica, Arial, sans-serif">
  <!-- Three-factor transduction cross: why the rarest class gives the gene order.
       Blue = donor fragment (a+ b+ c+), red = recipient chromosome (a- b- c-).
       The class asked about is a+ b- c+ (a selected, c gained, b not gained).
       Left: if the order is a-b-c, that class needs four crossovers (dashed X marks):
       outside a, between a and b, between b and c, outside c.
       Right: if the order is b-a-c, the same class needs only two: between b and a, outside c. -->
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#1b2a3a">Which order makes the class <tspan font-style="italic">a</tspan><tspan font-size="10" dy="-6">+</tspan><tspan dy="6"> </tspan><tspan font-style="italic">b</tspan><tspan font-size="10" dy="-6">−</tspan><tspan dy="6"> </tspan><tspan font-style="italic">c</tspan><tspan font-size="10" dy="-6">+</tspan><tspan dy="6"> rare?</tspan></text>

  <!-- ===== panel A: order a - b - c ===== -->
  <text x="20" y="62" font-size="14" fill="#5b6b7a">If the order is <tspan font-style="italic" fill="#1b2a3a">a</tspan> – <tspan font-style="italic" fill="#1b2a3a">b</tspan> – <tspan font-style="italic" fill="#1b2a3a">c</tspan></text>
  <text x="20" y="104" font-size="12.5" fill="#2a6f97">donor</text>
  <text x="20" y="165" font-size="12.5" fill="#bc4749">recipient</text>
  <line x1="80" y1="100" x2="360" y2="100" stroke="#2a6f97" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="160" x2="400" y2="160" stroke="#bc4749" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#1b2a3a" stroke-width="2">
    <line x1="130" y1="93" x2="130" y2="107"/><line x1="220" y1="93" x2="220" y2="107"/><line x1="310" y1="93" x2="310" y2="107"/>
    <line x1="130" y1="153" x2="130" y2="167"/><line x1="220" y1="153" x2="220" y2="167"/><line x1="310" y1="153" x2="310" y2="167"/>
  </g>
  <g font-size="15" font-style="italic" fill="#2a6f97">
    <text x="124" y="86">a<tspan font-size="10" font-style="normal" dy="-6">+</tspan></text>
    <text x="214" y="86">b<tspan font-size="10" font-style="normal" dy="-6">+</tspan></text>
    <text x="304" y="86">c<tspan font-size="10" font-style="normal" dy="-6">+</tspan></text>
  </g>
  <g font-size="15" font-style="italic" fill="#bc4749">
    <text x="124" y="188">a<tspan font-size="10" font-style="normal" dy="-6">−</tspan></text>
    <text x="214" y="188">b<tspan font-size="10" font-style="normal" dy="-6">−</tspan></text>
    <text x="304" y="188">c<tspan font-size="10" font-style="normal" dy="-6">−</tspan></text>
  </g>
  <g stroke="#1b2a3a" stroke-width="1.6" stroke-dasharray="3 3">
    <line x1="99" y1="108" x2="111" y2="152"/><line x1="111" y1="108" x2="99" y2="152"/>
    <line x1="169" y1="108" x2="181" y2="152"/><line x1="181" y1="108" x2="169" y2="152"/>
    <line x1="259" y1="108" x2="271" y2="152"/><line x1="271" y1="108" x2="259" y2="152"/>
    <line x1="329" y1="108" x2="341" y2="152"/><line x1="341" y1="108" x2="329" y2="152"/>
  </g>
  <text x="20" y="222" font-size="13.5" fill="#1b2a3a">Take <tspan font-style="italic">a</tspan><tspan font-size="9.5" dy="-5">+</tspan><tspan dy="5">, leave </tspan><tspan font-style="italic">b</tspan><tspan font-size="9.5" dy="-5">+</tspan><tspan dy="5">, take </tspan><tspan font-style="italic">c</tspan><tspan font-size="9.5" dy="-5">+</tspan><tspan dy="5">:</tspan></text>
  <text x="20" y="244" font-size="13.5" fill="#bc4749" font-weight="bold">4 crossovers: expected to be the rarest class</text>

  <line x1="440" y1="44" x2="440" y2="256" stroke="#e3e7eb" stroke-width="1.5"/>

  <!-- ===== panel B: order b - a - c ===== -->
  <text x="460" y="62" font-size="14" fill="#5b6b7a">If the order is <tspan font-style="italic" fill="#1b2a3a">b</tspan> – <tspan font-style="italic" fill="#1b2a3a">a</tspan> – <tspan font-style="italic" fill="#1b2a3a">c</tspan></text>
  <text x="460" y="104" font-size="12.5" fill="#2a6f97">donor</text>
  <text x="460" y="165" font-size="12.5" fill="#bc4749">recipient</text>
  <line x1="520" y1="100" x2="800" y2="100" stroke="#2a6f97" stroke-width="5" stroke-linecap="round"/>
  <line x1="520" y1="160" x2="840" y2="160" stroke="#bc4749" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#1b2a3a" stroke-width="2">
    <line x1="570" y1="93" x2="570" y2="107"/><line x1="660" y1="93" x2="660" y2="107"/><line x1="750" y1="93" x2="750" y2="107"/>
    <line x1="570" y1="153" x2="570" y2="167"/><line x1="660" y1="153" x2="660" y2="167"/><line x1="750" y1="153" x2="750" y2="167"/>
  </g>
  <g font-size="15" font-style="italic" fill="#2a6f97">
    <text x="564" y="86">b<tspan font-size="10" font-style="normal" dy="-6">+</tspan></text>
    <text x="654" y="86">a<tspan font-size="10" font-style="normal" dy="-6">+</tspan></text>
    <text x="744" y="86">c<tspan font-size="10" font-style="normal" dy="-6">+</tspan></text>
  </g>
  <g font-size="15" font-style="italic" fill="#bc4749">
    <text x="564" y="188">b<tspan font-size="10" font-style="normal" dy="-6">−</tspan></text>
    <text x="654" y="188">a<tspan font-size="10" font-style="normal" dy="-6">−</tspan></text>
    <text x="744" y="188">c<tspan font-size="10" font-style="normal" dy="-6">−</tspan></text>
  </g>
  <g stroke="#1b2a3a" stroke-width="1.6" stroke-dasharray="3 3">
    <line x1="609" y1="108" x2="621" y2="152"/><line x1="621" y1="108" x2="609" y2="152"/>
    <line x1="769" y1="108" x2="781" y2="152"/><line x1="781" y1="108" x2="769" y2="152"/>
  </g>
  <text x="460" y="222" font-size="13.5" fill="#1b2a3a">The same class needs only a fragment</text>
  <text x="460" y="240" font-size="13.5" fill="#1b2a3a">that starts between <tspan font-style="italic">b</tspan> and <tspan font-style="italic">a</tspan>:</text>
  <text x="460" y="262" font-size="13.5" fill="#2e7d32" font-weight="bold">2 crossovers: should not be rare</text>
  <text x="20" y="282" font-size="12.5" fill="#5b6b7a">Dashed X = a crossover between the donor fragment and the recipient chromosome. A linear fragment always needs an even number.</text>
</svg>
