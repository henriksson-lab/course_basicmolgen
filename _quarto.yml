format:
  html:
    toc: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    theme: cosmo
    css: styles.css

# reveal.js navigation arrows for every lecture deck (lec.qmd).
controls: true
controls-layout: edges
controls-back-arrows: visible
