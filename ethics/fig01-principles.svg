<svg xmlns="http://www.w3.org/2000/svg" width="860" height="368" viewBox="0 0 860 368" font-family="Helvetica, Arial, sans-serif">
  <!-- fig01: the four principles of biomedical ethics (Beauchamp and Childress),
       each with the question it asks, plus three genetics-specific themes below. -->
  <!-- four columns: x = 20 + i*210, width 190 -->
  <g font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="20" y="20" width="190" height="48" rx="6" fill="#2a6f97"/>
    <text x="115" y="51">Autonomy</text>
    <rect x="230" y="20" width="190" height="48" rx="6" fill="#6a994e"/>
    <text x="325" y="51">Beneficence</text>
    <rect x="440" y="20" width="190" height="48" rx="6" fill="#bc4749"/>
    <text x="535" y="51">Non-maleficence</text>
    <rect x="650" y="20" width="190" height="48" rx="6" fill="#5b6b7a"/>
    <text x="745" y="51">Justice</text>
  </g>
  <!-- column bodies -->
  <g fill="#f4f6f8" stroke="#c9d3dd" stroke-width="1.5">
    <rect x="20" y="68" width="190" height="138"/>
    <rect x="230" y="68" width="190" height="138"/>
    <rect x="440" y="68" width="190" height="138"/>
    <rect x="650" y="68" width="190" height="138"/>
  </g>
  <g font-size="15" fill="#1b2a3a" text-anchor="middle">
    <text x="115" y="98" font-style="italic">respect the person's</text>
    <text x="115" y="117" font-style="italic">own choice</text>
    <text x="115" y="152">Does she understand</text>
    <text x="115" y="171">the test, and decide</text>
    <text x="115" y="190">freely?</text>

    <text x="325" y="98" font-style="italic">do good</text>
    <text x="325" y="152">Will the result</text>
    <text x="325" y="171">help: treatment,</text>
    <text x="325" y="190">screening, planning?</text>

    <text x="535" y="98" font-style="italic">do no harm</text>
    <text x="535" y="152">Anxiety, stigma,</text>
    <text x="535" y="171">discrimination,</text>
    <text x="535" y="190">a leaked genome?</text>

    <text x="745" y="98" font-style="italic">be fair</text>
    <text x="745" y="152">Who gets access?</text>
    <text x="745" y="171">Who carries the risks,</text>
    <text x="745" y="190">who gets the benefits?</text>
  </g>
  <!-- bracket: what genetics adds -->
  <g stroke="#1b2a3a" stroke-width="1.6" fill="none">
    <path d="M20,220 L20,230 L840,230 L840,220"/>
    <line x1="430" y1="230" x2="430" y2="250"/>
  </g>
  <text x="430" y="272" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">What genetic information adds</text>
  <g font-size="15" fill="#1b2a3a" text-anchor="middle">
    <rect x="20" y="288" width="260" height="62" rx="6" fill="#cfe0ec"/>
    <text x="150" y="313" font-weight="bold">Informed consent</text>
    <text x="150" y="334">to tests, research, storage</text>
    <rect x="300" y="288" width="260" height="62" rx="6" fill="#cfe0ec"/>
    <text x="430" y="313" font-weight="bold">Privacy</text>
    <text x="430" y="334">and relatives share your DNA</text>
    <rect x="580" y="288" width="260" height="62" rx="6" fill="#cfe0ec"/>
    <text x="710" y="313" font-weight="bold">The right not to know</text>
    <text x="710" y="334">a result you did not ask for</text>
  </g>
</svg>
