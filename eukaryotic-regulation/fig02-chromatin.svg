<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif">
  <!-- fig02: open vs closed chromatin. Left: active chromatin, spaced nucleosomes with acetylated
       tails (Ac) and H3K4me3 near the promoter, unmethylated CpGs (open circles), a TF bound, gene on.
       Right: silent chromatin, packed nucleosomes, H3K9me3 / H3K27me3 marks (Me), methylated CpGs
       (filled circles) bound by reader proteins, gene off. Both states are copied through cell division. -->
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#2e7d32">Open chromatin: gene ON</text>
  <text x="470" y="28" font-size="18" font-weight="bold" fill="#c62828">Closed chromatin: gene OFF</text>

  <!-- ===== left ===== -->
  <path d="M20,160 L430,160" stroke="#1b2a3a" stroke-width="3"/>
  <!-- nucleosomes, spaced -->
  <g fill="#c9d6e3" stroke="#1b2a3a" stroke-width="1.5">
    <ellipse cx="60" cy="160" rx="26" ry="22"/>
    <ellipse cx="170" cy="160" rx="26" ry="22"/>
    <ellipse cx="380" cy="160" rx="26" ry="22"/>
  </g>
  <!-- acetyl tails -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="60" y1="138" x2="60" y2="116"/><line x1="170" y1="138" x2="170" y2="116"/><line x1="380" y1="138" x2="380" y2="116"/>
  </g>
  <g fill="#2e7d32">
    <circle cx="60" cy="108" r="9"/><circle cx="170" cy="108" r="9"/><circle cx="380" cy="108" r="9"/>
  </g>
  <g font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="60" y="112">Ac</text><text x="170" y="112">Ac</text><text x="380" y="112">Ac</text>
  </g>
  <!-- unmethylated CpGs and TF on free DNA -->
  <g fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5">
    <circle cx="225" cy="160" r="6"/><circle cx="245" cy="160" r="6"/><circle cx="315" cy="160" r="6"/>
  </g>
  <ellipse cx="275" cy="146" rx="22" ry="14" fill="#7b3fa0" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="275" y="122" font-size="13" fill="#7b3fa0" text-anchor="middle">TF can bind</text>
  <!-- transcription -->
  <path d="M330,190 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0" fill="none" stroke="#d08c2f" stroke-width="2.5"/>
  <text x="410" y="206" font-size="13" fill="#d08c2f" text-anchor="end">mRNA</text>

  <!-- ===== right ===== -->
  <path d="M470,160 L880,160" stroke="#1b2a3a" stroke-width="3"/>
  <g fill="#9db4c8" stroke="#1b2a3a" stroke-width="1.5">
    <ellipse cx="500" cy="160" rx="26" ry="22"/>
    <ellipse cx="552" cy="160" rx="26" ry="22"/>
    <ellipse cx="604" cy="160" rx="26" ry="22"/>
    <ellipse cx="656" cy="160" rx="26" ry="22"/>
    <ellipse cx="708" cy="160" rx="26" ry="22"/>
    <ellipse cx="760" cy="160" rx="26" ry="22"/>
    <ellipse cx="812" cy="160" rx="26" ry="22"/>
    <ellipse cx="860" cy="160" rx="20" ry="22"/>
  </g>
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="500" y1="138" x2="500" y2="116"/><line x1="604" y1="138" x2="604" y2="116"/><line x1="708" y1="138" x2="708" y2="116"/><line x1="812" y1="138" x2="812" y2="116"/>
  </g>
  <g fill="#c62828">
    <circle cx="500" cy="108" r="10"/><circle cx="604" cy="108" r="10"/><circle cx="708" cy="108" r="10"/><circle cx="812" cy="108" r="10"/>
  </g>
  <g font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="500" y="112">Me</text><text x="604" y="112">Me</text><text x="708" y="112">Me</text><text x="812" y="112">Me</text>
  </g>
  <!-- methylated CpGs (filled, in linker DNA) -->
  <g fill="#1b2a3a"><circle cx="526" cy="190" r="6"/><circle cx="630" cy="190" r="6"/><circle cx="734" cy="190" r="6"/></g>
  <line x1="526" y1="160" x2="526" y2="184" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="630" y1="160" x2="630" y2="184" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="734" y1="160" x2="734" y2="184" stroke="#1b2a3a" stroke-width="1"/>
  <text x="660" y="80" font-size="13" fill="#c62828" text-anchor="middle">reader proteins (HP1, Polycomb) bind the marks and compact the fibre</text>

  <!-- legend / marks table -->
  <line x1="20" y1="236" x2="880" y2="236" stroke="#d5dae0" stroke-width="1.5"/>
  <circle cx="34" cy="262" r="9" fill="#2e7d32"/>
  <text x="50" y="267" font-size="14" fill="#1b2a3a">histone acetylation; H3K4me3 at active promoters</text>
  <circle cx="34" cy="292" r="6" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="50" y="297" font-size="14" fill="#1b2a3a">unmethylated CpG (typical of CpG-island promoters)</text>
  <circle cx="484" cy="262" r="10" fill="#c62828"/>
  <text x="502" y="267" font-size="14" fill="#1b2a3a">repressive methylation: H3K9me3, H3K27me3</text>
  <circle cx="484" cy="292" r="6" fill="#1b2a3a"/>
  <text x="502" y="297" font-size="14" fill="#1b2a3a">5-methylcytosine at CpG (DNA methylation)</text>
  <text x="20" y="324" font-size="13" fill="#5c6b7a">Both states are copied to daughter cells: this is epigenetic memory.</text>
</svg>
