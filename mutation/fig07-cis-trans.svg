<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif" width="900" height="330">
  <!-- The cis-trans test for two recessive mutations, m1 and m2, in the SAME gene A.
       Trans: one mutation on each homologue (the complementation test). Cis: both on one homologue (the control).
       Same style as fig05-complementation. -->

  <!-- Left panel: trans -->
  <rect x="10" y="10" width="430" height="250" rx="8" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="26" y="38" font-size="16" font-weight="bold" fill="#1b2a3a">trans: one mutation on each homologue</text>
  <text x="26" y="60" font-size="13" fill="#5a6b7a">m1 + / + m2: this is the complementation test</text>
  <rect x="60" y="88" width="340" height="20" rx="10" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="130" y="88" width="200" height="20" fill="#f6e3e3" stroke="#bc4749" stroke-width="1.5"/>
  <line x1="180" y1="82" x2="180" y2="114" stroke="#bc4749" stroke-width="4"/>
  <text x="180" y="78" font-size="13" font-weight="bold" fill="#bc4749" text-anchor="middle">m1</text>
  <text x="265" y="103" font-size="13" font-weight="bold" fill="#bc4749" text-anchor="middle">gene A</text>
  <rect x="60" y="138" width="340" height="20" rx="10" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="130" y="138" width="200" height="20" fill="#f6e3e3" stroke="#bc4749" stroke-width="1.5"/>
  <line x1="290" y1="132" x2="290" y2="164" stroke="#bc4749" stroke-width="4"/>
  <text x="290" y="180" font-size="13" font-weight="bold" fill="#bc4749" text-anchor="middle">m2</text>
  <text x="200" y="153" font-size="13" font-weight="bold" fill="#bc4749" text-anchor="middle">gene A</text>
  <circle cx="50" cy="222" r="18" fill="#ffffff" stroke="#8a97a4" stroke-width="2"/>
  <text x="80" y="218" font-size="15" font-weight="bold" fill="#1b2a3a">mutant (−)</text>
  <text x="80" y="238" font-size="13" fill="#5a6b7a">no intact copy of gene A in the cell</text>

  <!-- Right panel: cis -->
  <rect x="460" y="10" width="430" height="250" rx="8" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="476" y="38" font-size="16" font-weight="bold" fill="#1b2a3a">cis: both mutations on one homologue</text>
  <text x="476" y="60" font-size="13" fill="#5a6b7a">m1 m2 / + +: the control</text>
  <rect x="510" y="88" width="340" height="20" rx="10" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="580" y="88" width="200" height="20" fill="#f6e3e3" stroke="#bc4749" stroke-width="1.5"/>
  <line x1="630" y1="82" x2="630" y2="114" stroke="#bc4749" stroke-width="4"/>
  <text x="630" y="78" font-size="13" font-weight="bold" fill="#bc4749" text-anchor="middle">m1</text>
  <line x1="740" y1="82" x2="740" y2="114" stroke="#bc4749" stroke-width="4"/>
  <text x="740" y="78" font-size="13" font-weight="bold" fill="#bc4749" text-anchor="middle">m2</text>
  <text x="685" y="103" font-size="13" font-weight="bold" fill="#bc4749" text-anchor="middle">gene A</text>
  <rect x="510" y="138" width="340" height="20" rx="10" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="580" y="138" width="200" height="20" fill="#e5efdf" stroke="#6a994e" stroke-width="1.5"/>
  <text x="680" y="153" font-size="13" font-weight="bold" fill="#6a994e" text-anchor="middle">gene A (intact)</text>
  <circle cx="500" cy="222" r="18" fill="#8e5bb5" stroke="#5e3a7d" stroke-width="2"/>
  <text x="530" y="218" font-size="15" font-weight="bold" fill="#1b2a3a">wild type (+)</text>
  <text x="530" y="238" font-size="13" fill="#5a6b7a">one intact copy is enough: both are recessive</text>

  <!-- summary -->
  <text x="26" y="290" font-size="14" fill="#1b2a3a"><tspan font-weight="bold">Same gene:</tspan> trans mutant, cis wild type.</text>
  <text x="476" y="290" font-size="14" fill="#1b2a3a"><tspan font-weight="bold">Different genes:</tspan> trans and cis both wild type.</text>
  <text x="450" y="318" font-size="13" fill="#5a6b7a" text-anchor="middle">Only the trans result tells you about the gene; the cis result shows the test is valid.</text>
</svg>
