<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 900 298" font-family="Helvetica, Arial, sans-serif" width="900" height="298">
  <!-- Restriction map of phage lambda (NC_001416.1, 48,502 bp, linear) for EcoRI and BamHI. Cut positions computed from the real sequence (R exercise R2/R3). Scale: x = 170 + bp * 700/48502. -->
  <g font-size="14" font-weight="bold" fill="#1b2a3a">
    <text x="20" y="80">EcoRI</text>
    <text x="20" y="150">BamHI</text>
    <text x="20" y="230">EcoRI + BamHI</text>
  </g>
  <g font-size="12" fill="#5a6b7a">
    <text x="20" y="96">5 sites, 6 pieces</text>
    <text x="20" y="166">5 sites, 6 pieces</text>
    <text x="20" y="246">10 sites, 11 pieces</text>
  </g>
  <!-- bars -->
  <g fill="#d6dde4">
    <rect x="170" y="70" width="700" height="10"/>
    <rect x="170" y="140" width="700" height="10"/>
    <rect x="170" y="220" width="700" height="10"/>
  </g>
  <!-- unchanged fragments in the double digest (green) -->
  <g fill="#6a994e">
    <rect x="170" y="220" width="79.4" height="10"/>
    <rect x="819" y="220" width="51" height="10"/>
  </g>
  <!-- EcoRI sites (red) -->
  <g stroke="#bc4749" stroke-width="2.5">
    <line x1="476.3" y1="64" x2="476.3" y2="86"/><line x1="546.7" y1="64" x2="546.7" y2="86"/>
    <line x1="628.2" y1="64" x2="628.2" y2="86"/><line x1="735.3" y1="64" x2="735.3" y2="86"/>
    <line x1="819" y1="64" x2="819" y2="86"/>
    <line x1="476.3" y1="214" x2="476.3" y2="236"/><line x1="546.7" y1="214" x2="546.7" y2="236"/>
    <line x1="628.2" y1="214" x2="628.2" y2="236"/><line x1="735.3" y1="214" x2="735.3" y2="236"/>
    <line x1="819" y1="214" x2="819" y2="236"/>
  </g>
  <!-- BamHI sites (blue) -->
  <g stroke="#2a6f97" stroke-width="2.5">
    <line x1="249.4" y1="134" x2="249.4" y2="156"/><line x1="492.5" y1="134" x2="492.5" y2="156"/>
    <line x1="573.7" y1="134" x2="573.7" y2="156"/><line x1="667.9" y1="134" x2="667.9" y2="156"/>
    <line x1="772.3" y1="134" x2="772.3" y2="156"/>
    <line x1="249.4" y1="214" x2="249.4" y2="236"/><line x1="492.5" y1="214" x2="492.5" y2="236"/>
    <line x1="573.7" y1="214" x2="573.7" y2="236"/><line x1="667.9" y1="214" x2="667.9" y2="236"/>
    <line x1="772.3" y1="214" x2="772.3" y2="236"/>
  </g>
  <!-- fragment sizes -->
  <g font-size="12" fill="#1b2a3a" text-anchor="middle">
    <text x="323" y="58">21,226</text><text x="511.5" y="58">4,878</text><text x="587.5" y="58">5,643</text>
    <text x="681.8" y="58">7,421</text><text x="777" y="58">5,804</text><text x="844.5" y="58">3,530</text>

    <text x="209.7" y="128">5,505</text><text x="371" y="128">16,841</text><text x="533" y="128">5,626</text>
    <text x="620.8" y="128">6,527</text><text x="720" y="128">7,233</text><text x="821" y="128">6,770</text>

    <text x="209.7" y="208" fill="#6a994e" font-weight="bold">5,505</text><text x="362.9" y="208">15,721</text>
    <text x="519.6" y="208">3,758</text><text x="601" y="208">3,775</text><text x="701.6" y="208">4,669</text>
    <text x="795.7" y="208">3,240</text>
    <text x="484.4" y="252">1,120</text><text x="560.2" y="252">1,868</text><text x="648" y="252">2,752</text>
    <text x="753.8" y="252">2,564</text><text x="844.5" y="252" fill="#6a994e" font-weight="bold">3,530</text>
  </g>
  <!-- coordinate axis -->
  <line x1="170" y1="276" x2="870" y2="276" stroke="#1b2a3a" stroke-width="1.2"/>
  <g stroke="#1b2a3a" stroke-width="1.2">
    <line x1="170" y1="276" x2="170" y2="281"/><line x1="314.3" y1="276" x2="314.3" y2="281"/>
    <line x1="458.6" y1="276" x2="458.6" y2="281"/><line x1="603" y1="276" x2="603" y2="281"/>
    <line x1="747.3" y1="276" x2="747.3" y2="281"/><line x1="870" y1="276" x2="870" y2="281"/>
  </g>
  <g font-size="12" fill="#4a5866" text-anchor="middle">
    <text x="170" y="295">0</text><text x="314.3" y="295">10</text><text x="458.6" y="295">20</text>
    <text x="603" y="295">30</text><text x="747.3" y="295">40</text><text x="870" y="295">48.5 kb</text>
  </g>
  <text x="20" y="320" font-size="13" fill="#5a6b7a">Red ticks: EcoRI sites. Blue ticks: BamHI sites. Green: a piece that survives the double digest unchanged (an end of λ).</text>
</svg>
