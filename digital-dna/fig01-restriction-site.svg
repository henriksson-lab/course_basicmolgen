<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif" width="900" height="330">
  <!-- EcoRI recognition site as a palindrome, the staggered cut and the sticky ends; three cut types below. Sites from REBASE. -->
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#1b2a3a">1. The EcoRI site reads the same 5'→3' on both strands</text>
  <g font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="#1b2a3a" text-anchor="middle">
    <text x="40" y="78" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#5a6b7a">5'</text>
    <text x="80" y="78">A</text><text x="108" y="78">C</text>
    <text x="136" y="78" fill="#2a6f97">G</text><text x="164" y="78" fill="#2a6f97">A</text><text x="192" y="78" fill="#2a6f97">A</text>
    <text x="220" y="78" fill="#2a6f97">T</text><text x="248" y="78" fill="#2a6f97">T</text><text x="276" y="78" fill="#2a6f97">C</text>
    <text x="304" y="78">T</text><text x="332" y="78">G</text>
    <text x="370" y="78" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#5a6b7a">3'</text>
    <text x="40" y="120" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#5a6b7a">3'</text>
    <text x="80" y="120">T</text><text x="108" y="120">G</text>
    <text x="136" y="120" fill="#2a6f97">C</text><text x="164" y="120" fill="#2a6f97">T</text><text x="192" y="120" fill="#2a6f97">T</text>
    <text x="220" y="120" fill="#2a6f97">A</text><text x="248" y="120" fill="#2a6f97">A</text><text x="276" y="120" fill="#2a6f97">G</text>
    <text x="304" y="120">A</text><text x="332" y="120">C</text>
    <text x="370" y="120" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#5a6b7a">5'</text>
  </g>
  <rect x="122" y="54" width="168" height="74" rx="5" fill="none" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- staggered cut: top between G and A (x=150), bottom between A and G (x=262) -->
  <path d="M150,50 L150,95 L262,95 L262,132" fill="none" stroke="#bc4749" stroke-width="3"/>
  <text x="206" y="152" font-size="13" fill="#bc4749" text-anchor="middle">EcoRI cuts here (G^AATTC)</text>
  <!-- arrow to products -->
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/></marker></defs>
  <line x1="398" y1="99" x2="452" y2="99" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
  <g font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="#1b2a3a" text-anchor="middle">
    <text x="480" y="78">A</text><text x="508" y="78">C</text><text x="536" y="78" fill="#2a6f97">G</text>
    <text x="480" y="120">T</text><text x="508" y="120">G</text><text x="536" y="120" fill="#2a6f97">C</text>
    <text x="564" y="120" fill="#bc4749">T</text><text x="592" y="120" fill="#bc4749">T</text><text x="620" y="120" fill="#bc4749">A</text><text x="648" y="120" fill="#bc4749">A</text>
    <text x="704" y="78" fill="#bc4749">A</text><text x="732" y="78" fill="#bc4749">A</text><text x="760" y="78" fill="#bc4749">T</text><text x="788" y="78" fill="#bc4749">T</text>
    <text x="816" y="78" fill="#2a6f97">C</text><text x="844" y="78">T</text><text x="872" y="78">G</text>
    <text x="816" y="120" fill="#2a6f97">G</text><text x="844" y="120">A</text><text x="872" y="120">C</text>
  </g>
  <text x="606" y="152" font-size="13" fill="#bc4749" text-anchor="middle">single-stranded 5' AATT overhangs</text>
  <text x="790" y="152" font-size="13" fill="#bc4749" text-anchor="middle">("sticky ends")</text>
  <text x="440" y="186" font-size="13" fill="#5a6b7a">Any two EcoRI ends can base-pair (AATT with TTAA), so DNA ligase can join</text>
  <text x="440" y="204" font-size="13" fill="#5a6b7a">fragments from different sources: the basis of cloning.</text>
  <text x="20" y="186" font-size="13" fill="#5a6b7a">Top strand 5'→3': GAATTC.</text>
  <text x="20" y="204" font-size="13" fill="#5a6b7a">Bottom strand 5'→3': GAATTC. A palindrome.</text>
  <line x1="20" y1="222" x2="880" y2="222" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="20" y="248" font-size="16" font-weight="bold" fill="#1b2a3a">2. Overhangs, blunt ends and site length</text>
  <g font-size="14" fill="#1b2a3a">
    <text x="20" y="276"><tspan font-weight="bold">EcoRI</tspan>  G^AATTC</text>
    <text x="20" y="298" fill="#5a6b7a">5' overhang (sticky)</text>
    <text x="250" y="276"><tspan font-weight="bold">PstI</tspan>  CTGCA^G</text>
    <text x="250" y="298" fill="#5a6b7a">3' overhang (sticky)</text>
    <text x="480" y="276"><tspan font-weight="bold">SmaI</tspan>  CCC^GGG</text>
    <text x="480" y="298" fill="#5a6b7a">blunt ends</text>
    <text x="680" y="276"><tspan font-weight="bold">DdeI</tspan>  C^TNAG</text>
    <text x="680" y="298" fill="#5a6b7a">4-bp site (N = any base)</text>
  </g>
  <text x="20" y="322" font-size="13" fill="#5a6b7a">In random DNA a given 6-bp site occurs about once per 4<tspan dy="-6" font-size="10">6</tspan><tspan dy="6"> = 4,096</tspan> bp; a 4-bp site once per 4<tspan dy="-6" font-size="10">4</tspan><tspan dy="6"> = 256</tspan> bp.</text>
</svg>
