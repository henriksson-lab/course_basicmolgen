<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif" width="900" height="380">
  <!-- One PCR cycle (denature, anneal, extend) and exponential doubling over cycles. Temperatures are typical values. -->
  <defs>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#6a994e"/></marker>
  </defs>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#1b2a3a">1. One cycle</text>
  <!-- column A: denature -->
  <text x="95" y="62" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">denature</text>
  <text x="95" y="80" font-size="13" fill="#5a6b7a" text-anchor="middle">94–98 °C</text>
  <line x1="30" y1="120" x2="160" y2="120" stroke="#2a6f97" stroke-width="4"/>
  <line x1="30" y1="170" x2="160" y2="170" stroke="#bc4749" stroke-width="4"/>
  <text x="26" y="110" font-size="11" fill="#5a6b7a">5'</text><text x="152" y="110" font-size="11" fill="#5a6b7a">3'</text>
  <text x="26" y="188" font-size="11" fill="#5a6b7a">3'</text><text x="152" y="188" font-size="11" fill="#5a6b7a">5'</text>
  <text x="95" y="215" font-size="13" fill="#1b2a3a" text-anchor="middle">strands separate</text>
  <!-- column B: anneal -->
  <text x="265" y="62" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">anneal</text>
  <text x="265" y="80" font-size="13" fill="#5a6b7a" text-anchor="middle">about 55–65 °C</text>
  <line x1="200" y1="120" x2="330" y2="120" stroke="#2a6f97" stroke-width="4"/>
  <line x1="200" y1="170" x2="330" y2="170" stroke="#bc4749" stroke-width="4"/>
  <line x1="202" y1="160" x2="232" y2="160" stroke="#6a994e" stroke-width="5" marker-end="url(#ag)"/>
  <line x1="328" y1="130" x2="298" y2="130" stroke="#6a994e" stroke-width="5" marker-end="url(#ag)"/>
  <text x="265" y="215" font-size="13" fill="#1b2a3a" text-anchor="middle">primers bind</text>
  <!-- column C: extend -->
  <text x="435" y="62" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">extend</text>
  <text x="435" y="80" font-size="13" fill="#5a6b7a" text-anchor="middle">72 °C</text>
  <line x1="370" y1="120" x2="500" y2="120" stroke="#2a6f97" stroke-width="4"/>
  <line x1="370" y1="170" x2="500" y2="170" stroke="#bc4749" stroke-width="4"/>
  <line x1="372" y1="160" x2="402" y2="160" stroke="#6a994e" stroke-width="5"/>
  <line x1="402" y1="160" x2="492" y2="160" stroke="#6a994e" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#ag)"/>
  <line x1="498" y1="130" x2="468" y2="130" stroke="#6a994e" stroke-width="5"/>
  <line x1="468" y1="130" x2="378" y2="130" stroke="#6a994e" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#ag)"/>
  <text x="435" y="215" font-size="13" fill="#1b2a3a" text-anchor="middle">polymerase copies</text>
  <text x="435" y="232" font-size="13" fill="#1b2a3a" text-anchor="middle">from each primer</text>
  <line x1="20" y1="252" x2="510" y2="252" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="30" y1="276" x2="60" y2="276" stroke="#6a994e" stroke-width="5"/>
  <text x="68" y="281" font-size="13" fill="#1b2a3a">primers: about 18–25 nt, one for each strand, pointing at each other</text>
  <text x="30" y="306" font-size="13" fill="#1b2a3a">The product is the DNA between (and including) the two primers.</text>
  <text x="30" y="328" font-size="13" fill="#1b2a3a">A heat-stable polymerase (Taq) survives the 95 °C steps.</text>
  <text x="30" y="350" font-size="13" fill="#5a6b7a">Repeat 25–35 times: each cycle takes a few minutes.</text>

  <text x="550" y="26" font-size="16" font-weight="bold" fill="#1b2a3a">2. Copies double every cycle</text>
  <line x1="560" y1="300" x2="870" y2="300" stroke="#1b2a3a" stroke-width="1.5"/>
  <g fill="#2a6f97">
    <rect x="570" y="293.75" width="34" height="6.25"/>
    <rect x="620" y="287.5" width="34" height="12.5"/>
    <rect x="670" y="275" width="34" height="25"/>
    <rect x="720" y="250" width="34" height="50"/>
    <rect x="770" y="200" width="34" height="100"/>
    <rect x="820" y="100" width="34" height="200"/>
  </g>
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="587" y="286">1</text><text x="637" y="280">2</text><text x="687" y="268">4</text>
    <text x="737" y="243">8</text><text x="787" y="193">16</text><text x="837" y="93">32</text>
  </g>
  <g font-size="13" fill="#4a5866" text-anchor="middle">
    <text x="587" y="318">0</text><text x="637" y="318">1</text><text x="687" y="318">2</text>
    <text x="737" y="318">3</text><text x="787" y="318">4</text><text x="837" y="318">5</text>
  </g>
  <text x="712" y="338" font-size="13" fill="#1b2a3a" text-anchor="middle">cycle</text>
  <text x="560" y="62" font-size="14" fill="#1b2a3a">copies after <tspan font-style="italic">n</tspan> cycles:</text>
  <text x="560" y="84" font-size="14" fill="#1b2a3a"><tspan font-style="italic">N</tspan> = <tspan font-style="italic">N</tspan><tspan dy="4" font-size="10">0</tspan><tspan dy="-4"> × 2</tspan><tspan dy="-6" font-size="10" font-style="italic">n</tspan></text>
  <text x="560" y="128" font-size="13" fill="#5a6b7a">30 cycles: 2<tspan dy="-6" font-size="10">30</tspan><tspan dy="6"> ≈ 10</tspan><tspan dy="-6" font-size="10">9</tspan><tspan dy="6"> copies</tspan></text>
  <text x="560" y="146" font-size="13" fill="#5a6b7a">from one molecule</text>
  <text x="550" y="364" font-size="13" fill="#5a6b7a">In practice ×(1 + E) per cycle, E ≈ 0.9, until a plateau.</text>
</svg>
