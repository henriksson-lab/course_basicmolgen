<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" width="900" height="300">
  <!-- HGVS c. numbering around HBB (NM_000518.5), not to scale. Exon 1 ends at c.92, exon 2 starts at c.93
       (positions from the ClinVar names c.92+1G>A and c.93-21G>A). c.-78 is in the TATA box, c.*111 in the poly(A) signal. -->
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#1b2a3a">Every position is counted from the coding sequence (not to scale)</text>

  <!-- gene -->
  <line x1="30" y1="120" x2="120" y2="120" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="120" y="104" width="70" height="32" fill="#cfe0ec" stroke="#2a6f97" stroke-width="1.5"/>
  <rect x="190" y="104" width="140" height="32" fill="#2a6f97" stroke="#2a6f97" stroke-width="1.5"/>
  <line x1="330" y1="120" x2="560" y2="120" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="560" y="104" width="140" height="32" fill="#2a6f97" stroke="#2a6f97" stroke-width="1.5"/>
  <line x1="700" y1="120" x2="740" y2="120" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="740" y="104" width="50" height="32" fill="#2a6f97" stroke="#2a6f97" stroke-width="1.5"/>
  <rect x="790" y="104" width="90" height="32" fill="#cfe0ec" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="260" y="125" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">exon 1</text>
  <text x="445" y="125" font-size="13" fill="#5a6b7a" text-anchor="middle" dy="-10">intron 1</text>
  <text x="630" y="125" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">exon 2</text>
  <text x="835" y="125" font-size="12" fill="#2a6f97" text-anchor="middle">3' UTR</text>
  <text x="155" y="125" font-size="12" fill="#2a6f97" text-anchor="middle">5' UTR</text>

  <!-- markers above -->
  <g stroke="#bc4749" stroke-width="2">
    <line x1="70" y1="86" x2="70" y2="118"/>
    <line x1="191" y1="86" x2="191" y2="104"/>
    <line x1="329" y1="86" x2="329" y2="104"/>
    <line x1="561" y1="86" x2="561" y2="104"/>
    <line x1="789" y1="86" x2="789" y2="104"/>
  </g>
  <g font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#bc4749" text-anchor="middle">
    <text x="70" y="62">c.-78</text>
    <text x="191" y="62">c.1</text>
    <text x="329" y="62">c.92</text>
    <text x="561" y="62">c.93</text>
    <text x="789" y="62">stop</text>
  </g>
  <g font-size="12" fill="#5a6b7a" text-anchor="middle">
    <text x="70" y="78">TATA box</text>
    <text x="191" y="78">A of ATG</text>
    <text x="329" y="78">last base, exon 1</text>
    <text x="561" y="78">first base, exon 2</text>
    <text x="789" y="78">c.442–444</text>
  </g>

  <!-- markers below -->
  <g stroke="#bc4749" stroke-width="2">
    <line x1="338" y1="122" x2="338" y2="160"/>
    <line x1="520" y1="122" x2="520" y2="160"/>
    <line x1="845" y1="136" x2="845" y2="160"/>
  </g>
  <g font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#bc4749">
    <text x="338" y="178" text-anchor="middle">c.92+1</text>
    <text x="520" y="178" text-anchor="middle">c.93-21</text>
    <text x="880" y="178" text-anchor="end">c.*111</text>
  </g>
  <g font-size="12" fill="#5a6b7a">
    <text x="338" y="194" text-anchor="middle">1st intron base after c.92</text>
    <text x="520" y="194" text-anchor="middle">21 bases before c.93</text>
    <text x="880" y="194" text-anchor="end">111 bases after the stop</text>
  </g>

  <!-- rules -->
  <rect x="20" y="214" width="860" height="76" rx="8" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="36" y="238" font-size="13" fill="#1b2a3a"><tspan font-weight="bold">Coding bases:</tspan> c.1 is the A of ATG; count only exon bases, so the numbers jump over introns (c.92 → c.93).</text>
  <text x="36" y="258" font-size="13" fill="#1b2a3a"><tspan font-weight="bold">Outside the coding sequence:</tspan> c.-n before the ATG, c.*n after the stop codon.</text>
  <text x="36" y="278" font-size="13" fill="#1b2a3a"><tspan font-weight="bold">Intron bases:</tspan> counted from the nearest exon base: c.92+n after it, c.93-n before the next exon.</text>
</svg>
