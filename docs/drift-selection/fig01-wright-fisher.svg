  <text x="730" y="80" font-size="16" font-weight="bold" fill="#1b2a3a">Wright–Fisher model</text>
  <text x="730" y="108" font-size="14" fill="#555">Each new gene copy picks</text>
  <text x="730" y="130" font-size="14" fill="#555">a parent copy at random.</text>
  <text x="730" y="152" font-size="14" fill="#555">Some copies leave several</text>
  <text x="730" y="174" font-size="14" fill="#555">descendants, some none.</text>
  <text x="730" y="196" font-size="14" fill="#555"></text>
  <text x="730" y="218" font-size="14" fill="#555">So p wanders by chance:</text>
  <text x="730" y="240" font-size="14" fill="#555">genetic drift.</text>
  <text x="730" y="262" font-size="14" fill="#555"></text>
  <text x="730" y="284" font-size="14" fill="#555">Number of A copies next</text>
  <text x="730" y="306" font-size="14" fill="#555">generation ~ Binomial(2N, p).</text>
