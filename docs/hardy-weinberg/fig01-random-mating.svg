  <text x="700" y="250" font-size="15" fill="#555">sum: (p + q)<tspan dy="-7" font-size="11">2</tspan><tspan dy="7"> </tspan>= 1</text>
  <text x="700" y="290" font-size="15" fill="#555">allele A next time:</text>
  <text x="700" y="312" font-size="15" fill="#555">p<tspan dy="-7" font-size="11">2</tspan><tspan dy="7"> </tspan>+ pq = p(p + q) = p</text>
