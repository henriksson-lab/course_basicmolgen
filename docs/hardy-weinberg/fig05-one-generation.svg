<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Helvetica, Arial, sans-serif">
  <!-- fig05: one generation of random mating reaches HWE. Founders 0.50 AA, 0.20 Aa, 0.30 aa (p = 0.6).
       Bars: height = 400 px per unit frequency, baseline y = 250. -->
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/></marker></defs>

  <!-- generation 0 -->
  <text x="106" y="24" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Generation 0</text>
  <text x="106" y="43" font-size="13" fill="#bc4749" text-anchor="middle">not in HWE</text>
  <rect x="30" y="50" width="44" height="200" fill="#cfe0ec" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="84" y="170" width="44" height="80" fill="#f6e2c2" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="138" y="130" width="44" height="120" fill="#f1d3d3" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="52" y="66" font-size="13" fill="#1b2a3a" text-anchor="middle">0.50</text>
  <text x="106" y="164" font-size="13" fill="#1b2a3a" text-anchor="middle">0.20</text>
  <text x="160" y="124" font-size="13" fill="#1b2a3a" text-anchor="middle">0.30</text>
  <text x="52" y="270" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">AA</text>
  <text x="106" y="270" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">Aa</text>
  <text x="160" y="270" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">aa</text>
  <text x="106" y="298" font-size="14" fill="#1b2a3a" text-anchor="middle">p = 0.50 + 0.20/2 = 0.6</text>

  <!-- arrow 0 -> 1 -->
  <text x="282" y="128" font-size="14" fill="#1b2a3a" text-anchor="middle">random mating</text>
  <line x1="205" y1="140" x2="355" y2="140" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="282" y="162" font-size="13" fill="#555" text-anchor="middle">gametes: p = 0.6, q = 0.4</text>

  <!-- generation 1 -->
  <text x="450" y="24" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Generation 1</text>
  <text x="398" y="43" font-size="13" fill="#2a7a3b">HWE: p<tspan dy="-6" font-size="9">2</tspan><tspan dy="6">, 2pq, q</tspan><tspan dy="-6" font-size="9">2</tspan></text>
  <rect x="374" y="106" width="44" height="144" fill="#cfe0ec" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="428" y="58" width="44" height="192" fill="#f6e2c2" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="482" y="186" width="44" height="64" fill="#f1d3d3" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="396" y="100" font-size="13" fill="#1b2a3a" text-anchor="middle">0.36</text>
  <text x="450" y="74" font-size="13" fill="#1b2a3a" text-anchor="middle">0.48</text>
  <text x="504" y="180" font-size="13" fill="#1b2a3a" text-anchor="middle">0.16</text>
  <text x="396" y="270" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">AA</text>
  <text x="450" y="270" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">Aa</text>
  <text x="504" y="270" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">aa</text>
  <text x="450" y="298" font-size="14" fill="#1b2a3a" text-anchor="middle">p = 0.36 + 0.48/2 = 0.6</text>

  <!-- arrow 1 -> 2 -->
  <text x="626" y="128" font-size="14" fill="#1b2a3a" text-anchor="middle">random mating</text>
  <line x1="549" y1="140" x2="699" y2="140" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="626" y="162" font-size="13" fill="#555" text-anchor="middle">gametes: p = 0.6, q = 0.4</text>

  <!-- generation 2 -->
  <text x="794" y="24" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Generation 2</text>
  <text x="794" y="43" font-size="13" fill="#2a7a3b" text-anchor="middle">unchanged</text>
  <rect x="718" y="106" width="44" height="144" fill="#cfe0ec" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="772" y="58" width="44" height="192" fill="#f6e2c2" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="826" y="186" width="44" height="64" fill="#f1d3d3" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="740" y="100" font-size="13" fill="#1b2a3a" text-anchor="middle">0.36</text>
  <text x="794" y="74" font-size="13" fill="#1b2a3a" text-anchor="middle">0.48</text>
  <text x="848" y="180" font-size="13" fill="#1b2a3a" text-anchor="middle">0.16</text>
  <text x="740" y="270" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">AA</text>
  <text x="794" y="270" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">Aa</text>
  <text x="848" y="270" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">aa</text>
  <text x="794" y="298" font-size="14" fill="#1b2a3a" text-anchor="middle">p = 0.6</text>

  <line x1="20" y1="250" x2="880" y2="250" stroke="#1b2a3a" stroke-width="1"/>
  <text x="450" y="328" font-size="14" fill="#555" text-anchor="middle">One generation of random mating reaches HWE; the allele frequency never moves.</text>
</svg>
