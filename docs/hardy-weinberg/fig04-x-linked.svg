<svg xmlns="http://www.w3.org/2000/svg" width="820" height="345" viewBox="0 0 820 345" font-family="Helvetica, Arial, sans-serif">
  <!-- fig04: X-linked recessive trait, q = 0.08 (red-green colour blindness, approximate, N Europe) -->
  <line x1="120" y1="300.0" x2="450" y2="300.0" stroke="#e6e6e6"/>
  <text x="112" y="305.0" font-size="14" fill="#1b2a3a" text-anchor="end">0%</text>
  <line x1="120" y1="252.0" x2="450" y2="252.0" stroke="#e6e6e6"/>
  <text x="112" y="257.0" font-size="14" fill="#1b2a3a" text-anchor="end">2%</text>
  <line x1="120" y1="204.0" x2="450" y2="204.0" stroke="#e6e6e6"/>
  <text x="112" y="209.0" font-size="14" fill="#1b2a3a" text-anchor="end">4%</text>
  <line x1="120" y1="156.0" x2="450" y2="156.0" stroke="#e6e6e6"/>
  <text x="112" y="161.0" font-size="14" fill="#1b2a3a" text-anchor="end">6%</text>
  <line x1="120" y1="108.0" x2="450" y2="108.0" stroke="#e6e6e6"/>
  <text x="112" y="113.0" font-size="14" fill="#1b2a3a" text-anchor="end">8%</text>
  <line x1="120" y1="60.0" x2="450" y2="60.0" stroke="#e6e6e6"/>
  <text x="112" y="65.0" font-size="14" fill="#1b2a3a" text-anchor="end">10%</text>
  <line x1="120" y1="300" x2="450" y2="300" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="120" y1="300" x2="120" y2="60" stroke="#1b2a3a" stroke-width="1.5"/>
  <text transform="translate(40,180.0) rotate(-90)" font-size="15" fill="#1b2a3a" text-anchor="middle">affected</text>
  <rect x="170" y="108.0" width="90" height="192.0" fill="#2a6f97"/>
  <text x="215" y="324" font-size="16" fill="#1b2a3a" text-anchor="middle">males</text>
  <text x="215" y="98.0" font-size="16" font-weight="bold" fill="#2a6f97" text-anchor="middle">q = 8%</text>
  <rect x="320" y="284.6" width="90" height="15.4" fill="#bc4749"/>
  <text x="365" y="324" font-size="16" fill="#1b2a3a" text-anchor="middle">females</text>
  <text x="332" y="274.6" font-size="16" font-weight="bold" fill="#bc4749">q<tspan dy="-7" font-size="12">2</tspan><tspan dy="7"> </tspan>= 0.64%</text>
  <text x="500" y="90" font-size="17" font-weight="bold" fill="#1b2a3a">X-linked recessive</text>
  <text x="500" y="122" font-size="15" fill="#1b2a3a">males (one X): affected = q</text>
  <text x="500" y="146" font-size="15" fill="#1b2a3a">females (two X): affected = q<tspan dy="-7" font-size="11">2</tspan><tspan dy="7"> </tspan></text>
  <text x="500" y="170" font-size="15" fill="#1b2a3a">carrier females = 2pq</text>
  <text x="500" y="210" font-size="15" fill="#555">ratio males : females = 1/q</text>
  <text x="500" y="232" font-size="15" fill="#555">here 1/0.08 = 12.5 times</text>
  <text x="500" y="254" font-size="15" fill="#555">more affected males</text>
  <text x="500" y="294" font-size="14" fill="#555">Example: red–green colour</text>
  <text x="500" y="314" font-size="14" fill="#555">blindness, q ≈ 0.08</text>
</svg>
