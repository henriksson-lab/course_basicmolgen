<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif">
  <!-- fig06: a gene tree for the globins, simplified.
       An ancestral globin gene duplicated (square node) into alpha and beta globin genes.
       Later the human and mouse lineages split (circle nodes, speciation), and each kept both genes.
       Orthologs: last common ancestor is a speciation. Paralogs: last common ancestor is a duplication.
       (Both alpha and beta have duplicated again since; that is left out.) -->

  <!-- tree lines -->
  <line x1="450" y1="64" x2="450" y2="92" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="250" y1="104" x2="650" y2="104" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="250" y1="104" x2="250" y2="160" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="650" y1="104" x2="650" y2="160" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="150" y1="172" x2="350" y2="172" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="550" y1="172" x2="750" y2="172" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="150" y1="172" x2="150" y2="220" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="350" y1="172" x2="350" y2="220" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="550" y1="172" x2="550" y2="220" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="750" y1="172" x2="750" y2="220" stroke="#1b2a3a" stroke-width="2.5"/>

  <!-- root -->
  <rect x="350" y="20" width="200" height="44" rx="8" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="2"/>
  <text x="450" y="48" font-size="16" fill="#1b2a3a" text-anchor="middle">ancestral globin gene</text>

  <!-- duplication node (square) -->
  <rect x="440" y="94" width="20" height="20" fill="#c0504d"/>
  <text x="472" y="90" font-size="15" fill="#c0504d">duplication</text>

  <!-- speciation nodes (circles) -->
  <circle cx="250" cy="172" r="10" fill="#2a6f97"/>
  <circle cx="650" cy="172" r="10" fill="#2a6f97"/>
  <text x="250" y="202" font-size="15" fill="#2a6f97" text-anchor="middle">human–mouse split</text>
  <text x="650" y="202" font-size="15" fill="#2a6f97" text-anchor="middle">human–mouse split</text>

  <!-- leaves -->
  <rect x="80" y="222" width="140" height="50" rx="8" fill="#e3eef5" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="150" y="243" font-size="15" fill="#1b2a3a" text-anchor="middle">human</text>
  <text x="150" y="263" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">α-globin</text>
  <rect x="280" y="222" width="140" height="50" rx="8" fill="#e3eef5" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="350" y="243" font-size="15" fill="#1b2a3a" text-anchor="middle">mouse</text>
  <text x="350" y="263" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">α-globin</text>
  <rect x="480" y="222" width="140" height="50" rx="8" fill="#f8ead2" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="550" y="243" font-size="15" fill="#1b2a3a" text-anchor="middle">human</text>
  <text x="550" y="263" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">β-globin</text>
  <rect x="680" y="222" width="140" height="50" rx="8" fill="#f8ead2" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="750" y="243" font-size="15" fill="#1b2a3a" text-anchor="middle">mouse</text>
  <text x="750" y="263" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">β-globin</text>

  <!-- legend -->
  <circle cx="90" cy="310" r="8" fill="#2a6f97"/>
  <text x="106" y="315" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">Orthologs</tspan>: last shared ancestor is a speciation (human α and mouse α)</text>
  <rect x="82" y="333" width="16" height="16" fill="#c0504d"/>
  <text x="106" y="346" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">Paralogs</tspan>: last shared ancestor is a duplication (human α and human β)</text>
</svg>
