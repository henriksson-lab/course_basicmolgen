<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352" font-family="Helvetica, Arial, sans-serif">
  <!-- fig01: standard pedigree symbols (left) and how lines and numbers are read (right) -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ===== left: symbol grid, 4 columns (centres x = 75, 195, 315, 435), 2 rows (y = 60, 200) ===== -->
  <g stroke="#1b2a3a" stroke-width="2.2" fill="#fff">
    <!-- row 1 -->
    <rect x="58" y="43" width="34" height="34"/>                       <!-- male -->
    <circle cx="195" cy="60" r="17"/>                                  <!-- female -->
    <path d="M315,40 L335,60 L315,80 L295,60 Z"/>                      <!-- sex unknown -->
    <rect x="401" y="43" width="34" height="34" fill="#1b2a3a"/>       <!-- affected male -->
    <circle cx="470" cy="60" r="17" fill="#1b2a3a"/>                   <!-- affected female -->
    <!-- row 2 -->
    <rect x="41" y="183" width="34" height="34"/>                      <!-- carrier male -->
    <rect x="41" y="183" width="17" height="34" fill="#1b2a3a" stroke="none"/>
    <circle cx="110" cy="200" r="17"/>                                 <!-- carrier female -->
    <path d="M110,183 A17,17 0 0 0 110,217 Z" fill="#1b2a3a" stroke="none"/>
    <rect x="178" y="183" width="34" height="34"/>                     <!-- deceased -->
    <line x1="172" y1="223" x2="218" y2="177"/>
    <rect x="315" y="183" width="34" height="34" fill="#1b2a3a"/>      <!-- proband -->
    <rect x="401" y="183" width="34" height="34"/>                     <!-- consanguinity -->
    <circle cx="502" cy="200" r="17"/>
    <line x1="435" y1="196.5" x2="485" y2="196.5"/>
    <line x1="435" y1="203.5" x2="485" y2="203.5"/>
  </g>
  <line x1="290" y1="240" x2="311" y2="221" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arr)"/>

  <g fill="#1b2a3a" font-size="15" text-anchor="middle">
    <text x="75" y="106">male</text>
    <text x="195" y="106">female</text>
    <text x="315" y="106">sex unknown</text>
    <text x="452" y="106">affected</text>
    <text x="452" y="124" font-size="13" fill="#555">(filled)</text>

    <text x="75" y="246">carrier</text>
    <text x="75" y="264" font-size="13" fill="#555">(heterozygote)</text>
    <text x="195" y="246">deceased</text>
    <text x="332" y="262">proband</text>
    <text x="332" y="280" font-size="13" fill="#555">(how the family</text>
    <text x="332" y="296" font-size="13" fill="#555">was found)</text>
    <text x="452" y="246">consanguineous</text>
    <text x="452" y="264">mating</text>
    <text x="452" y="282" font-size="13" fill="#555">(related partners)</text>
  </g>

  <line x1="566" y1="22" x2="566" y2="330" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- ===== right: a two-generation family with its lines named ===== -->
  <!-- parents at y=70 (x=680, 760); children at y=220 (x=640, 720, 800) -->
  <g fill="#1b2a3a" font-size="18" font-weight="bold">
    <text x="592" y="76">I</text>
    <text x="592" y="226">II</text>
  </g>
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="697" y1="70" x2="743" y2="70"/>                          <!-- mating line -->
    <line x1="720" y1="70" x2="720" y2="160"/>                         <!-- line of descent -->
    <line x1="640" y1="160" x2="800" y2="160"/>                        <!-- sibship line -->
    <line x1="640" y1="160" x2="640" y2="203"/>
    <line x1="720" y1="160" x2="720" y2="203"/>
    <line x1="800" y1="160" x2="800" y2="203"/>
  </g>
  <g stroke="#1b2a3a" stroke-width="2.2" fill="#fff">
    <rect x="663" y="53" width="34" height="34"/>
    <circle cx="760" cy="70" r="17"/>
    <circle cx="640" cy="220" r="17"/>
    <rect x="703" y="203" width="34" height="34" fill="#1b2a3a"/>
    <circle cx="800" cy="220" r="17"/>
  </g>
  <g fill="#555" font-size="13" text-anchor="middle">
    <text x="680" y="104">1</text><text x="760" y="104">2</text>
    <text x="640" y="254">1</text><text x="720" y="254">2</text><text x="800" y="254">3</text>
  </g>
  <!-- name tags, blue, with leaders that stop short of the lines -->
  <g fill="#2a6f97" font-size="14">
    <text x="720" y="24" text-anchor="middle">mating line</text>
    <text x="736" y="124">line of descent</text>
    <text x="816" y="164">sibship</text>
    <text x="816" y="180">line</text>
    <text x="720" y="290" text-anchor="middle">this person is II-2</text>
    <text x="720" y="308" text-anchor="middle" font-size="13" fill="#555">(generation II, 2nd from the left)</text>
  </g>
  <g stroke="#2a6f97" stroke-width="1.5" fill="none">
    <line x1="720" y1="30" x2="720" y2="65" marker-end="url(#arrB)"/>
  </g>
</svg>
