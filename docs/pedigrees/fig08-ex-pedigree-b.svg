<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <!-- fig08: exercise pedigree B -->
  <!-- layout: x = 80 + slot*70; y = 40 + (generation-1)*105; symbols 34px -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#bc4749"/></marker>
  </defs>
  <!-- generation numerals -->
  <g fill="#1b2a3a" font-size="18" font-weight="bold">
    <text x="16" y="46">I</text>
    <text x="16" y="151">II</text>
    <text x="16" y="256">III</text>
  </g>
  <!-- mating lines (double = consanguineous) and descent lines -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <!-- i1 x i2 -->
    <line x1="342.0" y1="40" x2="378.0" y2="40"/>
    <line x1="360.0" y1="40" x2="360.0" y2="104.0"/>
    <line x1="220" y1="104.0" x2="500" y2="104.0"/>
    <line x1="220" y1="104.0" x2="220" y2="128.0"/>
    <line x1="360" y1="104.0" x2="360" y2="128.0"/>
    <line x1="500" y1="104.0" x2="500" y2="128.0"/>
    <!-- s1 x a -->
    <line x1="167.0" y1="145" x2="203.0" y2="145"/>
    <line x1="185.0" y1="145" x2="185.0" y2="209.0"/>
    <line x1="115.0" y1="209.0" x2="255.0" y2="209.0"/>
    <line x1="115.0" y1="209.0" x2="115.0" y2="233.0"/>
    <line x1="185.0" y1="209.0" x2="185.0" y2="233.0"/>
    <line x1="255.0" y1="209.0" x2="255.0" y2="233.0"/>
    <!-- c x s2 -->
    <line x1="517.0" y1="145" x2="553.0" y2="145"/>
    <line x1="535.0" y1="145" x2="535.0" y2="209.0"/>
    <line x1="465.0" y1="209.0" x2="605.0" y2="209.0"/>
    <line x1="465.0" y1="209.0" x2="465.0" y2="233.0"/>
    <line x1="535.0" y1="209.0" x2="535.0" y2="233.0"/>
    <line x1="605.0" y1="209.0" x2="605.0" y2="233.0"/>
  </g>
  <!-- individuals: square = male, circle = female, filled = affected, half = carrier -->
  <g><!-- i1: M n -->
    <rect x="308.0" y="23.0" width="34" height="34" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="325.0" y="74.0" font-size="13" fill="#555" text-anchor="middle">1</text>
  </g>
  <g><!-- i2: F n -->
    <circle cx="395.0" cy="40" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="395.0" y="74.0" font-size="13" fill="#555" text-anchor="middle">2</text>
  </g>
  <g><!-- s1: M n -->
    <rect x="133.0" y="128.0" width="34" height="34" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="150" y="179.0" font-size="13" fill="#555" text-anchor="middle">1</text>
  </g>
  <g><!-- a: F n -->
    <circle cx="220" cy="145" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="220" y="179.0" font-size="13" fill="#555" text-anchor="middle">2</text>
  </g>
  <g><!-- b: M a -->
    <rect x="343.0" y="128.0" width="34" height="34" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="360" y="179.0" font-size="13" fill="#555" text-anchor="middle">3</text>
  </g>
  <g><!-- c: F n -->
    <circle cx="500" cy="145" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="500" y="179.0" font-size="13" fill="#555" text-anchor="middle">4</text>
  </g>
  <g><!-- s2: M n -->
    <rect x="553.0" y="128.0" width="34" height="34" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="570" y="179.0" font-size="13" fill="#555" text-anchor="middle">5</text>
  </g>
  <g><!-- k1: M a -->
    <rect x="98.0" y="233.0" width="34" height="34" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="115.0" y="284.0" font-size="13" fill="#555" text-anchor="middle">1</text>
  </g>
  <g><!-- k2: F n -->
    <circle cx="185.0" cy="250" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="185.0" y="284.0" font-size="13" fill="#555" text-anchor="middle">2</text>
  </g>
  <g><!-- k3: M n -->
    <rect x="238.0" y="233.0" width="34" height="34" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="255.0" y="284.0" font-size="13" fill="#555" text-anchor="middle">3</text>
  </g>
  <g><!-- k4: M a -->
    <rect x="448.0" y="233.0" width="34" height="34" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="2.2"/>
    <line x1="422.0" y1="289.0" x2="443.0" y2="272.0" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arr)"/>
    <text x="465.0" y="284.0" font-size="13" fill="#555" text-anchor="middle">4</text>
  </g>
  <g><!-- k5: F n -->
    <circle cx="535.0" cy="250" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="535.0" y="284.0" font-size="13" fill="#555" text-anchor="middle">5</text>
  </g>
  <g><!-- k6: M a -->
    <rect x="588.0" y="233.0" width="34" height="34" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="605.0" y="284.0" font-size="13" fill="#555" text-anchor="middle">6</text>
  </g>
  <!-- annotations -->
  <text x="706" y="30" font-size="20" font-weight="bold" fill="#1b2a3a" text-anchor="end">Pedigree B</text>
</svg>
