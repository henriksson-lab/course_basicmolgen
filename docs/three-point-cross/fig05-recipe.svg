<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <!-- The recipe for a three-point testcross, as five boxes in a row. -->
  <rect x="6" y="20" width="148" height="200" rx="10" fill="#f4f6f8" stroke="#7a8794" stroke-width="1.5"/>
  <circle cx="30" cy="46" r="15" fill="#1b2a3a"/>
  <text x="30" y="52" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="50" y="52" font-size="16" font-weight="bold" fill="#1b2a3a">Pair up</text>
  <text x="80.0" y="92" font-size="15" fill="#1b2a3a" text-anchor="middle">8 classes →</text>
  <text x="80.0" y="116" font-size="15" fill="#1b2a3a" text-anchor="middle">4 reciprocal pairs</text>
  <line x1="156" y1="120" x2="166" y2="120" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="170" y="20" width="148" height="200" rx="10" fill="#f4f6f8" stroke="#7a8794" stroke-width="1.5"/>
  <circle cx="194" cy="46" r="15" fill="#1b2a3a"/>
  <text x="194" y="52" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="214" y="52" font-size="16" font-weight="bold" fill="#1b2a3a">Parentals</text>
  <text x="244.0" y="92" font-size="15" fill="#1b2a3a" text-anchor="middle">largest pair:</text>
  <text x="244.0" y="116" font-size="15" fill="#1b2a3a" text-anchor="middle">the female's</text>
  <text x="244.0" y="140" font-size="15" fill="#1b2a3a" text-anchor="middle">two chromosomes</text>
  <line x1="320" y1="120" x2="330" y2="120" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="334" y="20" width="148" height="200" rx="10" fill="#f4f6f8" stroke="#7a8794" stroke-width="1.5"/>
  <circle cx="358" cy="46" r="15" fill="#d08c2f"/>
  <text x="358" y="52" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="378" y="52" font-size="16" font-weight="bold" fill="#1b2a3a">DCOs</text>
  <text x="408.0" y="92" font-size="15" fill="#1b2a3a" text-anchor="middle">smallest pair;</text>
  <text x="408.0" y="116" font-size="15" fill="#1b2a3a" text-anchor="middle">the gene that</text>
  <text x="408.0" y="140" font-size="15" fill="#1b2a3a" text-anchor="middle">differs from the</text>
  <text x="408.0" y="164" font-size="15" fill="#1b2a3a" text-anchor="middle">parentals is</text>
  <text x="408.0" y="188" font-size="15" fill="#1b2a3a" text-anchor="middle">in the middle</text>
  <line x1="484" y1="120" x2="494" y2="120" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="498" y="20" width="148" height="200" rx="10" fill="#f4f6f8" stroke="#7a8794" stroke-width="1.5"/>
  <circle cx="522" cy="46" r="15" fill="#6a994e"/>
  <text x="522" y="52" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="542" y="52" font-size="16" font-weight="bold" fill="#1b2a3a">Distances</text>
  <text x="572.0" y="92" font-size="15" fill="#1b2a3a" text-anchor="middle">RF of each interval</text>
  <text x="572.0" y="116" font-size="15" fill="#1b2a3a" text-anchor="middle">= SCO in it + DCO,</text>
  <text x="572.0" y="140" font-size="15" fill="#1b2a3a" text-anchor="middle">÷ total</text>
  <line x1="648" y1="120" x2="658" y2="120" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="662" y="20" width="148" height="200" rx="10" fill="#f4f6f8" stroke="#7a8794" stroke-width="1.5"/>
  <circle cx="686" cy="46" r="15" fill="#7a5ea8"/>
  <text x="686" y="52" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="706" y="52" font-size="16" font-weight="bold" fill="#1b2a3a">Interference</text>
  <text x="736.0" y="92" font-size="15" fill="#1b2a3a" text-anchor="middle">expected DCO =</text>
  <text x="736.0" y="116" font-size="15" fill="#1b2a3a" text-anchor="middle">RF(I) × RF(II) × N;</text>
  <text x="736.0" y="140" font-size="15" fill="#1b2a3a" text-anchor="middle">CoC = obs / exp;</text>
  <text x="736.0" y="164" font-size="15" fill="#1b2a3a" text-anchor="middle">I = 1 − CoC</text>
</svg>
