<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="Helvetica, Arial, sans-serif">
  <!-- Left: expected vs observed double crossovers in the fly data (18.2 vs 11).
       Right: the CoC scale, from complete interference (0) via none (1) to negative (> 1). -->
  <line x1="60" y1="240" x2="330" y2="240" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="100" y="76.20000000000002" width="70" height="163.79999999999998" fill="#ffffff" stroke="#d08c2f" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="135" y="66.20000000000002" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">18.2</text>
  <text x="135" y="264" font-size="16" fill="#1b2a3a" text-anchor="middle">expected</text>
  <rect x="220" y="141" width="70" height="99" fill="#d08c2f" stroke="#d08c2f" stroke-width="2.5"/>
  <text x="255" y="131" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">11</text>
  <text x="255" y="264" font-size="16" fill="#1b2a3a" text-anchor="middle">observed</text>
  <text x="195" y="24" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Double crossovers in 2000 flies</text>
  <text x="135" y="290" font-size="13.5" fill="#5b6b7a" text-anchor="middle">0.070 × 0.130 × 2000</text>
  <text x="580" y="44" font-size="17" fill="#1b2a3a" text-anchor="middle">CoC = observed DCO / expected DCO = 11 / 18.2 = 0.60</text>
  <text x="580" y="74" font-size="17" fill="#1b2a3a" text-anchor="middle">interference I = 1 − CoC = 0.40</text>
  <rect x="420" y="152" width="226.7" height="16" fill="#f6e2c2"/>
  <rect x="646.7" y="152" width="113.3" height="16" fill="#dbe3ec"/>
  <line x1="420" y1="160" x2="760" y2="160" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="420.0" y1="148" x2="420.0" y2="172" stroke="#1b2a3a" stroke-width="2"/>
  <text x="420.0" y="192" font-size="15" fill="#1b2a3a" text-anchor="middle">0</text>
  <line x1="533.3" y1="148" x2="533.3" y2="172" stroke="#1b2a3a" stroke-width="2"/>
  <text x="533.3" y="192" font-size="15" fill="#1b2a3a" text-anchor="middle">0.5</text>
  <line x1="646.7" y1="148" x2="646.7" y2="172" stroke="#1b2a3a" stroke-width="2"/>
  <text x="646.7" y="192" font-size="15" fill="#1b2a3a" text-anchor="middle">1</text>
  <line x1="760.0" y1="148" x2="760.0" y2="172" stroke="#1b2a3a" stroke-width="2"/>
  <text x="760.0" y="192" font-size="15" fill="#1b2a3a" text-anchor="middle">1.5</text>
  <path d="M556.0,148 l-8,-14 l16,0 Z" fill="#d08c2f"/>
  <text x="556.0" y="128" font-size="15" font-weight="bold" fill="#a5650f" text-anchor="middle">our flies</text>
  <text x="414" y="218" font-size="14" fill="#1b2a3a">CoC 0: complete interference</text>
  <text x="414" y="238" font-size="14" fill="#5b6b7a">a crossover blocks a second one</text>
  <text x="646.7" y="264" font-size="14" fill="#1b2a3a" text-anchor="middle">CoC 1: no interference</text>
  <text x="646.7" y="284" font-size="14" fill="#5b6b7a" text-anchor="middle">crossovers independent</text>
  <text x="770" y="218" font-size="14" fill="#1b2a3a" text-anchor="end">&gt; 1: negative</text>
  <text x="770" y="238" font-size="14" fill="#5b6b7a" text-anchor="end">interference</text>
</svg>
