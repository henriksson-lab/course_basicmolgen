<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" font-family="Helvetica, Arial, sans-serif">
<!-- Four chromosomal sex-determination systems. Small bars are sex chromosomes; the heterogametic sex makes two kinds of gamete and so decides the sex of the offspring. -->
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/></marker></defs>
<rect x="10" y="10" width="218" height="310" rx="10" fill="#f4f6f8" stroke="#7a8794" stroke-width="1.5"/>
<text x="119.0" y="40" font-size="20" text-anchor="middle" fill="#1b2a3a" font-weight="bold">XX / XY</text>
<text x="119.0" y="62" font-size="14" text-anchor="middle" fill="#5b6b7a" font-weight="normal">male heterogametic</text>
<text x="70" y="98" font-size="24" text-anchor="middle" fill="#1b2a3a" font-weight="normal"><tspan font-family="DejaVu Sans, sans-serif">♀</tspan></text>
<rect x="53" y="122" width="10" height="50" rx="5" fill="#2a6f97"/>
<rect x="71" y="122" width="10" height="50" rx="5" fill="#2a6f97"/>
<text x="70" y="196" font-size="17" text-anchor="middle" fill="#1b2a3a" font-weight="bold">XX</text>
<text x="170" y="98" font-size="24" text-anchor="middle" fill="#1b2a3a" font-weight="normal"><tspan font-family="DejaVu Sans, sans-serif">♂</tspan></text>
<rect x="153" y="122" width="10" height="50" rx="5" fill="#2a6f97"/>
<rect x="171" y="146" width="10" height="26" rx="5" fill="#6a994e"/>
<text x="170" y="196" font-size="17" text-anchor="middle" fill="#1b2a3a" font-weight="bold">XY</text>
<text x="119.0" y="238" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">mammals: Y with SRY</text>
<text x="119.0" y="259" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">makes a male;</text>
<text x="119.0" y="280" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">fruit flies: the X : autosome</text>
<text x="119.0" y="301" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">ratio decides</text>
<rect x="240" y="10" width="218" height="310" rx="10" fill="#f4f6f8" stroke="#7a8794" stroke-width="1.5"/>
<text x="349.0" y="40" font-size="20" text-anchor="middle" fill="#1b2a3a" font-weight="bold">XX / XO</text>
<text x="349.0" y="62" font-size="14" text-anchor="middle" fill="#5b6b7a" font-weight="normal">male has one X, no Y</text>
<text x="300" y="98" font-size="24" text-anchor="middle" fill="#1b2a3a" font-weight="normal"><tspan font-family="DejaVu Sans, sans-serif">♀</tspan></text>
<rect x="283" y="122" width="10" height="50" rx="5" fill="#2a6f97"/>
<rect x="301" y="122" width="10" height="50" rx="5" fill="#2a6f97"/>
<text x="300" y="196" font-size="17" text-anchor="middle" fill="#1b2a3a" font-weight="bold">XX</text>
<text x="400" y="98" font-size="24" text-anchor="middle" fill="#1b2a3a" font-weight="normal"><tspan font-family="DejaVu Sans, sans-serif">♂</tspan></text>
<rect x="383" y="122" width="10" height="50" rx="5" fill="#2a6f97"/>
<text x="400" y="196" font-size="17" text-anchor="middle" fill="#1b2a3a" font-weight="bold">XO</text>
<text x="349.0" y="238" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">grasshoppers, crickets</text>
<text x="349.0" y="259" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">nematodes: XX is a</text>
<text x="349.0" y="280" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">hermaphrodite, XO a male</text>
<rect x="470" y="10" width="218" height="310" rx="10" fill="#f4f6f8" stroke="#7a8794" stroke-width="1.5"/>
<text x="579.0" y="40" font-size="20" text-anchor="middle" fill="#1b2a3a" font-weight="bold">ZZ / ZW</text>
<text x="579.0" y="62" font-size="14" text-anchor="middle" fill="#5b6b7a" font-weight="normal">female heterogametic</text>
<text x="530" y="98" font-size="24" text-anchor="middle" fill="#1b2a3a" font-weight="normal"><tspan font-family="DejaVu Sans, sans-serif">♂</tspan></text>
<rect x="513" y="122" width="10" height="50" rx="5" fill="#2a6f97"/>
<rect x="531" y="122" width="10" height="50" rx="5" fill="#2a6f97"/>
<text x="530" y="196" font-size="17" text-anchor="middle" fill="#1b2a3a" font-weight="bold">ZZ</text>
<text x="630" y="98" font-size="24" text-anchor="middle" fill="#1b2a3a" font-weight="normal"><tspan font-family="DejaVu Sans, sans-serif">♀</tspan></text>
<rect x="613" y="122" width="10" height="50" rx="5" fill="#2a6f97"/>
<rect x="631" y="140" width="10" height="32" rx="5" fill="#d08c2f"/>
<text x="630" y="196" font-size="17" text-anchor="middle" fill="#1b2a3a" font-weight="bold">ZW</text>
<text x="579.0" y="238" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">birds, butterflies</text>
<text x="579.0" y="259" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">and moths, some</text>
<text x="579.0" y="280" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">reptiles</text>
<rect x="700" y="10" width="218" height="310" rx="10" fill="#f4f6f8" stroke="#7a8794" stroke-width="1.5"/>
<text x="809.0" y="40" font-size="20" text-anchor="middle" fill="#1b2a3a" font-weight="bold">haplodiploidy</text>
<text x="809.0" y="62" font-size="14" text-anchor="middle" fill="#5b6b7a" font-weight="normal">no sex chromosomes</text>
<text x="760" y="98" font-size="24" text-anchor="middle" fill="#1b2a3a" font-weight="normal"><tspan font-family="DejaVu Sans, sans-serif">♀</tspan></text>
<rect x="730" y="128.0" width="7" height="44" rx="3.5" fill="#2a6f97"/>
<rect x="754" y="134.0" width="7" height="32" rx="3.5" fill="#2a6f97"/>
<rect x="778" y="139.0" width="7" height="22" rx="3.5" fill="#2a6f97"/>
<rect x="739" y="128.0" width="7" height="44" rx="3.5" fill="#bc4749"/>
<rect x="763" y="134.0" width="7" height="32" rx="3.5" fill="#bc4749"/>
<rect x="787" y="139.0" width="7" height="22" rx="3.5" fill="#bc4749"/>
<text x="760" y="196" font-size="17" text-anchor="middle" fill="#1b2a3a" font-weight="bold">2n</text>
<text x="860" y="98" font-size="24" text-anchor="middle" fill="#1b2a3a" font-weight="normal"><tspan font-family="DejaVu Sans, sans-serif">♂</tspan></text>
<rect x="830" y="128.0" width="7" height="44" rx="3.5" fill="#bc4749"/>
<rect x="854" y="134.0" width="7" height="32" rx="3.5" fill="#bc4749"/>
<rect x="878" y="139.0" width="7" height="22" rx="3.5" fill="#bc4749"/>
<text x="860" y="196" font-size="17" text-anchor="middle" fill="#1b2a3a" font-weight="bold">n</text>
<text x="809.0" y="238" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">bees, ants, wasps:</text>
<text x="809.0" y="259" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">fertilised egg → female</text>
<text x="809.0" y="280" font-size="14.5" text-anchor="middle" fill="#1b2a3a" font-weight="normal">unfertilised egg → male</text>
</svg>
