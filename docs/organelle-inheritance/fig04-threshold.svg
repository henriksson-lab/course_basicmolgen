    <line x1="184.0" y1="300" x2="184.0" y2="306" stroke="#1b2a3a"/><text x="184.0" y="324">20</text>
    <line x1="278.0" y1="300" x2="278.0" y2="306" stroke="#1b2a3a"/><text x="278.0" y="324">40</text>
    <line x1="372.0" y1="300" x2="372.0" y2="306" stroke="#1b2a3a"/><text x="372.0" y="324">60</text>
    <line x1="466.0" y1="300" x2="466.0" y2="306" stroke="#1b2a3a"/><text x="466.0" y="324">80</text>
    <line x1="560.0" y1="300" x2="560.0" y2="306" stroke="#1b2a3a"/><text x="560.0" y="324">100</text>
