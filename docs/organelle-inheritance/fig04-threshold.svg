    <line x1="90" y1="170.0" x2="560" y2="170.0"/>
    <line x1="90" y1="105.0" x2="560" y2="105.0"/>
    <line x1="90" y1="40.0" x2="560" y2="40.0"/>
  </g>
  <line x1="90" y1="300" x2="560" y2="300" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="90" y1="300" x2="90" y2="34" stroke="#1b2a3a" stroke-width="1.5"/>
