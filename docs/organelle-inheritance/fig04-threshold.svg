<svg xmlns="http://www.w3.org/2000/svg" width="780" height="366" viewBox="0 0 780 366" font-family="Helvetica, Arial, sans-serif">
  <!-- fig04: the threshold effect (schematic). Respiratory chain function stays near normal until the mutant fraction passes a threshold, then falls steeply. The threshold is lower in tissues with a high energy demand. -->
