  <rect x="30" y="145.5" width="170" height="9" fill="#2a6f97"/>
  <text x="214" y="155" font-size="14" font-weight="bold" fill="#5b6b7a" text-anchor="middle">P</text>
  <rect x="30" y="165.5" width="62" height="9" fill="#2a6f97"/>
  <rect x="92" y="165.5" width="48" height="9" fill="#bc4749"/>
  <rect x="140" y="165.5" width="60" height="9" fill="#2a6f97"/>
  <text x="214" y="175" font-size="14" font-weight="bold" fill="#5b6b7a" text-anchor="middle">P</text>
