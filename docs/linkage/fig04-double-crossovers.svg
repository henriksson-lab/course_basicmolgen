  <rect x="30" y="205.5" width="170" height="9" fill="#bc4749"/>
  <text x="214" y="215" font-size="14" font-weight="bold" fill="#5b6b7a" text-anchor="middle">P</text>
  <text x="115.0" y="244" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">0 of 4 recombinant</text>
  <!-- panel 2: three-strand, second crossover between chromatids 2 and 4 -->
  <text x="340.0" y="22" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">three-strand</text>
  <text x="267" y="50" font-size="15" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="middle">A</text>
