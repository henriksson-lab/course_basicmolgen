  <rect x="705" y="185.5" width="62" height="9" fill="#bc4749"/>
  <rect x="767" y="185.5" width="108" height="9" fill="#2a6f97"/>
  <text x="889" y="195" font-size="14" font-weight="bold" fill="#d08c2f" text-anchor="middle">R</text>
  <rect x="705" y="205.5" width="110" height="9" fill="#bc4749"/>
  <rect x="815" y="205.5" width="60" height="9" fill="#2a6f97"/>
  <text x="889" y="215" font-size="14" font-weight="bold" fill="#d08c2f" text-anchor="middle">R</text>
  <text x="790.0" y="244" font-size="16" font-weight="bold" fill="#d08c2f" text-anchor="middle">4 of 4 recombinant</text>
  <text x="450.0" y="284" font-size="15.5" fill="#1b2a3a" text-anchor="middle">The four kinds are equally likely: on average (0 + 2 + 2 + 4) / 4 = 2 of 4 products are recombinant.</text>
  <text x="450.0" y="306" font-size="15.5" fill="#1b2a3a" text-anchor="middle">Any number of crossovers (at least one) gives 50% recombinants on average, never more.</text>
</svg>
