  <text x="565.0" y="244" font-size="16" font-weight="bold" fill="#d08c2f" text-anchor="middle">2 of 4 recombinant</text>
  <!-- panel 4: four-strand, second crossover between chromatids 1 and 4 -->
  <text x="790.0" y="22" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">four-strand</text>
  <text x="717" y="50" font-size="15" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="middle">A</text>
  <text x="863" y="50" font-size="15" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="middle">B</text>
  <rect x="705" y="57.5" width="170" height="9" rx="4.5" fill="#2a6f97"/>
