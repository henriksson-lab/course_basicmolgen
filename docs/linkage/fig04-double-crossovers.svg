  <rect x="480" y="145.5" width="110" height="9" fill="#2a6f97"/>
  <rect x="590" y="145.5" width="60" height="9" fill="#bc4749"/>
  <text x="664" y="155" font-size="14" font-weight="bold" fill="#d08c2f" text-anchor="middle">R</text>
  <rect x="480" y="165.5" width="62" height="9" fill="#2a6f97"/>
