<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="Helvetica, Arial, sans-serif">
  <!-- Two crossovers between loci A and B. The first always joins chromatids 2 and 3; the second
       joins one blue and one red chromatid at random, giving four equally likely kinds of double
       crossover. Products below each bivalent; R = recombinant for A and B (orange), P = parental.
       Generated by make_fig04.py in the scratch folder, then checked by eye. -->
  <!-- panel 1: two-strand, second crossover between chromatids 2 and 3 -->
  <text x="115.0" y="22" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">two-strand</text>
  <text x="42" y="50" font-size="15" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="middle">A</text>
  <text x="188" y="50" font-size="15" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="middle">B</text>
  <rect x="30" y="57.5" width="170" height="9" rx="4.5" fill="#2a6f97"/>
  <rect x="30" y="71.5" width="170" height="9" rx="4.5" fill="#2a6f97"/>
  <rect x="30" y="91.5" width="170" height="9" rx="4.5" fill="#bc4749"/>
  <rect x="30" y="105.5" width="170" height="9" rx="4.5" fill="#bc4749"/>
  <g stroke="#1b2a3a" stroke-width="3" stroke-linecap="round"><line x1="84" y1="76" x2="100" y2="96"/><line x1="84" y1="96" x2="100" y2="76"/></g>
  <g stroke="#1b2a3a" stroke-width="3" stroke-linecap="round"><line x1="132" y1="76" x2="148" y2="96"/><line x1="132" y1="96" x2="148" y2="76"/></g>
