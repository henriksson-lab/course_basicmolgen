  <g stroke="#1b2a3a" stroke-width="3" stroke-linecap="round"><line x1="357" y1="76" x2="373" y2="110"/><line x1="357" y1="110" x2="373" y2="76"/></g>
  <line x1="340.0" y1="122" x2="340.0" y2="136" stroke="#5b6b7a" stroke-width="2"/>
