<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
  <!-- Haldane step by step. Number of crossovers k on one chromatid in an interval of d morgans
       is Poisson with mean d (no interference). Even k = parental (blue), odd k = recombinant (orange).
       Left: d = 0.5 M. Right: d = 2 M. Same vertical scale: 0.7 = 200 px, baseline y = 250.
       Values from dpois() in R. -->

  <!-- titles -->
  <text x="235" y="26" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">d = 0.5 M (50 cM): mostly 0 or 1 crossover</text>
  <text x="680" y="26" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">d = 2 M (200 cM): odd and even about equal</text>

  <!-- axes, left panel -->
  <g stroke="#5b6b7a" stroke-width="1.2">
    <line x1="64" y1="60" x2="64" y2="250"/>
    <line x1="64" y1="250" x2="400" y2="250"/>
    <line x1="58" y1="250" x2="64" y2="250"/><line x1="58" y1="192.9" x2="64" y2="192.9"/>
    <line x1="58" y1="135.7" x2="64" y2="135.7"/><line x1="58" y1="78.6" x2="64" y2="78.6"/>
  </g>
  <g font-size="12" fill="#5b6b7a" text-anchor="end">
    <text x="54" y="254">0</text><text x="54" y="197">0.2</text><text x="54" y="140">0.4</text><text x="54" y="83">0.6</text>
  </g>
  <text x="18" y="155" font-size="13" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 18 155)">probability</text>

  <!-- left bars: k = 0..4, centres 102 166 230 294 358, width 40 -->
  <rect x="82" y="76.7" width="40" height="173.3" fill="#2a6f97"/>
  <rect x="146" y="163.4" width="40" height="86.6" fill="#d08c2f"/>
  <rect x="210" y="228.3" width="40" height="21.7" fill="#2a6f97"/>
  <rect x="274" y="246.4" width="40" height="3.6" fill="#d08c2f"/>
  <rect x="338" y="249.5" width="40" height="0.5" fill="#2a6f97"/>
  <g font-size="12" fill="#1b2a3a" text-anchor="middle">
    <text x="102" y="71">0.607</text><text x="166" y="158">0.303</text><text x="230" y="223">0.076</text>
    <text x="294" y="241">0.013</text><text x="358" y="244">0.002</text>
  </g>
  <g font-size="13" fill="#5b6b7a" text-anchor="middle">
    <text x="102" y="268">0</text><text x="166" y="268">1</text><text x="230" y="268">2</text><text x="294" y="268">3</text><text x="358" y="268">4</text>
  </g>
  <text x="232" y="288" font-size="13" fill="#1b2a3a" text-anchor="middle">crossovers on one chromatid, k</text>
  <text x="290" y="316" font-size="14.5" fill="#1b2a3a" text-anchor="end">RF = P(k odd) = 0.303 + 0.013 + … =</text>
  <text x="296" y="316" font-size="14.5" font-weight="bold" fill="#d08c2f">0.316</text>

  <!-- legend, top right of left panel (free space) -->
  <rect x="236" y="70" width="14" height="14" fill="#2a6f97"/>
  <text x="257" y="82" font-size="13" fill="#1b2a3a">even k: parental</text>
  <rect x="236" y="94" width="14" height="14" fill="#d08c2f"/>
  <text x="257" y="106" font-size="13" fill="#1b2a3a">odd k: recombinant</text>

  <!-- axes, right panel -->
  <g stroke="#5b6b7a" stroke-width="1.2">
    <line x1="514" y1="60" x2="514" y2="250"/>
    <line x1="514" y1="250" x2="864" y2="250"/>
    <line x1="508" y1="250" x2="514" y2="250"/><line x1="508" y1="192.9" x2="514" y2="192.9"/>
    <line x1="508" y1="135.7" x2="514" y2="135.7"/><line x1="508" y1="78.6" x2="514" y2="78.6"/>
  </g>
  <g font-size="12" fill="#5b6b7a" text-anchor="end">
    <text x="504" y="254">0</text><text x="504" y="197">0.2</text><text x="504" y="140">0.4</text><text x="504" y="83">0.6</text>
  </g>

  <!-- right bars: k = 0..7, centres 541 + 42k, width 30 -->
  <rect x="526" y="211.3" width="30" height="38.7" fill="#2a6f97"/>
  <rect x="568" y="172.7" width="30" height="77.3" fill="#d08c2f"/>
  <rect x="610" y="172.7" width="30" height="77.3" fill="#2a6f97"/>
  <rect x="652" y="198.5" width="30" height="51.5" fill="#d08c2f"/>
  <rect x="694" y="224.2" width="30" height="25.8" fill="#2a6f97"/>
  <rect x="736" y="239.7" width="30" height="10.3" fill="#d08c2f"/>
  <rect x="778" y="246.6" width="30" height="3.4" fill="#2a6f97"/>
  <rect x="820" y="249.0" width="30" height="1.0" fill="#d08c2f"/>
  <g font-size="11.5" fill="#1b2a3a" text-anchor="middle">
    <text x="541" y="206">0.135</text><text x="583" y="167">0.271</text><text x="625" y="167">0.271</text>
    <text x="667" y="193">0.180</text><text x="709" y="219">0.090</text><text x="751" y="234">0.036</text>
    <text x="793" y="241">0.012</text><text x="835" y="243">0.003</text>
  </g>
  <g font-size="13" fill="#5b6b7a" text-anchor="middle">
    <text x="541" y="268">0</text><text x="583" y="268">1</text><text x="625" y="268">2</text><text x="667" y="268">3</text>
    <text x="709" y="268">4</text><text x="751" y="268">5</text><text x="793" y="268">6</text><text x="835" y="268">7</text>
  </g>
  <text x="688" y="288" font-size="13" fill="#1b2a3a" text-anchor="middle">crossovers on one chromatid, k</text>
  <text x="790" y="316" font-size="14.5" fill="#1b2a3a" text-anchor="end">RF = 0.271 + 0.180 + 0.036 + 0.003 + … =</text>
  <text x="796" y="316" font-size="14.5" font-weight="bold" fill="#d08c2f">0.491</text>
</svg>
