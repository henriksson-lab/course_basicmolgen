<!doctype html>
<!-- Template for a full-page demo: demos/build.sh writes demos/dist/<name>.html from it,
     replacing twohit. Query parameters become data-* options, e.g. punnett.html?preset=mono. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twohit</title>
<link rel="stylesheet" href="demo.css">
<style>
  body { margin: 0; padding: 1.5em; background: #fff; }
  body .qb-demo { margin: 0 auto; max-width: 1100px; }
  body .qb-demo .qb-plot { max-width: 760px; }
</style>
</head>
<body data-qb-standalone>
<div id="qb-host" data-demo="twohit"></div>
<script>
  for (const [k, v] of new URLSearchParams(location.search))
    if (/^[a-z][a-z0-9-]*$/.test(k) && k !== "demo") document.getElementById("qb-host").setAttribute("data-" + k, v);
</script>
<script src="twohit.js"></script>
</body>
</html>
