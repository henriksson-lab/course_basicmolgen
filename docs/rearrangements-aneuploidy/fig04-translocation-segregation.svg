<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Helvetica, Arial, sans-serif">
  <!-- Segregation in a reciprocal translocation carrier. N1/N2 = the normal blue and green
       chromosomes; T1/T2 = the two translocated chromosomes (each has the other's tip).
       At meiosis I the four pair as a cross-shaped quadrivalent. Alternate segregation
       (N1+N2 / T1+T2) gives balanced gametes; adjacent-1 (homologous centromeres apart) and
       adjacent-2 (homologous centromeres together) give duplications plus deficiencies.
       Generated by make_fig04.py in the scratch folder. -->
  <text x="20" y="26" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold" font-style="normal">Reciprocal translocation carrier</text>
  <text x="20" y="56" font-size="13.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">1. The four chromosomes</text>
  <rect x="30.0" y="76" width="70.0" height="12" fill="#2a6f97" rx="5"/>
  <rect x="100.0" y="76" width="30.0" height="12" fill="#2a6f97" rx="5"/>
  <circle cx="52.0" cy="82.0" r="7" fill="#1d4f6c" stroke="#fff" stroke-width="1.5"/>
  <text x="136.0" y="87" font-size="13" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">N1</text>
  <rect x="30.0" y="106" width="70.0" height="12" fill="#2a6f97" rx="5"/>
  <rect x="100.0" y="106" width="20.0" height="12" fill="#6a994e" rx="5"/>
  <circle cx="52.0" cy="112.0" r="7" fill="#1d4f6c" stroke="#fff" stroke-width="1.5"/>
  <text x="126.0" y="117" font-size="13" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">T1</text>
  <rect x="30.0" y="136" width="60.0" height="12" fill="#6a994e" rx="5"/>
  <rect x="90.0" y="136" width="20.0" height="12" fill="#6a994e" rx="5"/>
  <circle cx="48.0" cy="142.0" r="7" fill="#3f6b2a" stroke="#fff" stroke-width="1.5"/>
  <text x="116.0" y="147" font-size="13" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">N2</text>
  <rect x="30.0" y="166" width="60.0" height="12" fill="#6a994e" rx="5"/>
  <rect x="90.0" y="166" width="30.0" height="12" fill="#2a6f97" rx="5"/>
  <circle cx="48.0" cy="172.0" r="7" fill="#3f6b2a" stroke="#fff" stroke-width="1.5"/>
  <text x="126.0" y="177" font-size="13" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">T2</text>
  <text x="20" y="210" font-size="13" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">N = normal, T = translocated.</text>
  <text x="20" y="228" font-size="13" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">Blue and green: two different</text>
  <text x="20" y="246" font-size="13" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">(non-homologous) chromosomes.</text>
  <text x="205" y="56" font-size="13.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">2. Pairing in meiosis I</text>
  <line x1="205" y1="144" x2="292" y2="144" stroke="#2a6f97" stroke-width="7" stroke-linecap="round"/>
  <line x1="205" y1="156" x2="292" y2="156" stroke="#2a6f97" stroke-width="7" stroke-linecap="round"/>
  <line x1="294" y1="80" x2="294" y2="142" stroke="#2a6f97" stroke-width="7" stroke-linecap="round"/>
  <line x1="306" y1="80" x2="306" y2="142" stroke="#2a6f97" stroke-width="7" stroke-linecap="round"/>
  <line x1="308" y1="144" x2="385" y2="144" stroke="#6a994e" stroke-width="7" stroke-linecap="round"/>
  <line x1="308" y1="156" x2="385" y2="156" stroke="#6a994e" stroke-width="7" stroke-linecap="round"/>
  <line x1="294" y1="158" x2="294" y2="205" stroke="#6a994e" stroke-width="7" stroke-linecap="round"/>
  <line x1="306" y1="158" x2="306" y2="205" stroke="#6a994e" stroke-width="7" stroke-linecap="round"/>
  <circle cx="230" cy="144" r="6" fill="#1d4f6c" stroke="#fff" stroke-width="1.5"/>
  <circle cx="362" cy="144" r="6" fill="#3f6b2a" stroke="#fff" stroke-width="1.5"/>
  <circle cx="230" cy="156" r="6" fill="#1d4f6c" stroke="#fff" stroke-width="1.5"/>
  <circle cx="362" cy="156" r="6" fill="#3f6b2a" stroke="#fff" stroke-width="1.5"/>
  <text x="202" y="134" font-size="12.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">N1</text>
  <text x="202" y="178" font-size="12.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">T1</text>
  <text x="370" y="134" font-size="12.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">T2</text>
  <text x="370" y="178" font-size="12.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">N2</text>
  <text x="314" y="94" font-size="12.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">N1 / T2</text>
  <text x="314" y="202" font-size="12.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">N2 / T1</text>
  <line x1="422" y1="44" x2="422" y2="300" stroke="#e3e7eb" stroke-width="1.5"/>
  <text x="440" y="56" font-size="13.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="normal">3. Two of the four go to each pole</text>
  <text x="440" y="110" font-size="14" fill="#1b2a3a" text-anchor="start" font-weight="bold" font-style="normal">alternate</text>
  <rect x="545.0" y="84" width="63.0" height="12" fill="#2a6f97" rx="5"/>
  <rect x="608.0" y="84" width="27.0" height="12" fill="#2a6f97" rx="5"/>
  <circle cx="564.8" cy="90.0" r="7" fill="#1d4f6c" stroke="#fff" stroke-width="1.5"/>
  <rect x="545.0" y="104" width="54.0" height="12" fill="#6a994e" rx="5"/>
  <rect x="599.0" y="104" width="18.0" height="12" fill="#6a994e" rx="5"/>
  <circle cx="561.2" cy="110.0" r="7" fill="#3f6b2a" stroke="#fff" stroke-width="1.5"/>
  <text x="545" y="136" font-size="12.5" fill="#2e7d32" text-anchor="start" font-weight="normal" font-style="normal">N1 + N2: normal</text>
  <rect x="745.0" y="84" width="63.0" height="12" fill="#2a6f97" rx="5"/>
  <rect x="808.0" y="84" width="18.0" height="12" fill="#6a994e" rx="5"/>
  <circle cx="764.8" cy="90.0" r="7" fill="#1d4f6c" stroke="#fff" stroke-width="1.5"/>
  <rect x="745.0" y="104" width="54.0" height="12" fill="#6a994e" rx="5"/>
  <rect x="799.0" y="104" width="27.0" height="12" fill="#2a6f97" rx="5"/>
  <circle cx="761.2" cy="110.0" r="7" fill="#3f6b2a" stroke="#fff" stroke-width="1.5"/>
  <text x="745" y="136" font-size="12.5" fill="#2e7d32" text-anchor="start" font-weight="normal" font-style="normal">T1 + T2: balanced carrier</text>
  <text x="440" y="186" font-size="14" fill="#1b2a3a" text-anchor="start" font-weight="bold" font-style="normal">adjacent-1</text>
  <rect x="545.0" y="160" width="63.0" height="12" fill="#2a6f97" rx="5"/>
  <rect x="608.0" y="160" width="27.0" height="12" fill="#2a6f97" rx="5"/>
  <circle cx="564.8" cy="166.0" r="7" fill="#1d4f6c" stroke="#fff" stroke-width="1.5"/>
  <rect x="545.0" y="180" width="54.0" height="12" fill="#6a994e" rx="5"/>
  <rect x="599.0" y="180" width="27.0" height="12" fill="#2a6f97" rx="5"/>
  <circle cx="561.2" cy="186.0" r="7" fill="#3f6b2a" stroke="#fff" stroke-width="1.5"/>
  <text x="545" y="212" font-size="12.5" fill="#bc4749" text-anchor="start" font-weight="normal" font-style="normal">N1 + T2: unbalanced</text>
  <rect x="745.0" y="160" width="54.0" height="12" fill="#6a994e" rx="5"/>
  <rect x="799.0" y="160" width="18.0" height="12" fill="#6a994e" rx="5"/>
  <circle cx="761.2" cy="166.0" r="7" fill="#3f6b2a" stroke="#fff" stroke-width="1.5"/>
  <rect x="745.0" y="180" width="63.0" height="12" fill="#2a6f97" rx="5"/>
  <rect x="808.0" y="180" width="18.0" height="12" fill="#6a994e" rx="5"/>
  <circle cx="764.8" cy="186.0" r="7" fill="#1d4f6c" stroke="#fff" stroke-width="1.5"/>
  <text x="745" y="212" font-size="12.5" fill="#bc4749" text-anchor="start" font-weight="normal" font-style="normal">N2 + T1: unbalanced</text>
  <text x="440" y="262" font-size="14" fill="#1b2a3a" text-anchor="start" font-weight="bold" font-style="normal">adjacent-2</text>
  <rect x="545.0" y="236" width="63.0" height="12" fill="#2a6f97" rx="5"/>
  <rect x="608.0" y="236" width="27.0" height="12" fill="#2a6f97" rx="5"/>
  <circle cx="564.8" cy="242.0" r="7" fill="#1d4f6c" stroke="#fff" stroke-width="1.5"/>
  <rect x="545.0" y="256" width="63.0" height="12" fill="#2a6f97" rx="5"/>
  <rect x="608.0" y="256" width="18.0" height="12" fill="#6a994e" rx="5"/>
  <circle cx="564.8" cy="262.0" r="7" fill="#1d4f6c" stroke="#fff" stroke-width="1.5"/>
  <text x="545" y="288" font-size="12.5" fill="#bc4749" text-anchor="start" font-weight="normal" font-style="normal">N1 + T1: unbalanced</text>
  <rect x="745.0" y="236" width="54.0" height="12" fill="#6a994e" rx="5"/>
  <rect x="799.0" y="236" width="18.0" height="12" fill="#6a994e" rx="5"/>
  <circle cx="761.2" cy="242.0" r="7" fill="#3f6b2a" stroke="#fff" stroke-width="1.5"/>
  <rect x="745.0" y="256" width="54.0" height="12" fill="#6a994e" rx="5"/>
  <rect x="799.0" y="256" width="27.0" height="12" fill="#2a6f97" rx="5"/>
  <circle cx="761.2" cy="262.0" r="7" fill="#3f6b2a" stroke="#fff" stroke-width="1.5"/>
  <text x="745" y="288" font-size="12.5" fill="#bc4749" text-anchor="start" font-weight="normal" font-style="normal">N2 + T2: unbalanced</text>
  <text x="440" y="318" font-size="13.5" fill="#1b2a3a" text-anchor="start" font-weight="normal" font-style="normal">Only alternate segregation gives balanced gametes.</text>
</svg>
