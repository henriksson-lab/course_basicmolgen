<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="920" height="310" font-family="Helvetica, Arial, sans-serif">
  <!-- Step 1 of the inversion build. Left: the two homologues of a paracentric inversion
       heterozygote drawn straight: normal (blue) centromere-A-B-C-D-E, inverted (red)
       centromere-A-D-C-B-E; the inverted segment B..D is bracketed. Right: to pair gene by gene
       (B with B, C with C, D with D) one homologue must twist into a loop. Same loop geometry
       and colours as fig03-inversion-loop.svg, without the crossover. -->
  <text x="20" y="28" font-size="14" fill="#5b6b7a">1. The two homologues, drawn straight</text>

  <!-- normal -->
  <line x1="40" y1="90" x2="380" y2="90" stroke="#2a6f97" stroke-width="5"/>
  <circle cx="58" cy="90" r="8" fill="#1d4f6c"/>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">
    <text x="120" y="80">A</text><text x="180" y="80">B</text><text x="240" y="80">C</text>
    <text x="300" y="80">D</text><text x="360" y="80">E</text>
  </g>
  <!-- inverted -->
  <line x1="40" y1="160" x2="380" y2="160" stroke="#bc4749" stroke-width="5"/>
  <circle cx="58" cy="160" r="8" fill="#8a3335"/>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">
    <text x="120" y="150">A</text><text x="180" y="150">D</text><text x="240" y="150">C</text>
    <text x="300" y="150">B</text><text x="360" y="150">E</text>
  </g>
  <!-- brackets around the inverted segment -->
  <path d="M152,104 L152,112 L328,112 L328,104" fill="none" stroke="#5b6b7a" stroke-width="1.5"/>
  <path d="M152,174 L152,182 L328,182 L328,174" fill="none" stroke="#5b6b7a" stroke-width="1.5"/>
  <text x="240" y="128" font-size="12.5" text-anchor="middle" fill="#5b6b7a">segment B C D</text>
  <text x="240" y="198" font-size="12.5" text-anchor="middle" fill="#5b6b7a">the same segment, turned around: D C B</text>
  <g font-size="13" fill="#1b2a3a">
    <text x="40" y="236">The centromere (dot) is outside the inverted segment:</text>
    <text x="40" y="256">a paracentric inversion. Laid side by side, B faces D:</text>
    <text x="40" y="276">the genes do not match up.</text>
  </g>

  <line x1="440" y1="20" x2="440" y2="286" stroke="#e3e7eb" stroke-width="1.5"/>

  <text x="460" y="28" font-size="14" fill="#5b6b7a">2. Pairing gene by gene makes a loop</text>
  <g transform="translate(450,24)">
    <path d="M40,190 L150,190 C150,190 160,190 170,180 A80,80 0 1 1 270,180 C280,190 290,190 290,190 L400,190"
          fill="none" stroke="#2a6f97" stroke-width="5"/>
    <path d="M40,206 L150,206 C200,206 240,204 256,190 A62,62 0 1 0 184,190 C200,204 240,206 290,206 L400,206"
          fill="none" stroke="#bc4749" stroke-width="5"/>
    <circle cx="58" cy="190" r="8" fill="#1d4f6c"/>
    <circle cx="58" cy="206" r="8" fill="#8a3335"/>
    <g font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">
      <text x="110" y="182">A</text>
      <text x="130" y="232">A</text>
      <text x="340" y="182">E</text>
      <text x="340" y="232">E</text>
      <text x="122" y="112">B</text>
      <text x="220" y="64">C</text>
      <text x="318" y="112">D</text>
    </g>
    <g font-size="12" text-anchor="middle" fill="#5b6b7a">
      <text x="182" y="146">B</text>
      <text x="220" y="116">C</text>
      <text x="258" y="146">D</text>
    </g>
  </g>
  <text x="460" y="280" font-size="13" fill="#1b2a3a">Now every gene lies next to its partner. The red homologue</text>
  <text x="460" y="298" font-size="13" fill="#1b2a3a">twists at the base and runs through the loop backwards.</text>
</svg>
