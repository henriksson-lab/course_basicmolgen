<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="Helvetica, Arial, sans-serif">
  <!-- Pericentric inversion heterozygote, drawn like fig03 (paracentric) for comparison.
       Normal homologue (blue): A B C (centromere) D E F.
       Inverted homologue (red): A E D (centromere) C B F: the segment B..E, which contains the
       centromere, is inverted. In the loop the centromeres sit at the top, paired.
       One crossover in the loop, between D and E, gives
       normal-piece-with-D + inverted-piece-with-E = A B C (cen) D E A  (A twice, no F) and
       inverted-piece-with-D + normal-piece-with-E = F E D (cen) C B F  (F twice, no A).
       Shown as single chromatids for clarity. -->
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#1b2a3a">A crossover inside a pericentric inversion loop</text>

  <!-- ===== left: the loop (same geometry as fig03) ===== -->
  <path d="M40,190 L150,190 C150,190 160,190 170,180 A80,80 0 1 1 270,180 C280,190 290,190 290,190 L400,190"
        fill="none" stroke="#2a6f97" stroke-width="5"/>
  <path d="M40,206 L150,206 C200,206 240,204 256,190 A62,62 0 1 0 184,190 C200,204 240,206 290,206 L400,206"
        fill="none" stroke="#bc4749" stroke-width="5"/>
  <!-- centromeres at the top of the loop -->
  <circle cx="220" cy="38" r="8" fill="#1d4f6c"/>
  <circle cx="220" cy="78" r="8" fill="#8a3335"/>
  <!-- loci: big = normal (outside the outer ring), small = inverted (inside the inner ring) -->
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">
    <text x="110" y="182">A</text>
    <text x="110" y="232">A</text>
    <text x="340" y="182">F</text>
    <text x="340" y="232">F</text>
    <text x="128" y="157">B</text>
    <text x="150" y="52">C</text>
    <text x="290" y="52">D</text>
    <text x="312" y="157">E</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#5b6b7a">
    <text x="180" y="160">B</text>
    <text x="190" y="112">C</text>
    <text x="250" y="112">D</text>
    <text x="260" y="160">E</text>
  </g>
  <!-- crossover mark between D and E -->
  <path d="M281,107 L299,125 M299,107 L281,125" stroke="#1b2a3a" stroke-width="3"/>
  <text x="314" y="121" font-size="13" fill="#1b2a3a">crossover</text>

  <g font-size="13" fill="#1b2a3a">
    <rect x="40" y="252" width="16" height="6" fill="#2a6f97"/><text x="62" y="259">normal: A B C • D E F</text>
    <rect x="40" y="274" width="16" height="6" fill="#bc4749"/><text x="62" y="281">inverted: A E D • C B F</text>
  </g>
  <text x="40" y="308" font-size="12.5" fill="#5b6b7a">• = centromere. Big letters: normal; small: inverted.</text>

  <line x1="440" y1="44" x2="440" y2="318" stroke="#e3e7eb" stroke-width="1.5"/>

  <!-- ===== right: the four products ===== -->
  <text x="460" y="58" font-size="14" font-weight="bold" fill="#1b2a3a">The four chromatids after meiosis I</text>
  <g font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">
    <!-- 1 normal -->
    <text x="470" y="95">A</text><text x="494" y="95">B</text><text x="518" y="95">C</text>
    <circle cx="542" cy="90" r="7" fill="#1d4f6c"/>
    <text x="566" y="95">D</text><text x="590" y="95">E</text><text x="614" y="95">F</text>
    <!-- 2 inverted -->
    <text x="470" y="139">A</text><text x="494" y="139">E</text><text x="518" y="139">D</text>
    <circle cx="542" cy="134" r="7" fill="#8a3335"/>
    <text x="566" y="139">C</text><text x="590" y="139">B</text><text x="614" y="139">F</text>
    <!-- 3 crossover: normal piece with D + inverted piece with E -->
    <text x="470" y="183">A</text><text x="494" y="183">B</text><text x="518" y="183">C</text>
    <circle cx="542" cy="178" r="7" fill="#1d4f6c"/>
    <text x="566" y="183">D</text><text x="590" y="183" fill="#bc4749">E</text><text x="614" y="183" fill="#bc4749">A</text>
    <!-- 4 crossover: normal piece with E + inverted piece with D -->
    <text x="470" y="227">F</text><text x="494" y="227">E</text><text x="518" y="227" fill="#bc4749">D</text>
    <circle cx="542" cy="222" r="7" fill="#8a3335"/>
    <text x="566" y="227" fill="#bc4749">C</text><text x="590" y="227" fill="#bc4749">B</text><text x="614" y="227" fill="#bc4749">F</text>
  </g>
  <g font-size="13" fill="#5b6b7a">
    <text x="640" y="88">no crossover: normal</text>
    <text x="640" y="104" fill="#2e7d32">balanced, viable</text>
    <text x="640" y="132">no crossover: inverted</text>
    <text x="640" y="148" fill="#2e7d32">balanced, viable</text>
    <text x="640" y="176">one centromere, but A twice, no F:</text>
    <text x="640" y="192" fill="#bc4749">duplication + deficiency</text>
    <text x="640" y="220">one centromere, but F twice, no A:</text>
    <text x="640" y="236" fill="#bc4749">duplication + deficiency</text>
  </g>
  <text x="460" y="276" font-size="13.5" fill="#1b2a3a">No dicentric and no fragment this time: both crossover</text>
  <text x="460" y="296" font-size="13.5" fill="#1b2a3a">chromatids segregate normally, but each is unbalanced, so</text>
  <text x="460" y="316" font-size="13.5" fill="#1b2a3a">the zygotes they make are usually lost.</text>
</svg>
