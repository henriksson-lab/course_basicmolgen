<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" width="800" height="358" font-family="Helvetica, Arial, sans-serif">
  <!-- Percentage of singleton pregnancies with fetal trisomy 21, trisomy 18 and monosomy X by
       maternal age group, log scale. Data: Elmerdahl Frederiksen et al. 2024, Acta Obstet Gynecol
       Scand 103:351-359, Table 2 (Denmark 2008-2017, 542 375 pregnancies); the same numbers as
       data/aneuploidy_maternal_age_denmark.csv. Generated by make_fig05.py in the scratch folder. -->
  <line x1="90" x2="560" y1="300.0" y2="300.0" stroke="#e3e7eb"/>
  <text x="82" y="305.0" font-size="14" fill="#5b6b7a" text-anchor="end">0.01%</text>
  <line x1="90" x2="560" y1="213.3" y2="213.3" stroke="#e3e7eb"/>
  <text x="82" y="218.3" font-size="14" fill="#5b6b7a" text-anchor="end">0.1%</text>
  <line x1="90" x2="560" y1="126.7" y2="126.7" stroke="#e3e7eb"/>
  <text x="82" y="131.7" font-size="14" fill="#5b6b7a" text-anchor="end">1%</text>
  <line x1="90" x2="560" y1="40.0" y2="40.0" stroke="#e3e7eb"/>
  <text x="82" y="45.0" font-size="14" fill="#5b6b7a" text-anchor="end">10%</text>
  <line x1="90" x2="560" y1="300" y2="300" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="130.0" y="322" font-size="14" fill="#1b2a3a" text-anchor="middle">&lt;20</text>
  <text x="208.0" y="322" font-size="14" fill="#1b2a3a" text-anchor="middle">20–29</text>
  <text x="286.0" y="322" font-size="14" fill="#1b2a3a" text-anchor="middle">30–34</text>
  <text x="364.0" y="322" font-size="14" fill="#1b2a3a" text-anchor="middle">35–39</text>
  <text x="442.0" y="322" font-size="14" fill="#1b2a3a" text-anchor="middle">40–44</text>
  <text x="520.0" y="322" font-size="14" fill="#1b2a3a" text-anchor="middle">≥45</text>
  <text x="325.0" y="346" font-size="14.5" fill="#1b2a3a" text-anchor="middle">maternal age (years)</text>
  <text x="22" y="170.0" font-size="14.5" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 22 170.0)">pregnancies affected (log scale)</text>
  <polyline fill="none" stroke="#bc4749" stroke-width="2.5" points="130.0,218.9 208.0,214.2 286.0,190.1 364.0,144.8 442.0,98.1 520.0,82.7"/>
  <circle cx="130.0" cy="218.9" r="5" fill="#bc4749"/>
  <circle cx="208.0" cy="214.2" r="5" fill="#bc4749"/>
  <circle cx="286.0" cy="190.1" r="5" fill="#bc4749"/>
  <circle cx="364.0" cy="144.8" r="5" fill="#bc4749"/>
  <circle cx="442.0" cy="98.1" r="5" fill="#bc4749"/>
  <circle cx="520.0" cy="82.7" r="5" fill="#bc4749"/>
  <line x1="590" x2="616" y1="70" y2="70" stroke="#bc4749" stroke-width="3"/>
  <circle cx="603" cy="70" r="5" fill="#bc4749"/>
  <text x="624" y="75" font-size="14.5" fill="#1b2a3a">trisomy 21</text>
  <polyline fill="none" stroke="#d08c2f" stroke-width="2.5" points="130.0,250.8 208.0,272.0 286.0,241.7 364.0,196.1 442.0,140.7 520.0,94.7"/>
  <circle cx="130.0" cy="250.8" r="5" fill="#d08c2f"/>
  <circle cx="208.0" cy="272.0" r="5" fill="#d08c2f"/>
  <circle cx="286.0" cy="241.7" r="5" fill="#d08c2f"/>
  <circle cx="364.0" cy="196.1" r="5" fill="#d08c2f"/>
  <circle cx="442.0" cy="140.7" r="5" fill="#d08c2f"/>
  <circle cx="520.0" cy="94.7" r="5" fill="#d08c2f"/>
  <line x1="590" x2="616" y1="98" y2="98" stroke="#d08c2f" stroke-width="3"/>
  <circle cx="603" cy="98" r="5" fill="#d08c2f"/>
  <text x="624" y="103" font-size="14.5" fill="#1b2a3a">trisomy 18</text>
  <polyline fill="none" stroke="#2a6f97" stroke-width="2.5" points="208.0,251.6 286.0,250.5 364.0,244.0 442.0,238.5"/>
  <circle cx="208.0" cy="251.6" r="5" fill="#2a6f97"/>
  <circle cx="286.0" cy="250.5" r="5" fill="#2a6f97"/>
  <circle cx="364.0" cy="244.0" r="5" fill="#2a6f97"/>
  <circle cx="442.0" cy="238.5" r="5" fill="#2a6f97"/>
  <line x1="590" x2="616" y1="126" y2="126" stroke="#2a6f97" stroke-width="3"/>
  <circle cx="603" cy="126" r="5" fill="#2a6f97"/>
  <text x="624" y="131" font-size="14.5" fill="#1b2a3a">monosomy X</text>
  <text x="208.0" y="202.2" font-size="13" fill="#bc4749" text-anchor="middle">1 in 1023</text>
  <text x="432.0" y="86.1" font-size="13" fill="#bc4749" text-anchor="end">1 in 47</text>
  <text x="590" y="170" font-size="13" fill="#5b6b7a">542 375 singleton pregnancies,</text>
  <text x="590" y="188" font-size="13" fill="#5b6b7a">Denmark 2008–2017; diagnoses</text>
  <text x="590" y="206" font-size="13" fill="#5b6b7a">before and after birth.</text>
  <text x="590" y="230" font-size="13" fill="#5b6b7a">Points with fewer than 3</text>
  <text x="590" y="248" font-size="13" fill="#5b6b7a">cases are not reported.</text>
  <text x="590" y="280" font-size="12" fill="#5b6b7a">Elmerdahl Frederiksen et al.</text>
  <text x="590" y="296" font-size="12" fill="#5b6b7a">2024, Table 2</text>
</svg>
