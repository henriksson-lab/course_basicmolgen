<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="Helvetica, Arial, sans-serif">
  <!-- Waterfall: LOD at theta = 0.1 for the family of fig01 (6 informative meioses, III-4 recombinant).
       Each non-recombinant adds log10(2 x 0.9) = +0.255, the recombinant adds log10(2 x 0.1) = -0.699.
       Scale: y = 220 - 200 * value. Running totals 0.255, 0.511, 0.766, 0.067, 0.322, 0.577. -->

  <text x="450" y="24" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Each informative meiosis adds its own term (θ = 0.1)</text>

  <!-- y axis -->
  <g stroke="#5b6b7a" stroke-width="1.2">
    <line x1="80" y1="50" x2="80" y2="230"/>
    <line x1="74" y1="220" x2="80" y2="220"/><line x1="74" y1="180" x2="80" y2="180"/>
    <line x1="74" y1="140" x2="80" y2="140"/><line x1="74" y1="100" x2="80" y2="100"/>
    <line x1="74" y1="60" x2="80" y2="60"/>
  </g>
  <g font-size="12" fill="#5b6b7a" text-anchor="end">
    <text x="70" y="224">0</text><text x="70" y="184">0.2</text><text x="70" y="144">0.4</text>
    <text x="70" y="104">0.6</text><text x="70" y="64">0.8</text>
  </g>
  <text x="26" y="140" font-size="13" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 26 140)">running LOD</text>
  <line x1="80" y1="220" x2="800" y2="220" stroke="#5b6b7a" stroke-width="1"/>

  <!-- connectors (running total carried to the next bar) -->
  <g stroke="#9aa5b1" stroke-width="1" stroke-dasharray="4 3">
    <line x1="168" y1="169" x2="212" y2="169"/>
    <line x1="268" y1="117.8" x2="312" y2="117.8"/>
    <line x1="368" y1="66.8" x2="412" y2="66.8"/>
    <line x1="468" y1="206.6" x2="512" y2="206.6"/>
    <line x1="568" y1="155.6" x2="612" y2="155.6"/>
    <line x1="668" y1="104.6" x2="732" y2="104.6"/>
  </g>

  <!-- bars: centres 140 240 340 440 540 640, total at 760; width 56 -->
  <rect x="112" y="169" width="56" height="51" fill="#2a6f97"/>
  <rect x="212" y="117.8" width="56" height="51.2" fill="#2a6f97"/>
  <rect x="312" y="66.8" width="56" height="51" fill="#2a6f97"/>
  <rect x="412" y="66.8" width="56" height="139.8" fill="#bc4749"/>
  <rect x="512" y="155.6" width="56" height="51" fill="#2a6f97"/>
  <rect x="612" y="104.6" width="56" height="51" fill="#2a6f97"/>
  <rect x="732" y="104.6" width="56" height="115.4" fill="#d08c2f"/>

  <!-- step labels -->
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="140" y="162">+0.255</text>
    <text x="240" y="111">+0.255</text>
    <text x="340" y="60">+0.255</text>
    <text x="540" y="149">+0.255</text>
    <text x="640" y="98">+0.255</text>
  </g>
  <text x="440" y="141" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">−0.699</text>
  <text x="760" y="96" font-size="15" font-weight="bold" fill="#d08c2f" text-anchor="middle">0.577</text>

  <!-- x labels -->
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="140" y="246">III-1</text><text x="240" y="246">III-2</text><text x="340" y="246">III-3</text>
    <text x="440" y="246">III-4</text><text x="540" y="246">III-5</text><text x="640" y="246">III-6</text>
    <text x="760" y="246" font-weight="bold">LOD(0.1)</text>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="140" y="263" fill="#2a6f97">NR</text><text x="240" y="263" fill="#2a6f97">NR</text>
    <text x="340" y="263" fill="#2a6f97">NR</text><text x="440" y="263" fill="#bc4749" font-weight="bold">R</text>
    <text x="540" y="263" fill="#2a6f97">NR</text><text x="640" y="263" fill="#2a6f97">NR</text>
    <text x="760" y="263" fill="#5b6b7a">total</text>
  </g>

  <!-- legend / formula line -->
  <rect x="96" y="285" width="14" height="14" fill="#2a6f97"/>
  <text x="117" y="297" font-size="14" fill="#1b2a3a">non-recombinant: log<tspan font-size="10" dy="4">10</tspan><tspan dy="-4">[(1 − θ) / 0.5] = log</tspan><tspan font-size="10" dy="4">10</tspan><tspan dy="-4"> 1.8 = +0.255</tspan></text>
  <rect x="500" y="285" width="14" height="14" fill="#bc4749"/>
  <text x="521" y="297" font-size="14" fill="#1b2a3a">recombinant: log<tspan font-size="10" dy="4">10</tspan><tspan dy="-4">(θ / 0.5) = log</tspan><tspan font-size="10" dy="4">10</tspan><tspan dy="-4"> 0.2 = −0.699</tspan></text>
</svg>
