<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" font-family="Helvetica, Arial, sans-serif">
  <!-- Meiotic basis of independent assortment in an Rr Yy cell at metaphase I.
       Blue chromosomes came from the RR YY parent, red from the rr yy parent.
       Long pair = R/r gene, short pair = Y/y gene, dashed line = metaphase plate.
       The two pairs line up independently: two equally likely orientations, each giving two gamete types
       (after meiosis II each type is two of the four gametes, so ½ of that cell's gametes). -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- panel: orientation 1 (probability ½) -->
  <text x="210" y="24" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">orientation 1 (probability ½)</text>
  <text x="210" y="44" font-size="14" fill="#5b6b7a" text-anchor="middle">the two blue chromosomes on the same side</text>
  <ellipse cx="210" cy="160" rx="135" ry="100" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
  <line x1="210" y1="70" x2="210" y2="250" stroke="#7a8794" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="166" y="92" width="11" height="66" rx="5" fill="#2a6f97"/><rect x="179" y="92" width="11" height="66" rx="5" fill="#2a6f97"/>
  <rect x="166" y="182" width="11" height="44" rx="5" fill="#2a6f97"/><rect x="179" y="182" width="11" height="44" rx="5" fill="#2a6f97"/>
  <text x="156" y="132" font-size="19" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="end">R</text>
  <text x="156" y="211" font-size="19" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="end">Y</text>
  <rect x="230" y="92" width="11" height="66" rx="5" fill="#bc4749"/><rect x="243" y="92" width="11" height="66" rx="5" fill="#bc4749"/>
  <rect x="230" y="182" width="11" height="44" rx="5" fill="#bc4749"/><rect x="243" y="182" width="11" height="44" rx="5" fill="#bc4749"/>
  <text x="264" y="132" font-size="19" font-weight="bold" font-style="italic" fill="#bc4749" text-anchor="start">r</text>
  <text x="264" y="211" font-size="19" font-weight="bold" font-style="italic" fill="#bc4749" text-anchor="start">y</text>
  <line x1="170" y1="256" x2="149" y2="301" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="135" cy="330" r="32" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
  <rect x="123" y="310" width="11" height="40" rx="5" fill="#2a6f97"/><rect x="138" y="318" width="11" height="26" rx="5" fill="#2a6f97"/>
  <text x="135" y="386" font-size="19" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">RY</text>
  <text x="135" y="408" font-size="15" fill="#1b2a3a" text-anchor="middle">½ × ½ = ¼</text>
  <line x1="250" y1="256" x2="271" y2="301" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="285" cy="330" r="32" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
  <rect x="273" y="310" width="11" height="40" rx="5" fill="#bc4749"/><rect x="288" y="318" width="11" height="26" rx="5" fill="#bc4749"/>
  <text x="285" y="386" font-size="19" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">ry</text>
  <text x="285" y="408" font-size="15" fill="#1b2a3a" text-anchor="middle">½ × ½ = ¼</text>

  <!-- panel: orientation 2 (probability ½) -->
  <text x="630" y="24" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">orientation 2 (probability ½)</text>
  <text x="630" y="44" font-size="14" fill="#5b6b7a" text-anchor="middle">one blue and one red on each side</text>
  <ellipse cx="630" cy="160" rx="135" ry="100" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
  <line x1="630" y1="70" x2="630" y2="250" stroke="#7a8794" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="586" y="92" width="11" height="66" rx="5" fill="#2a6f97"/><rect x="599" y="92" width="11" height="66" rx="5" fill="#2a6f97"/>
  <rect x="586" y="182" width="11" height="44" rx="5" fill="#bc4749"/><rect x="599" y="182" width="11" height="44" rx="5" fill="#bc4749"/>
  <text x="576" y="132" font-size="19" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="end">R</text>
  <text x="576" y="211" font-size="19" font-weight="bold" font-style="italic" fill="#bc4749" text-anchor="end">y</text>
  <rect x="650" y="92" width="11" height="66" rx="5" fill="#bc4749"/><rect x="663" y="92" width="11" height="66" rx="5" fill="#bc4749"/>
  <rect x="650" y="182" width="11" height="44" rx="5" fill="#2a6f97"/><rect x="663" y="182" width="11" height="44" rx="5" fill="#2a6f97"/>
  <text x="684" y="132" font-size="19" font-weight="bold" font-style="italic" fill="#bc4749" text-anchor="start">r</text>
  <text x="684" y="211" font-size="19" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="start">Y</text>
  <line x1="590" y1="256" x2="569" y2="301" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="555" cy="330" r="32" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
  <rect x="543" y="310" width="11" height="40" rx="5" fill="#2a6f97"/><rect x="558" y="318" width="11" height="26" rx="5" fill="#bc4749"/>
  <text x="555" y="386" font-size="19" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">Ry</text>
  <text x="555" y="408" font-size="15" fill="#1b2a3a" text-anchor="middle">½ × ½ = ¼</text>
  <line x1="670" y1="256" x2="691" y2="301" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="705" cy="330" r="32" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
  <rect x="693" y="310" width="11" height="40" rx="5" fill="#bc4749"/><rect x="708" y="318" width="11" height="26" rx="5" fill="#2a6f97"/>
  <text x="705" y="386" font-size="19" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">rY</text>
  <text x="705" y="408" font-size="15" fill="#1b2a3a" text-anchor="middle">½ × ½ = ¼</text>

  <!-- divider -->
  <line x1="420" y1="20" x2="420" y2="400" stroke="#c9d3dd" stroke-width="1"/>
</svg>
