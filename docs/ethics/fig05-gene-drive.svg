<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif">
  <!-- fig05: a homing gene drive breaks Mendel's law of segregation.
       Left: ordinary heterozygote D/+ gives 1/2 D gametes. Right: the drive allele encodes Cas9
       and a guide RNA that cut the + homolog; repair copies the drive, so the germ line becomes D/D. -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <g fill="#f4f6f8" stroke-width="2">
    <rect x="20" y="20" width="420" height="270" rx="8" stroke="#5b6b7a"/>
    <rect x="460" y="20" width="420" height="270" rx="8" stroke="#bc4749"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="230" y="48" fill="#1b2a3a">Ordinary allele: Mendel</text>
    <text x="670" y="48" fill="#bc4749">Gene drive allele</text>
  </g>

  <!-- ===== left: chromosome pair in a germ cell, then gametes ===== -->
  <text x="40" y="80" font-size="14" fill="#5b6b7a">germ cell, <tspan font-style="italic">D</tspan>/+</text>
  <g>
    <rect x="80" y="96" width="18" height="120" rx="9" fill="#cfe0ec" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="80" y="140" width="18" height="24" fill="#bc4749"/>
    <rect x="80" y="96" width="18" height="120" rx="9" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="120" y="96" width="18" height="120" rx="9" fill="#cfe0ec" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="89" y="236" fill="#bc4749" font-style="italic">D</text>
    <text x="129" y="236" fill="#1b2a3a">+</text>
  </g>
  <line x1="160" y1="156" x2="236" y2="156" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="198" y="146" font-size="13" fill="#5b6b7a" text-anchor="middle">meiosis</text>
  <!-- gametes -->
  <g stroke="#1b2a3a" stroke-width="2">
    <circle cx="275" cy="120" r="22" fill="#fbeaea"/>
    <circle cx="275" cy="192" r="22" fill="#fff"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="275" y="126" fill="#bc4749" font-style="italic">D</text>
    <text x="275" y="198" fill="#1b2a3a">+</text>
  </g>
  <g font-size="14" fill="#1b2a3a">
    <text x="310" y="125">½ of gametes</text>
    <text x="310" y="197">½ of gametes</text>
  </g>
  <text x="230" y="270" font-size="14" fill="#1b2a3a" text-anchor="middle">Law of segregation: each allele goes to half the gametes</text>

  <!-- ===== right: drive cuts the + homolog, repair copies D ===== -->
  <text x="480" y="80" font-size="14" fill="#5b6b7a">germ cell, <tspan font-style="italic">D</tspan>/+</text>
  <g>
    <rect x="520" y="96" width="18" height="120" rx="9" fill="#cfe0ec" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="520" y="140" width="18" height="24" fill="#bc4749"/>
    <rect x="520" y="96" width="18" height="120" rx="9" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="560" y="96" width="18" height="120" rx="9" fill="#cfe0ec" stroke="#1b2a3a" stroke-width="1.5"/>
    <!-- cut on the + homolog -->
    <line x1="552" y1="152" x2="584" y2="152" stroke="#bc4749" stroke-width="3"/>
  </g>
  <text x="600" y="132" font-size="13" fill="#bc4749">Cas9 cuts +,</text>
  <text x="600" y="148" font-size="13" fill="#bc4749">repair copies <tspan font-style="italic">D</tspan></text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="529" y="236" fill="#bc4749" font-style="italic">D</text>
    <text x="569" y="236" fill="#1b2a3a">+</text>
  </g>
  <line x1="600" y1="160" x2="726" y2="160" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="180" font-size="13" fill="#5b6b7a">germ line now <tspan font-style="italic">D</tspan>/<tspan font-style="italic">D</tspan></text>
  <g stroke="#1b2a3a" stroke-width="2" fill="#fbeaea">
    <circle cx="765" cy="120" r="22"/>
    <circle cx="765" cy="192" r="22"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#bc4749" font-style="italic">
    <text x="765" y="126">D</text>
    <text x="765" y="198">D</text>
  </g>
  <text x="796" y="152" font-size="14" fill="#1b2a3a">nearly all</text>
  <text x="796" y="169" font-size="14" fill="#1b2a3a">gametes</text>
  <text x="670" y="270" font-size="14" fill="#1b2a3a" text-anchor="middle">The drive spreads even if it harms its carriers</text>

  <text x="20" y="320" font-size="14" fill="#1b2a3a">Kyrou et al. 2018: a drive in <tspan font-style="italic">doublesex</tspan> (homozygous females are sterile) reached 100% prevalence in caged</text>
  <text x="20" y="340" font-size="14" fill="#1b2a3a"><tspan font-style="italic">Anopheles gambiae</tspan> within 7–11 generations, and the population collapsed. A released drive could spread through a wild species.</text>
</svg>
