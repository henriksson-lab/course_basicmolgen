<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="Helvetica, Arial, sans-serif">
  <!-- A yeast artificial chromosome (YAC): the three elements every eukaryotic chromosome needs
       (telomeres at both ends, an origin of replication = ARS, a centromere = CEN), two yeast
       selectable markers (TRP1, URA3), and a large insert of foreign DNA (not to scale). -->

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1b2a3a">A yeast artificial chromosome (not to scale)</text>

  <!-- backbone line -->
  <line x1="40" y1="100" x2="920" y2="100" stroke="#1b2a3a" stroke-width="3"/>

  <!-- elements -->
  <rect x="40" y="84" width="40" height="32" rx="4" fill="#6a994e"/>
  <rect x="104" y="84" width="70" height="32" rx="4" fill="#8a96a3"/>
  <rect x="196" y="84" width="54" height="32" rx="4" fill="#2a6f97"/>
  <rect x="272" y="84" width="54" height="32" rx="4" fill="#bc4749"/>
  <!-- insert -->
  <rect x="350" y="80" width="380" height="40" rx="4" fill="#f6e2c2" stroke="#d08c2f" stroke-width="1.5"/>
  <rect x="756" y="84" width="70" height="32" rx="4" fill="#8a96a3"/>
  <rect x="880" y="84" width="40" height="32" rx="4" fill="#6a994e"/>

  <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="60" y="105">TEL</text>
    <text x="139" y="105" font-style="italic">TRP1</text>
    <text x="223" y="105">ARS</text>
    <text x="299" y="105">CEN</text>
    <text x="791" y="105" font-style="italic">URA3</text>
    <text x="900" y="105">TEL</text>
  </g>
  <text x="540" y="105" font-size="15" font-weight="bold" fill="#9a6a1f" text-anchor="middle">insert: 100 kb to over 1 Mb of foreign DNA</text>

  <!-- what each element does -->
  <g stroke="#7a8794" stroke-width="1.2">
    <line x1="60" y1="120" x2="60" y2="150"/>
    <line x1="139" y1="120" x2="139" y2="196"/>
    <line x1="223" y1="120" x2="223" y2="150"/>
    <line x1="299" y1="120" x2="299" y2="196"/>
    <line x1="900" y1="120" x2="900" y2="150"/>
    <line x1="791" y1="120" x2="791" y2="196"/>
  </g>
  <g font-size="13.5" fill="#1b2a3a">
    <text x="20" y="168">telomere:</text>
    <text x="20" y="184" fill="#5b6b7a">caps the end</text>
    <text x="180" y="168">origin:</text>
    <text x="180" y="184" fill="#5b6b7a">replication</text>
    <text x="100" y="214">selectable marker</text>
    <text x="100" y="230" fill="#5b6b7a">(growth without Trp)</text>
    <text x="270" y="214">centromere:</text>
    <text x="270" y="230" fill="#5b6b7a">segregation in mitosis</text>
    <text x="704" y="214">selectable marker</text>
    <text x="704" y="230" fill="#5b6b7a">(growth without uracil)</text>
    <text x="940" y="168" text-anchor="end">telomere</text>
  </g>
  <text x="400" y="160" font-size="13.5" fill="#1b2a3a">Selecting for both markers keeps only yeast</text>
  <text x="400" y="178" font-size="13.5" fill="#1b2a3a">cells that carry the whole construct, both arms.</text>
</svg>
