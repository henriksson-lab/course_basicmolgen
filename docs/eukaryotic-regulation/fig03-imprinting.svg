<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif">
  <!-- fig03: genomic imprinting at 15q11-q13. Paternal-only expressed genes (SNRPN cluster, here one box)
       and maternal-only expressed UBE3A (in neurons). Three individuals: normal; a deletion on the
       paternal chromosome 15 -> no SNRPN-cluster expression -> Prader-Willi syndrome; a deletion on the
       maternal chromosome 15 -> no UBE3A in neurons -> Angelman syndrome. Same deletion, different
       disease, depending on the parent of origin. -->
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">Imprinting at 15q11–q13: which parent the chromosome came from matters</text>

  <!-- column template: x0 = 30, 320, 610 ; chromosome lines at y=110 (paternal) and y=190 (maternal) -->
  <!-- ===== normal ===== -->
  <text x="30" y="68" font-size="16" font-weight="bold" fill="#1b2a3a">Normal</text>
  <text x="30" y="104" font-size="14" fill="#2a6f97">pat</text>
  <line x1="66" y1="100" x2="280" y2="100" stroke="#2a6f97" stroke-width="6" stroke-linecap="round"/>
  <rect x="110" y="86" width="70" height="28" rx="4" fill="#5f9e4a" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="145" y="105" font-size="13" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">SNRPN</text>
  <rect x="190" y="86" width="70" height="28" rx="4" fill="#e3e6ea" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="225" y="105" font-size="13" font-style="italic" fill="#8a929b" text-anchor="middle">UBE3A</text>
  <text x="30" y="164" font-size="14" fill="#c0392b">mat</text>
  <line x1="66" y1="160" x2="280" y2="160" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <rect x="110" y="146" width="70" height="28" rx="4" fill="#e3e6ea" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="145" y="165" font-size="13" font-style="italic" fill="#8a929b" text-anchor="middle">SNRPN</text>
  <rect x="190" y="146" width="70" height="28" rx="4" fill="#5f9e4a" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="225" y="165" font-size="13" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">UBE3A</text>
  <text x="30" y="214" font-size="14" fill="#1b2a3a">one active copy of each:</text>
  <text x="30" y="234" font-size="14" font-weight="bold" fill="#2e7d32">healthy</text>

  <!-- ===== paternal deletion ===== -->
  <text x="320" y="68" font-size="16" font-weight="bold" fill="#1b2a3a">Deletion on the paternal 15</text>
  <text x="320" y="104" font-size="14" fill="#2a6f97">pat</text>
  <line x1="356" y1="100" x2="390" y2="100" stroke="#2a6f97" stroke-width="6" stroke-linecap="round"/>
  <line x1="540" y1="100" x2="570" y2="100" stroke="#2a6f97" stroke-width="6" stroke-linecap="round"/>
  <rect x="396" y="86" width="140" height="28" rx="4" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="466" y="105" font-size="13" fill="#c62828" text-anchor="middle">deleted</text>
  <text x="320" y="164" font-size="14" fill="#c0392b">mat</text>
  <line x1="356" y1="160" x2="570" y2="160" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <rect x="400" y="146" width="70" height="28" rx="4" fill="#e3e6ea" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="435" y="165" font-size="13" font-style="italic" fill="#8a929b" text-anchor="middle">SNRPN</text>
  <rect x="480" y="146" width="70" height="28" rx="4" fill="#5f9e4a" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="515" y="165" font-size="13" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">UBE3A</text>
  <text x="320" y="214" font-size="14" fill="#1b2a3a">no active <tspan font-style="italic">SNRPN</tspan>-cluster genes:</text>
  <text x="320" y="234" font-size="14" font-weight="bold" fill="#c62828">Prader–Willi syndrome</text>

  <!-- ===== maternal deletion ===== -->
  <text x="610" y="68" font-size="16" font-weight="bold" fill="#1b2a3a">Deletion on the maternal 15</text>
  <text x="610" y="104" font-size="14" fill="#2a6f97">pat</text>
  <line x1="646" y1="100" x2="860" y2="100" stroke="#2a6f97" stroke-width="6" stroke-linecap="round"/>
  <rect x="690" y="86" width="70" height="28" rx="4" fill="#5f9e4a" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="725" y="105" font-size="13" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">SNRPN</text>
  <rect x="770" y="86" width="70" height="28" rx="4" fill="#e3e6ea" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="805" y="105" font-size="13" font-style="italic" fill="#8a929b" text-anchor="middle">UBE3A</text>
  <text x="610" y="164" font-size="14" fill="#c0392b">mat</text>
  <line x1="646" y1="160" x2="680" y2="160" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <line x1="830" y1="160" x2="860" y2="160" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <rect x="686" y="146" width="140" height="28" rx="4" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="756" y="165" font-size="13" fill="#c62828" text-anchor="middle">deleted</text>
  <text x="610" y="214" font-size="14" fill="#1b2a3a">no active <tspan font-style="italic">UBE3A</tspan> in neurons:</text>
  <text x="610" y="234" font-size="14" font-weight="bold" fill="#c62828">Angelman syndrome</text>

  <!-- legend -->
  <line x1="20" y1="262" x2="880" y2="262" stroke="#d5dae0" stroke-width="1.5"/>
  <rect x="30" y="278" width="34" height="20" rx="3" fill="#5f9e4a" stroke="#1b2a3a"/>
  <text x="74" y="293" font-size="14" fill="#1b2a3a">expressed</text>
  <rect x="170" y="278" width="34" height="20" rx="3" fill="#e3e6ea" stroke="#9aa5b1"/>
  <text x="214" y="293" font-size="14" fill="#1b2a3a">silenced by the imprint (methylation set in the parent's germ line)</text>
  <text x="30" y="326" font-size="14" fill="#5c6b7a">The same syndromes arise from uniparental disomy: two maternal 15s (no paternal copy) give Prader–Willi,</text>
  <text x="30" y="346" font-size="14" fill="#5c6b7a">two paternal 15s give Angelman. Simplified: the region holds several imprinted genes.</text>
</svg>
