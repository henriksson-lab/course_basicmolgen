<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif">
  <!-- fig03: twin design. Correlations are illustrative, not from a specific study. -->
  <text x="190" y="34" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Identical (MZ) twins</text>
  <circle cx="156" cy="78" r="16" fill="#2a6f97"/>
  <rect x="136" y="98" width="40" height="52" rx="14" fill="#2a6f97"/>
  <circle cx="224" cy="78" r="16" fill="#2a6f97"/>
  <rect x="204" y="98" width="40" height="52" rx="14" fill="#2a6f97"/>
  <text x="190" y="178" font-size="15" fill="#1b2a3a" text-anchor="middle">share 100% of their genes</text>
  <text x="190" y="198" font-size="15" fill="#1b2a3a" text-anchor="middle">and (we assume) the same family environment</text>
  <text x="560" y="34" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Fraternal (DZ) twins</text>
  <circle cx="526" cy="78" r="16" fill="#6a994e"/>
  <rect x="506" y="98" width="40" height="52" rx="14" fill="#6a994e"/>
  <circle cx="594" cy="78" r="16" fill="#6a994e"/>
  <rect x="574" y="98" width="40" height="52" rx="14" fill="#6a994e"/>
  <text x="560" y="178" font-size="15" fill="#1b2a3a" text-anchor="middle">share 50% (on average) of their genes</text>
  <text x="560" y="198" font-size="15" fill="#1b2a3a" text-anchor="middle">and (we assume) the same family environment</text>
  <line x1="40" y1="232" x2="720" y2="232" stroke="#ddd"/>
  <text x="190" y="270" font-size="17" font-weight="bold" fill="#2a6f97" text-anchor="middle">correlation r(MZ), e.g. 0.8</text>
  <text x="560" y="270" font-size="17" font-weight="bold" fill="#6a994e" text-anchor="middle">correlation r(DZ), e.g. 0.5</text>
  <text x="190" y="318" font-size="17" fill="#1b2a3a">Falconer: h<tspan dy="-7" font-size="11">2</tspan><tspan dy="7"> ≈ 2 [r(MZ) − r(DZ)] = 2 × (0.8 − 0.5) = 0.6</tspan></text>
  <text x="745" y="80" font-size="14" fill="#555">MZ twins are more alike</text>
  <text x="745" y="102" font-size="14" fill="#555">than DZ twins because</text>
  <text x="745" y="124" font-size="14" fill="#555">they share more genes.</text>
  <text x="745" y="146" font-size="14" fill="#555"></text>
  <text x="745" y="168" font-size="14" fill="#555">Assumes MZ and DZ</text>
  <text x="745" y="190" font-size="14" fill="#555">environments are equally</text>
  <text x="745" y="212" font-size="14" fill="#555">similar (debatable).</text>
</svg>
