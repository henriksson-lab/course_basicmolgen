<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Helvetica, Arial, sans-serif">
  <!-- fig08: schematic larval cuticles (ventral view, anterior left) for the three classes of
       zygotic segmentation mutants found in the Heidelberg screen. Each segment has a band of
       denticles (small hooks pointing backwards) at its front and naked cuticle behind.
       Wild type: head + 3 thoracic (T1-T3) + 8 abdominal (A1-A8) belts.
       Gap (e.g. Kruppel): a block of adjacent segments is missing.
       Pair-rule (e.g. fushi tarazu, even-skipped): every other segment is missing, half as many belts.
       Segment polarity (e.g. wingless, hedgehog): all segments present, but the naked part of each
       is replaced by a mirror image of the denticle part: a shorter larva covered in a lawn of denticles.
       Schematic only: real gap and pair-rule phenotypes involve parasegments and partial fusions. -->
  <defs>
    <pattern id="dentR" width="7" height="8" patternUnits="userSpaceOnUse">
      <path d="M1.5,1 L5.5,4 L1.5,7" fill="none" stroke="#6b4a2b" stroke-width="1.3"/>
    </pattern>
    <pattern id="dentL" width="7" height="8" patternUnits="userSpaceOnUse">
      <path d="M5.5,1 L1.5,4 L5.5,7" fill="none" stroke="#6b4a2b" stroke-width="1.3"/>
    </pattern>
    <g id="belt"><rect x="0" y="-17" width="20" height="34" fill="#efe3cf"/><rect x="0" y="-17" width="20" height="34" fill="url(#dentR)" stroke="#a07d55" stroke-width="0.8"/></g>
    <g id="lawn"><rect x="0" y="-17" width="18" height="34" fill="#efe3cf"/><rect x="0" y="-17" width="18" height="34" fill="url(#dentR)"/><rect x="18" y="-17" width="18" height="34" fill="#efe3cf"/><rect x="18" y="-17" width="18" height="34" fill="url(#dentL)"/><rect x="0" y="-17" width="36" height="34" fill="none" stroke="#a07d55" stroke-width="0.8"/></g>
    <g id="head"><path d="M40,-22 L14,-22 Q0,-22 0,0 Q0,22 14,22 L40,22 Z" fill="#f6efe2" stroke="#1b2a3a" stroke-width="1.5"/></g>
  </defs>

  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">Reading a dead embryo's cuticle: three classes of segmentation mutant</text>

  <!-- ===== wild type ===== -->
  <text x="20" y="64" font-size="16" font-weight="bold" fill="#1b2a3a">Wild type</text>
  <text x="20" y="84" font-size="13" fill="#5c6b7a">11 belts</text>
  <g transform="translate(180,70)">
    <use href="#head"/>
    <rect x="40" y="-22" width="550" height="44" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
    <use href="#belt" x="45"/><use href="#belt" x="95"/><use href="#belt" x="145"/>
    <use href="#belt" x="195"/><use href="#belt" x="245"/><use href="#belt" x="295"/><use href="#belt" x="345"/>
    <use href="#belt" x="395"/><use href="#belt" x="445"/><use href="#belt" x="495"/><use href="#belt" x="545"/>
    <path d="M590,-22 Q606,-22 606,0 Q606,22 590,22" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
    <g font-size="12" fill="#5c6b7a" text-anchor="middle">
      <text x="55" y="38">T1</text><text x="105" y="38">T2</text><text x="155" y="38">T3</text>
      <text x="205" y="38">A1</text><text x="255" y="38">A2</text><text x="305" y="38">A3</text><text x="355" y="38">A4</text>
      <text x="405" y="38">A5</text><text x="455" y="38">A6</text><text x="505" y="38">A7</text><text x="555" y="38">A8</text>
    </g>
  </g>
  <text x="800" y="66" font-size="13" fill="#5c6b7a">one belt of</text>
  <text x="800" y="84" font-size="13" fill="#5c6b7a">denticles per</text>
  <text x="800" y="102" font-size="13" fill="#5c6b7a">segment</text>

  <line x1="20" y1="122" x2="880" y2="122" stroke="#d5dae0" stroke-width="1.2"/>

  <!-- ===== gap ===== -->
  <text x="20" y="160" font-size="16" font-weight="bold" fill="#c98a2e">Gap</text>
  <text x="20" y="180" font-size="13" font-style="italic" fill="#1b2a3a">Krüppel</text>
  <g transform="translate(180,166)">
    <use href="#head"/>
    <rect x="40" y="-22" width="150" height="44" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
    <use href="#belt" x="45"/><use href="#belt" x="95"/><use href="#belt" x="145"/>
    <path d="M190,-22 Q206,-22 206,0 Q206,22 190,22" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
    <g font-size="12" fill="#5c6b7a" text-anchor="middle">
      <text x="55" y="36">A6</text><text x="105" y="36">A7</text><text x="155" y="36">A8</text>
    </g>
  </g>
  <text x="410" y="162" font-size="14" fill="#1b2a3a">a <tspan font-weight="bold">block of adjacent segments</tspan> is missing;</text>
  <text x="410" y="181" font-size="14" fill="#1b2a3a">here, roughly T1 to A5 (simplified)</text>

  <line x1="20" y1="212" x2="880" y2="212" stroke="#d5dae0" stroke-width="1.2"/>

  <!-- ===== pair-rule ===== -->
  <text x="20" y="246" font-size="16" font-weight="bold" fill="#8e5aa8">Pair-rule</text>
  <text x="20" y="266" font-size="13" font-style="italic" fill="#1b2a3a">fushi tarazu, even-skipped</text>
  <g transform="translate(180,252)">
    <use href="#head"/>
    <rect x="40" y="-22" width="300" height="44" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
    <use href="#belt" x="45"/><use href="#belt" x="95"/><use href="#belt" x="145"/>
    <use href="#belt" x="195"/><use href="#belt" x="245"/><use href="#belt" x="295"/>
    <path d="M340,-22 Q356,-22 356,0 Q356,22 340,22" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <text x="560" y="248" font-size="14" fill="#1b2a3a"><tspan font-weight="bold">every other segment</tspan> is missing:</text>
  <text x="560" y="267" font-size="14" fill="#1b2a3a">about half as many belts</text>

  <line x1="20" y1="294" x2="880" y2="294" stroke="#d5dae0" stroke-width="1.2"/>

  <!-- ===== segment polarity ===== -->
  <text x="20" y="332" font-size="16" font-weight="bold" fill="#3f7fa6">Segment polarity</text>
  <text x="20" y="352" font-size="13" font-style="italic" fill="#1b2a3a">wingless, hedgehog</text>
  <g transform="translate(180,338)">
    <use href="#head"/>
    <rect x="40" y="-22" width="396" height="44" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
    <use href="#lawn" x="40"/><use href="#lawn" x="76"/><use href="#lawn" x="112"/><use href="#lawn" x="148"/>
    <use href="#lawn" x="184"/><use href="#lawn" x="220"/><use href="#lawn" x="256"/><use href="#lawn" x="292"/>
    <use href="#lawn" x="328"/><use href="#lawn" x="364"/><use href="#lawn" x="400"/>
    <path d="M436,-22 Q452,-22 452,0 Q452,22 436,22" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <text x="650" y="324" font-size="14" fill="#1b2a3a">all segments, but the naked</text>
  <text x="650" y="343" font-size="14" fill="#1b2a3a">half of each is replaced by a</text>
  <text x="650" y="362" font-size="14" font-weight="bold" fill="#1b2a3a">mirror image of the belt</text>

  <line x1="20" y1="390" x2="880" y2="390" stroke="#d5dae0" stroke-width="1.2"/>
  <text x="20" y="416" font-size="13" fill="#5c6b7a">Schematic, anterior left; arrowheads show which way the denticles point. Real cuticles show partial fusions and parasegment boundaries.</text>
</svg>
