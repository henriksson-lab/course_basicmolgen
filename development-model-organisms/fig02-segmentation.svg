<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Helvetica, Arial, sans-serif">
  <!-- fig02: the Drosophila segmentation hierarchy, schematic (domains not to scale). Each row is the
       embryo (anterior left) with one class of genes: maternal bicoid gradient -> gap domains -> 7 pair-rule
       stripes -> 14 segment-polarity stripes -> Hox genes give each segment its identity. Each tier is
       regulated by the tiers above. Generated by make_seg_fig.py in the scratch folder. -->
  <defs>
    <linearGradient id="bcd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#c0392b"/><stop offset="0.6" stop-color="#c0392b" stop-opacity="0.06"/><stop offset="1" stop-color="#c0392b" stop-opacity="0"/></linearGradient>
    <clipPath id="emb"><ellipse cx="0" cy="0" rx="180" ry="30"/></clipPath>
  </defs>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#1b2a3a">Gene class</text>
  <text x="440" y="24" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Expression (anterior left)</text>
  <text x="650" y="24" font-size="15" font-weight="bold" fill="#1b2a3a">Mutant phenotype</text>
  <text x="20" y="66" font-size="15" font-weight="bold" fill="#c0392b">Maternal</text>
  <text x="20" y="85" font-size="13" fill="#1b2a3a"><tspan font-style="italic">bicoid</tspan>, <tspan font-style="italic">nanos</tspan></text>
  <text x="650" y="66" font-size="13" fill="#1b2a3a">mother's genotype decides;</text>
  <text x="650" y="85" font-size="13" fill="#1b2a3a"><tspan font-style="italic">bcd</tspan>: no head or thorax</text>
  <g transform="translate(440,70)">
    <rect x="-180" y="-30" width="360" height="60" fill="url(#bcd)" clip-path="url(#emb)"/>
    <ellipse cx="0" cy="0" rx="180" ry="30" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <path d="M433,106 L447,106 L440,118 Z" fill="#9aa5b1"/>
  <text x="20" y="150" font-size="15" font-weight="bold" fill="#d08c2f">Gap</text>
  <text x="20" y="169" font-size="13" fill="#1b2a3a"><tspan font-style="italic">hunchback</tspan>, <tspan font-style="italic">Krüppel</tspan>, <tspan font-style="italic">knirps</tspan></text>
  <text x="650" y="150" font-size="13" fill="#1b2a3a">a block of adjacent</text>
  <text x="650" y="169" font-size="13" fill="#1b2a3a">segments is missing (a gap)</text>
  <g transform="translate(440,154)">
    <g clip-path="url(#emb)">
      <rect x="-180" y="-30" width="165" height="60" fill="#d08c2f" opacity="0.55"/>
      <rect x="-40" y="-30" width="80" height="60" fill="#2a6f97" opacity="0.55"/>
      <rect x="50" y="-30" width="65" height="60" fill="#5f9e4a" opacity="0.55"/>
    </g>
    <text x="-120" y="5" font-size="12" fill="#1b2a3a" text-anchor="middle" font-style="italic">hb</text>
    <text x="0" y="5" font-size="12" fill="#1b2a3a" text-anchor="middle" font-style="italic">Kr</text>
    <text x="82" y="5" font-size="12" fill="#1b2a3a" text-anchor="middle" font-style="italic">kni</text>
    <ellipse cx="0" cy="0" rx="180" ry="30" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <path d="M433,190 L447,190 L440,202 Z" fill="#9aa5b1"/>
  <text x="20" y="234" font-size="15" font-weight="bold" fill="#7b3fa0">Pair-rule</text>
  <text x="20" y="253" font-size="13" fill="#1b2a3a"><tspan font-style="italic">even-skipped</tspan>, <tspan font-style="italic">fushi tarazu</tspan></text>
  <text x="650" y="234" font-size="13" fill="#1b2a3a">7 stripes; mutants lose</text>
  <text x="650" y="253" font-size="13" fill="#1b2a3a">every other segment</text>
  <g transform="translate(440,238)">
    <g clip-path="url(#emb)" fill="#7b3fa0" opacity="0.75">
      <rect x="-126" y="-30" width="16" height="60"/>
      <rect x="-88" y="-30" width="16" height="60"/>
      <rect x="-50" y="-30" width="16" height="60"/>
      <rect x="-12" y="-30" width="16" height="60"/>
      <rect x="26" y="-30" width="16" height="60"/>
      <rect x="64" y="-30" width="16" height="60"/>
      <rect x="102" y="-30" width="16" height="60"/>
    </g>
    <ellipse cx="0" cy="0" rx="180" ry="30" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <path d="M433,274 L447,274 L440,286 Z" fill="#9aa5b1"/>
  <text x="20" y="318" font-size="15" font-weight="bold" fill="#2a6f97">Segment polarity</text>
  <text x="20" y="337" font-size="13" fill="#1b2a3a"><tspan font-style="italic">engrailed</tspan>, <tspan font-style="italic">wingless</tspan>, <tspan font-style="italic">hedgehog</tspan></text>
  <text x="650" y="318" font-size="13" fill="#1b2a3a">14 stripes; part of every segment</text>
  <text x="650" y="337" font-size="13" fill="#1b2a3a">replaced by a mirror image</text>
  <g transform="translate(440,322)">
    <g clip-path="url(#emb)" fill="#2a6f97" opacity="0.8">
      <rect x="-130" y="-30" width="7" height="60"/>
      <rect x="-111" y="-30" width="7" height="60"/>
      <rect x="-92" y="-30" width="7" height="60"/>
      <rect x="-73" y="-30" width="7" height="60"/>
      <rect x="-54" y="-30" width="7" height="60"/>
      <rect x="-35" y="-30" width="7" height="60"/>
      <rect x="-16" y="-30" width="7" height="60"/>
      <rect x="3" y="-30" width="7" height="60"/>
      <rect x="22" y="-30" width="7" height="60"/>
      <rect x="41" y="-30" width="7" height="60"/>
      <rect x="60" y="-30" width="7" height="60"/>
      <rect x="79" y="-30" width="7" height="60"/>
      <rect x="98" y="-30" width="7" height="60"/>
      <rect x="117" y="-30" width="7" height="60"/>
    </g>
    <ellipse cx="0" cy="0" rx="180" ry="30" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <path d="M433,358 L447,358 L440,370 Z" fill="#9aa5b1"/>
  <text x="20" y="402" font-size="15" font-weight="bold" fill="#5f9e4a">Hox (homeotic)</text>
  <text x="20" y="421" font-size="13" fill="#1b2a3a"><tspan font-style="italic">Antennapedia</tspan>, <tspan font-style="italic">Ultrabithorax</tspan></text>
  <text x="650" y="402" font-size="13" fill="#1b2a3a">one segment develops like</text>
  <text x="650" y="421" font-size="13" fill="#1b2a3a">another (legs for antennae)</text>
  <g transform="translate(440,406)">
    <g clip-path="url(#emb)">
      <rect x="-140" y="-30" width="19" height="60" fill="#f6e2c2"/>
      <rect x="-121" y="-30" width="19" height="60" fill="#f6e2c2"/>
      <rect x="-102" y="-30" width="19" height="60" fill="#f6e2c2"/>
      <rect x="-83" y="-30" width="19" height="60" fill="#dbe8d1"/>
      <rect x="-64" y="-30" width="19" height="60" fill="#bcd7b0"/>
      <rect x="-45" y="-30" width="19" height="60" fill="#9cc58c"/>
      <rect x="-26" y="-30" width="19" height="60" fill="#7fb26c"/>
      <rect x="-7" y="-30" width="19" height="60" fill="#6aa257"/>
      <rect x="12" y="-30" width="19" height="60" fill="#5f9e4a"/>
      <rect x="31" y="-30" width="19" height="60" fill="#538f40"/>
      <rect x="50" y="-30" width="19" height="60" fill="#4a8238"/>
      <rect x="69" y="-30" width="19" height="60" fill="#417530"/>
      <rect x="88" y="-30" width="19" height="60" fill="#386828"/>
      <rect x="107" y="-30" width="19" height="60" fill="#2f5b20"/>
    </g>
    <text x="-110" y="5" font-size="12" fill="#1b2a3a" text-anchor="middle">head</text>
    <text x="-12" y="5" font-size="12" fill="#1b2a3a" text-anchor="middle">thorax</text>
    <text x="90" y="5" font-size="12" fill="#ffffff" text-anchor="middle">abdomen</text>
    <ellipse cx="0" cy="0" rx="180" ry="30" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
</svg>
