<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="Helvetica, Arial, sans-serif">
  <!-- fig02: phase known vs phase unknown for the affected parent (II-1 in fig01).
       Each homologue is drawn as a vertical bar with the disease locus (D/d) above and the
       marker (1/2) below. Phase known: one arrangement, k = 1 of n = 6. Phase unknown: two
       arrangements, each with prior probability 1/2; under the second, the same children
       count as n - k = 5 recombinants. -->
  <!-- panel frames -->
  <rect x="10" y="10" width="330" height="340" rx="10" fill="#f4f6f8" stroke="#7a8794" stroke-width="1.5"/>
  <rect x="356" y="10" width="554" height="340" rx="10" fill="#f4f6f8" stroke="#7a8794" stroke-width="1.5"/>
  <g font-size="20" font-weight="bold" fill="#1b2a3a">
    <text x="30" y="42">Phase known</text>
    <text x="376" y="42">Phase unknown</text>
  </g>
  <g font-size="14" fill="#5b6b7a">
    <text x="30" y="64">a grandparent shows which marker</text>
    <text x="30" y="82">allele travels with D</text>
    <text x="376" y="64">no grandparents typed: two arrangements, ½ each</text>
  </g>

  <!-- ===== left: one arrangement ===== -->
  <g>
    <rect x="130" y="100" width="18" height="140" rx="9" fill="#2a6f97"/>
    <rect x="190" y="100" width="18" height="140" rx="9" fill="#bc4749"/>
    <g stroke="#fff" stroke-width="3">
      <line x1="130" y1="135" x2="148" y2="135"/><line x1="190" y1="135" x2="208" y2="135"/>
      <line x1="130" y1="205" x2="148" y2="205"/><line x1="190" y1="205" x2="208" y2="205"/>
    </g>
    <g font-size="19" font-weight="bold">
      <text x="122" y="142" text-anchor="end" fill="#2a6f97" font-style="italic">D</text>
      <text x="122" y="212" text-anchor="end" fill="#2a6f97">1</text>
      <text x="216" y="142" fill="#bc4749" font-style="italic">d</text>
      <text x="216" y="212" fill="#bc4749">2</text>
    </g>
    <text x="30" y="275" font-size="16" fill="#1b2a3a">children: 5 NR, 1 R</text>
    <text x="30" y="303" font-size="18" fill="#1b2a3a">L(θ) = θ<tspan dy="-7" font-size="13">1</tspan><tspan dy="7">(1 − θ)</tspan><tspan dy="-7" font-size="13">5</tspan></text>
    <text x="30" y="331" font-size="16" fill="#5b6b7a">max LOD = 0.63 at θ = 1/6</text>
  </g>

  <!-- ===== right: two arrangements ===== -->
  <!-- arrangement 1: D with 1 -->
  <g>
    <rect x="450" y="100" width="18" height="140" rx="9" fill="#2a6f97"/>
    <rect x="510" y="100" width="18" height="140" rx="9" fill="#bc4749"/>
    <g stroke="#fff" stroke-width="3">
      <line x1="450" y1="135" x2="468" y2="135"/><line x1="510" y1="135" x2="528" y2="135"/>
      <line x1="450" y1="205" x2="468" y2="205"/><line x1="510" y1="205" x2="528" y2="205"/>
    </g>
    <g font-size="19" font-weight="bold">
      <text x="442" y="142" text-anchor="end" fill="#2a6f97" font-style="italic">D</text>
      <text x="442" y="212" text-anchor="end" fill="#2a6f97">1</text>
      <text x="536" y="142" fill="#bc4749" font-style="italic">d</text>
      <text x="536" y="212" fill="#bc4749">2</text>
    </g>
    <text x="400" y="275" font-size="16" fill="#1b2a3a">½: 1 recombinant</text>
    <text x="400" y="303" font-size="18" fill="#1b2a3a">θ<tspan dy="-7" font-size="13">1</tspan><tspan dy="7">(1 − θ)</tspan><tspan dy="-7" font-size="13">5</tspan></text>
  </g>
  <text x="626" y="190" font-size="26" fill="#5b6b7a" text-anchor="middle">or</text>
  <!-- arrangement 2: D with 2 -->
  <g>
    <rect x="730" y="100" width="18" height="140" rx="9" fill="#bc4749"/>
    <rect x="790" y="100" width="18" height="140" rx="9" fill="#2a6f97"/>
    <g stroke="#fff" stroke-width="3">
      <line x1="730" y1="135" x2="748" y2="135"/><line x1="790" y1="135" x2="808" y2="135"/>
      <line x1="730" y1="205" x2="748" y2="205"/><line x1="790" y1="205" x2="808" y2="205"/>
    </g>
    <g font-size="19" font-weight="bold">
      <text x="722" y="142" text-anchor="end" fill="#bc4749" font-style="italic">D</text>
      <text x="722" y="212" text-anchor="end" fill="#bc4749">2</text>
      <text x="816" y="142" fill="#2a6f97" font-style="italic">d</text>
      <text x="816" y="212" fill="#2a6f97">1</text>
    </g>
    <text x="680" y="275" font-size="16" fill="#1b2a3a">½: 5 recombinants</text>
    <text x="680" y="303" font-size="18" fill="#1b2a3a">θ<tspan dy="-7" font-size="13">5</tspan><tspan dy="7">(1 − θ)</tspan><tspan dy="-7" font-size="13">1</tspan></text>
  </g>
  <text x="376" y="337" font-size="18" fill="#1b2a3a" font-weight="bold">L(θ) = ½ θ<tspan dy="-7" font-size="13">1</tspan><tspan dy="7">(1 − θ)</tspan><tspan dy="-7" font-size="13">5</tspan><tspan dy="7"> + ½ θ</tspan><tspan dy="-7" font-size="13">5</tspan><tspan dy="7">(1 − θ)</tspan><tspan dy="-7" font-size="13">1</tspan><tspan dy="7" font-weight="normal" fill="#5b6b7a" font-size="16">   max LOD = 0.33</tspan></text>
</svg>
