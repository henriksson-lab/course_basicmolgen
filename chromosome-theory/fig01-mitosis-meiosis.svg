<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif">
<!-- Mitosis vs meiosis for a cell with 2n = 4 (two homologous pairs: long and short). Blue = homologue from the father, red = from the mother. Replicated chromosomes have two sister chromatids. -->
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/></marker></defs>
<line x1="345" y1="20" x2="345" y2="455" stroke="#d5dbe1" stroke-width="2"/>
<text x="165" y="30" font-size="20" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Mitosis</text>
<text x="165" y="50" font-size="14" text-anchor="middle" fill="#5b6b7a" font-weight="normal">one division: sister chromatids separate</text>
<circle cx="165" cy="120" r="55" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
<rect x="119" y="90" width="8" height="56" rx="4" fill="#2a6f97"/>
<rect x="129" y="90" width="8" height="56" rx="4" fill="#2a6f97"/>
<rect x="141" y="90" width="8" height="56" rx="4" fill="#bc4749"/>
<rect x="151" y="90" width="8" height="56" rx="4" fill="#bc4749"/>
<rect x="165" y="110" width="8" height="34" rx="4" fill="#2a6f97"/>
<rect x="175" y="110" width="8" height="34" rx="4" fill="#2a6f97"/>
<rect x="187" y="110" width="8" height="34" rx="4" fill="#bc4749"/>
<rect x="197" y="110" width="8" height="34" rx="4" fill="#bc4749"/>
<text x="228" y="112" font-size="14" text-anchor="start" fill="#1b2a3a" font-weight="bold">2n = 4</text>
<text x="228" y="129" font-size="14" text-anchor="start" fill="#5b6b7a" font-weight="normal">8 chromatids</text>
<line x1="130" y1="178" x2="98" y2="232" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="200" y1="178" x2="232" y2="232" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="85" cy="300" r="55" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
<rect x="51" y="270" width="8" height="56" rx="4" fill="#2a6f97"/>
<rect x="71" y="270" width="8" height="56" rx="4" fill="#bc4749"/>
<rect x="91" y="290" width="8" height="34" rx="4" fill="#2a6f97"/>
<rect x="111" y="290" width="8" height="34" rx="4" fill="#bc4749"/>
<text x="85" y="377" font-size="14" text-anchor="middle" fill="#1b2a3a" font-weight="bold">2n = 4</text>
<text x="85" y="394" font-size="14" text-anchor="middle" fill="#5b6b7a" font-weight="normal">4 chromatids</text>
<circle cx="245" cy="300" r="55" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
<rect x="211" y="270" width="8" height="56" rx="4" fill="#2a6f97"/>
<rect x="231" y="270" width="8" height="56" rx="4" fill="#bc4749"/>
<rect x="251" y="290" width="8" height="34" rx="4" fill="#2a6f97"/>
<rect x="271" y="290" width="8" height="34" rx="4" fill="#bc4749"/>
<text x="245" y="377" font-size="14" text-anchor="middle" fill="#1b2a3a" font-weight="bold">2n = 4</text>
<text x="245" y="394" font-size="14" text-anchor="middle" fill="#5b6b7a" font-weight="normal">4 chromatids</text>
<text x="165" y="432" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal">2 diploid cells, identical</text>
<text x="165" y="450" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal">to the parent cell</text>
<text x="680" y="30" font-size="20" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Meiosis</text>
<text x="680" y="50" font-size="14" text-anchor="middle" fill="#5b6b7a" font-weight="normal">two divisions: homologues, then sister chromatids</text>
<circle cx="680" cy="120" r="55" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
<rect x="639" y="90" width="8" height="56" rx="4" fill="#2a6f97"/>
<rect x="649" y="90" width="8" height="56" rx="4" fill="#2a6f97"/>
<rect x="661" y="90" width="8" height="56" rx="4" fill="#bc4749"/>
<rect x="671" y="90" width="8" height="56" rx="4" fill="#bc4749"/>
<rect x="684" y="110" width="8" height="34" rx="4" fill="#2a6f97"/>
<rect x="694" y="110" width="8" height="34" rx="4" fill="#2a6f97"/>
<rect x="706" y="110" width="8" height="34" rx="4" fill="#bc4749"/>
<rect x="716" y="110" width="8" height="34" rx="4" fill="#bc4749"/>
<text x="745" y="112" font-size="14" text-anchor="start" fill="#1b2a3a" font-weight="bold">2n = 4</text>
<text x="745" y="129" font-size="14" text-anchor="start" fill="#5b6b7a" font-weight="normal">8 chromatids</text>
<text x="372" y="160" font-size="15" text-anchor="start" fill="#1b2a3a" font-weight="bold">meiosis I:</text>
<text x="372" y="178" font-size="14" text-anchor="start" fill="#5b6b7a" font-weight="normal">homologues separate</text>
<line x1="642" y1="162" x2="588" y2="196" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="718" y1="162" x2="772" y2="196" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="550" cy="240" r="50" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
<rect x="529" y="210" width="8" height="56" rx="4" fill="#2a6f97"/>
<rect x="539" y="210" width="8" height="56" rx="4" fill="#2a6f97"/>
<rect x="555" y="230" width="8" height="34" rx="4" fill="#bc4749"/>
<rect x="565" y="230" width="8" height="34" rx="4" fill="#bc4749"/>
<circle cx="810" cy="240" r="50" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
<rect x="789" y="210" width="8" height="56" rx="4" fill="#bc4749"/>
<rect x="799" y="210" width="8" height="56" rx="4" fill="#bc4749"/>
<rect x="815" y="230" width="8" height="34" rx="4" fill="#2a6f97"/>
<rect x="825" y="230" width="8" height="34" rx="4" fill="#2a6f97"/>
<text x="490" y="236" font-size="14" text-anchor="end" fill="#1b2a3a" font-weight="bold">n = 2</text>
<text x="490" y="253" font-size="14" text-anchor="end" fill="#5b6b7a" font-weight="normal">4 chromatids</text>
<text x="870" y="236" font-size="14" text-anchor="start" fill="#1b2a3a" font-weight="bold">n = 2</text>
<text x="870" y="253" font-size="14" text-anchor="start" fill="#5b6b7a" font-weight="normal">4 chromatids</text>
<text x="372" y="318" font-size="15" text-anchor="start" fill="#1b2a3a" font-weight="bold">meiosis II:</text>
<text x="372" y="336" font-size="14" text-anchor="start" fill="#5b6b7a" font-weight="normal">sisters separate</text>
<line x1="524" y1="286" x2="497" y2="348" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="576" y1="286" x2="603" y2="348" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="784" y1="286" x2="757" y2="348" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="836" y1="286" x2="863" y2="348" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="485" cy="392" r="40" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
<rect x="472" y="362" width="8" height="56" rx="4" fill="#2a6f97"/>
<rect x="492" y="382" width="8" height="34" rx="4" fill="#bc4749"/>
<circle cx="615" cy="392" r="40" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
<rect x="602" y="362" width="8" height="56" rx="4" fill="#2a6f97"/>
<rect x="622" y="382" width="8" height="34" rx="4" fill="#bc4749"/>
<circle cx="745" cy="392" r="40" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
<rect x="732" y="362" width="8" height="56" rx="4" fill="#bc4749"/>
<rect x="752" y="382" width="8" height="34" rx="4" fill="#2a6f97"/>
<circle cx="875" cy="392" r="40" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
<rect x="862" y="362" width="8" height="56" rx="4" fill="#bc4749"/>
<rect x="882" y="382" width="8" height="34" rx="4" fill="#2a6f97"/>
<text x="680" y="452" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal">4 haploid gametes: n = 2, one chromatid per chromosome</text>
</svg>
