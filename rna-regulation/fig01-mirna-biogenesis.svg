<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="Helvetica, Arial, sans-serif">
  <!-- fig01: microRNA biogenesis. In the nucleus a miRNA gene is transcribed by RNA pol II into a
       pri-miRNA with a hairpin; Drosha (with DGCR8) cuts out the ~70-nt pre-miRNA hairpin; Exportin-5
       moves it to the cytoplasm; Dicer cuts off the loop to give a ~22-nt duplex; one strand (the guide,
       the mature miRNA) is loaded into Argonaute in RISC; the passenger strand is degraded. RISC then
       finds mRNAs with sites complementary to the seed. -->
  <defs>
    <marker id="arr" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- nucleus -->
  <rect x="14" y="40" width="372" height="300" rx="30" fill="#f3f0f8" stroke="#7b3fa0" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="30" y="66" font-size="16" font-weight="bold" fill="#7b3fa0">nucleus</text>
  <text x="420" y="66" font-size="16" font-weight="bold" fill="#1b2a3a">cytoplasm</text>

  <!-- step 1: pri-miRNA -->
  <text x="40" y="100" font-size="14" fill="#1b2a3a">1. RNA pol II makes a</text>
  <text x="40" y="118" font-size="14" fill="#1b2a3a">pri-miRNA (cap, poly-A)</text>
  <path d="M40,160 L130,160 L140,150 L140,128 Q150,116 160,128 L160,150 L170,160 L250,160" fill="none" stroke="#d08c2f" stroke-width="3"/>
  <line x1="140" y1="140" x2="160" y2="140" stroke="#d08c2f" stroke-width="1.5"/>
  <line x1="140" y1="150" x2="160" y2="150" stroke="#d08c2f" stroke-width="1.5"/>
  <!-- Drosha scissors -->
  <circle cx="200" cy="140" r="16" fill="#c0392b"/>
  <text x="222" y="137" font-size="14" font-weight="bold" fill="#c0392b">Drosha</text>
  <text x="222" y="153" font-size="12" fill="#c0392b">(+ DGCR8)</text>

  <line x1="150" y1="176" x2="150" y2="210" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 2: pre-miRNA -->
  <path d="M130,262 L140,252 L140,226 Q150,214 160,226 L160,252 L170,262" fill="none" stroke="#d08c2f" stroke-width="3"/>
  <line x1="140" y1="238" x2="160" y2="238" stroke="#d08c2f" stroke-width="1.5"/>
  <line x1="140" y1="248" x2="160" y2="248" stroke="#d08c2f" stroke-width="1.5"/>
  <text x="186" y="236" font-size="14" fill="#1b2a3a">2. pre-miRNA hairpin</text>
  <text x="186" y="254" font-size="13" fill="#5c6b7a">(~70 nt)</text>

  <!-- export -->
  <path d="M240,290 C320,300 360,300 440,250" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="240" y="320" font-size="13" fill="#1b2a3a">Exportin-5</text>

  <!-- step 3: Dicer -->
  <path d="M460,232 L470,222 L470,196 Q480,184 490,196 L490,222 L500,232" fill="none" stroke="#d08c2f" stroke-width="3"/>
  <line x1="470" y1="208" x2="490" y2="208" stroke="#d08c2f" stroke-width="1.5"/>
  <line x1="470" y1="218" x2="490" y2="218" stroke="#d08c2f" stroke-width="1.5"/>
  <circle cx="520" cy="196" r="16" fill="#2a6f97"/>
  <text x="542" y="193" font-size="14" font-weight="bold" fill="#2a6f97">Dicer</text>
  <text x="542" y="209" font-size="12" fill="#2a6f97">cuts off the loop</text>
  <line x1="480" y1="248" x2="480" y2="276" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- duplex -->
  <line x1="430" y1="296" x2="540" y2="296" stroke="#c0392b" stroke-width="4"/>
  <line x1="434" y1="306" x2="544" y2="306" stroke="#9aa5b1" stroke-width="4"/>
  <text x="556" y="294" font-size="13" fill="#c0392b">guide (mature miRNA, ~22 nt)</text>
  <text x="556" y="312" font-size="13" fill="#5c6b7a">passenger strand: degraded</text>
  <text x="430" y="336" font-size="14" fill="#1b2a3a">3. ~22-nt duplex</text>

  <!-- step 4: RISC -->
  <line x1="610" y1="272" x2="706" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <ellipse cx="780" cy="168" rx="80" ry="46" fill="#5f9e4a" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="780" y="158" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">RISC</text>
  <text x="780" y="176" font-size="13" fill="#ffffff" text-anchor="middle">(Argonaute +</text>
  <text x="780" y="192" font-size="13" fill="#ffffff" text-anchor="middle">guide strand)</text>
  <text x="700" y="78" font-size="14" fill="#1b2a3a">4. finds mRNAs that pair</text>
  <text x="700" y="96" font-size="14" fill="#1b2a3a">with its seed (nt 2–8)</text>
  <!-- outcomes -->
  <text x="780" y="240" font-size="13" fill="#1b2a3a" text-anchor="middle">less translation of the target,</text>
  <text x="780" y="258" font-size="13" fill="#1b2a3a" text-anchor="middle">and faster mRNA decay</text>
</svg>
