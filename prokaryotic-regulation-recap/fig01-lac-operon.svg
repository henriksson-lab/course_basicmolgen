<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif">
  <!-- fig01: the lac operon, recap from 5MO103. Top: no lactose, the LacI repressor sits on the
       operator and blocks transcription. Bottom: lactose present, allolactose binds the repressor,
       which lets go of the operator; RNA polymerase makes one polycistronic mRNA for lacZ, lacY, lacA. -->
  <defs>
    <marker id="arr" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrO" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#d08c2f"/>
    </marker>
  </defs>

  <!-- ===== panel A: no lactose ===== -->
  <text x="20" y="26" font-size="18" font-weight="bold" fill="#1b2a3a">No lactose: repressed</text>
  <line x1="20" y1="110" x2="880" y2="110" stroke="#1b2a3a" stroke-width="3"/>
  <rect x="30" y="92" width="130" height="36" rx="4" fill="#9db4c8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="95" y="116" font-size="17" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">lacI</text>
  <rect x="190" y="98" width="40" height="24" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="210" y="115" font-size="15" fill="#1b2a3a" text-anchor="middle">P</text>
  <rect x="230" y="96" width="40" height="28" fill="#fbf0c9" stroke="#b8901a" stroke-width="2.5"/>
  <text x="250" y="116" font-size="16" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">O</text>
  <rect x="270" y="92" width="290" height="36" rx="4" fill="#5f9e4a" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="415" y="116" font-size="17" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">lacZ</text>
  <rect x="560" y="92" width="150" height="36" rx="4" fill="#3f8fbf" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="635" y="116" font-size="17" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">lacY</text>
  <rect x="710" y="92" width="110" height="36" rx="4" fill="#8aa6bd" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="765" y="116" font-size="17" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">lacA</text>
  <!-- repressor on O -->
  <path d="M222,94 q6,-40 28,-40 q22,0 28,40 z" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="250" y="80" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">LacI</text>
  <text x="290" y="62" font-size="15" fill="#1b2a3a">repressor bound to the operator</text>
  <!-- lacI is expressed all the time -->
  <path d="M95,128 L95,160" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="108" y="156" font-size="15" fill="#5c6b7a">made all the time (own promoter)</text>
  <!-- RNA pol blocked -->
  <ellipse cx="176" cy="74" rx="26" ry="16" fill="#e3e6ea" stroke="#5c6b7a" stroke-width="1.5"/>
  <text x="176" y="79" font-size="13" fill="#1b2a3a" text-anchor="middle">RNAP</text>
  <text x="560" y="160" font-size="16" fill="#c62828" text-anchor="middle">no mRNA, no enzymes</text>

  <line x1="20" y1="190" x2="880" y2="190" stroke="#d5dae0" stroke-width="1.5"/>

  <!-- ===== panel B: lactose ===== -->
  <text x="20" y="214" font-size="18" font-weight="bold" fill="#1b2a3a">Lactose present: induced</text>
  <line x1="20" y1="290" x2="880" y2="290" stroke="#1b2a3a" stroke-width="3"/>
  <rect x="30" y="272" width="130" height="36" rx="4" fill="#9db4c8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="95" y="296" font-size="17" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">lacI</text>
  <rect x="190" y="278" width="40" height="24" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="210" y="295" font-size="15" fill="#1b2a3a" text-anchor="middle">P</text>
  <rect x="230" y="276" width="40" height="28" fill="#fbf0c9" stroke="#b8901a" stroke-width="2.5"/>
  <text x="250" y="296" font-size="16" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">O</text>
  <rect x="270" y="272" width="290" height="36" rx="4" fill="#5f9e4a" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="415" y="296" font-size="17" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">lacZ</text>
  <rect x="560" y="272" width="150" height="36" rx="4" fill="#3f8fbf" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="635" y="296" font-size="17" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">lacY</text>
  <rect x="710" y="272" width="110" height="36" rx="4" fill="#8aa6bd" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="765" y="296" font-size="17" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">lacA</text>
  <!-- repressor released, with allolactose -->
  <path d="M120,264 q6,-32 24,-32 q18,0 24,32 z" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="160" y="230" width="12" height="12" fill="#e07b39" stroke="#1b2a3a" transform="rotate(45 166 236)"/>
  <text x="186" y="238" font-size="15" fill="#1b2a3a">allolactose (inducer) bound: repressor lets go of O</text>
  <!-- mRNA -->
  <path d="M232,262 l0,-14 l34,0" fill="none" stroke="#d08c2f" stroke-width="3" marker-end="url(#arrO)"/>
  <path d="M272,256 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0" fill="none" stroke="#d08c2f" stroke-width="2.5"/>
  <text x="826" y="260" font-size="15" fill="#d08c2f">one mRNA</text>
  <!-- products -->
  <rect x="330" y="334" width="170" height="34" rx="17" fill="#5f9e4a"/>
  <text x="415" y="356" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">β-galactosidase</text>
  <rect x="555" y="334" width="160" height="34" rx="17" fill="#3f8fbf"/>
  <text x="635" y="356" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">permease</text>
  <rect x="725" y="334" width="150" height="34" rx="17" fill="#8aa6bd"/>
  <text x="800" y="356" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">transacetylase</text>
  <text x="315" y="356" font-size="15" fill="#5c6b7a" text-anchor="end">proteins made from it:</text>
  <text x="330" y="392" font-size="14" fill="#5c6b7a">(lacA's role in lactose use is minor; we ignore it from here on)</text>
</svg>
