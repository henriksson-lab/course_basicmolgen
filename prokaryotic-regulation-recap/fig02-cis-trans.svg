<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif">
  <!-- fig02: two merodiploids that tell a protein from a DNA site.
       A: lacI- on the chromosome, lacI+ on the F'. Repressor from the F' diffuses to both operators,
          so the cell is inducible: lacI+ is dominant and acts in trans -> lacI makes a diffusible product.
       B: lacOc lacZ- on the chromosome, lacO+ lacZ+ on the F' (no lactose). The chromosome copy is
          transcribed but makes inactive beta-gal; the F' copy is repressed. Beta-gal is inducible:
          Oc only affects genes on its own DNA molecule (cis) -> lacO is a site, not a product. -->
  <defs>
    <marker id="arrB" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ===== A ===== -->
  <text x="20" y="26" font-size="18" font-weight="bold" fill="#1b2a3a">A. F' <tspan font-style="italic">I</tspan><tspan dy="-7" font-size="12">+</tspan><tspan dy="7"> / </tspan><tspan font-style="italic">I</tspan><tspan dy="-7" font-size="12">−</tspan><tspan dy="7">, no lactose: repressor works in </tspan><tspan fill="#2a6f97">trans</tspan></text>
  <!-- F' copy -->
  <text x="20" y="72" font-size="15" fill="#5c6b7a">F'</text>
  <line x1="50" y1="68" x2="560" y2="68" stroke="#1b2a3a" stroke-width="3"/>
  <rect x="60" y="52" width="100" height="32" rx="4" fill="#9db4c8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="87" y="74" font-size="16" font-weight="bold" font-style="italic" fill="#1b2a3a">lacI<tspan dy="-7" font-size="12">+</tspan></text>
  <rect x="200" y="55" width="36" height="26" fill="#fbf0c9" stroke="#b8901a" stroke-width="2"/>
  <text x="218" y="73" font-size="15" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">O</text>
  <rect x="236" y="52" width="200" height="32" rx="4" fill="#5f9e4a" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="336" y="74" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">lacZ</text>
  <rect x="436" y="52" width="110" height="32" rx="4" fill="#3f8fbf" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="491" y="74" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">lacY</text>
  <path d="M200,54 q5,-28 18,-28 q13,0 18,28 z" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.2"/>
  <!-- chromosome copy -->
  <text x="20" y="194" font-size="15" fill="#5c6b7a">chr</text>
  <line x1="50" y1="190" x2="560" y2="190" stroke="#1b2a3a" stroke-width="3"/>
  <rect x="60" y="174" width="100" height="32" rx="4" fill="#c9ced4" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="66" y1="178" x2="154" y2="202" stroke="#c62828" stroke-width="2.5"/>
  <text x="87" y="196" font-size="16" font-weight="bold" font-style="italic" fill="#1b2a3a">lacI<tspan dy="-7" font-size="12">−</tspan></text>
  <rect x="200" y="177" width="36" height="26" fill="#fbf0c9" stroke="#b8901a" stroke-width="2"/>
  <text x="218" y="195" font-size="15" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">O</text>
  <rect x="236" y="174" width="200" height="32" rx="4" fill="#5f9e4a" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="336" y="196" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">lacZ</text>
  <rect x="436" y="174" width="110" height="32" rx="4" fill="#3f8fbf" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="491" y="196" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">lacY</text>
  <path d="M200,176 q5,-28 18,-28 q13,0 18,28 z" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.2"/>
  <!-- repressor pool and diffusion -->
  <circle cx="110" cy="122" r="11" fill="#2a6f97" stroke="#1b2a3a"/>
  <circle cx="138" cy="128" r="11" fill="#2a6f97" stroke="#1b2a3a"/>
  <path d="M110,86 L110,108" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrB)"/>
  <path d="M150,122 Q190,112 207,95" fill="none" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrB)"/>
  <path d="M150,134 Q195,138 208,148" fill="none" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="240" y="130" font-size="15" fill="#2a6f97">repressor protein diffuses to both operators</text>
  <!-- verdict -->
  <rect x="590" y="64" width="290" height="126" rx="8" fill="#eef4f8" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="604" y="90" font-size="15" fill="#1b2a3a">Both copies repressed;</text>
  <text x="604" y="110" font-size="15" fill="#1b2a3a">β-gal and permease inducible.</text>
  <text x="604" y="138" font-size="15" font-weight="bold" fill="#1b2a3a"><tspan font-style="italic">I</tspan><tspan dy="-6" font-size="11">+</tspan><tspan dy="6"> is dominant, in trans</tspan></text>
  <text x="604" y="160" font-size="15" fill="#1b2a3a">→ <tspan font-style="italic">lacI</tspan> makes a diffusible</text>
  <text x="604" y="180" font-size="15" fill="#1b2a3a">   product (a protein)</text>

  <line x1="20" y1="232" x2="880" y2="232" stroke="#d5dae0" stroke-width="1.5"/>

  <!-- ===== B ===== -->
  <text x="20" y="262" font-size="18" font-weight="bold" fill="#1b2a3a">B. F' <tspan font-style="italic">O</tspan><tspan dy="-7" font-size="12">+</tspan><tspan dy="7"> </tspan><tspan font-style="italic">Z</tspan><tspan dy="-7" font-size="12">+</tspan><tspan dy="7"> / </tspan><tspan font-style="italic">O</tspan><tspan dy="-7" font-size="12">c</tspan><tspan dy="7"> </tspan><tspan font-style="italic">Z</tspan><tspan dy="-7" font-size="12">−</tspan><tspan dy="7">, no lactose: operator works only in </tspan><tspan fill="#c0392b">cis</tspan></text>
  <!-- F' copy: O+ Z+, repressed -->
  <text x="20" y="314" font-size="15" fill="#5c6b7a">F'</text>
  <line x1="50" y1="310" x2="560" y2="310" stroke="#1b2a3a" stroke-width="3"/>
  <rect x="60" y="294" width="100" height="32" rx="4" fill="#9db4c8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="87" y="316" font-size="16" font-weight="bold" font-style="italic" fill="#1b2a3a">lacI<tspan dy="-7" font-size="12">+</tspan></text>
  <rect x="200" y="297" width="36" height="26" fill="#fbf0c9" stroke="#b8901a" stroke-width="2"/>
  <text x="209" y="315" font-size="15" font-weight="bold" font-style="italic" fill="#1b2a3a">O<tspan dy="-6" font-size="11">+</tspan></text>
  <rect x="236" y="294" width="200" height="32" rx="4" fill="#5f9e4a" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="313" y="316" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff">lacZ<tspan dy="-7" font-size="12">+</tspan></text>
  <rect x="436" y="294" width="110" height="32" rx="4" fill="#3f8fbf" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="491" y="316" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">lacY</text>
  <path d="M200,296 q5,-28 18,-28 q13,0 18,28 z" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="250" y="284" font-size="14" fill="#5c6b7a">repressed: no mRNA</text>
  <!-- chromosome copy: Oc Z-, transcribed -->
  <text x="20" y="414" font-size="15" fill="#5c6b7a">chr</text>
  <line x1="50" y1="410" x2="560" y2="410" stroke="#1b2a3a" stroke-width="3"/>
  <rect x="60" y="394" width="100" height="32" rx="4" fill="#9db4c8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="87" y="416" font-size="16" font-weight="bold" font-style="italic" fill="#1b2a3a">lacI<tspan dy="-7" font-size="12">+</tspan></text>
  <rect x="200" y="397" width="36" height="26" fill="#fde8e8" stroke="#c0392b" stroke-width="2.5"/>
  <text x="209" y="415" font-size="15" font-weight="bold" font-style="italic" fill="#1b2a3a">O<tspan dy="-6" font-size="11">c</tspan></text>
  <rect x="236" y="394" width="200" height="32" rx="4" fill="#5f9e4a" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="313" y="416" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff">lacZ<tspan dy="-7" font-size="12">−</tspan></text>
  <rect x="436" y="394" width="110" height="32" rx="4" fill="#3f8fbf" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="491" y="416" font-size="16" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">lacY</text>
  <path d="M240,382 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0 q5,-8 10,0 q5,8 10,0" fill="none" stroke="#d08c2f" stroke-width="2.5"/>
  <text x="250" y="366" font-size="14" fill="#5c6b7a">mRNA made all the time, but its β-gal is inactive</text>
  <!-- verdict -->
  <rect x="590" y="300" width="290" height="148" rx="8" fill="#fbeeee" stroke="#c0392b" stroke-width="1.5"/>
  <text x="604" y="326" font-size="15" fill="#1b2a3a">Active β-gal only from the F',</text>
  <text x="604" y="346" font-size="15" fill="#1b2a3a">so β-gal is <tspan font-weight="bold">inducible</tspan>.</text>
  <text x="604" y="374" font-size="15" font-weight="bold" fill="#1b2a3a"><tspan font-style="italic">O</tspan><tspan dy="-6" font-size="11">c</tspan><tspan dy="6"> acts only in cis</tspan></text>
  <text x="604" y="396" font-size="15" fill="#1b2a3a">→ <tspan font-style="italic">lacO</tspan> is a site on the DNA,</text>
  <text x="604" y="416" font-size="15" fill="#1b2a3a">   not a diffusible product</text>
  <text x="604" y="438" font-size="13" fill="#5c6b7a">(permease: constitutive, from chr)</text>
</svg>
