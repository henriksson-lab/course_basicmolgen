<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <!-- Four panels: no crossover, crossover in region I, in region II, in both.
       Top: two non-sister chromatids (blue A B C, red a b c) with the crossover points.
       Bottom: the two chromatids that result. A double crossover swaps only the middle gene. -->
