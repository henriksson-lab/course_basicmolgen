  <!-- annotations -->
  <g fill="#1b2a3a">
    <text x="234" y="30" font-size="17" font-weight="bold" text-anchor="middle">Y-linked</text>
    <text x="234" y="338" font-size="15" text-anchor="middle">affected father → every son;</text>
    <text x="234" y="358" font-size="15" text-anchor="middle">never daughters</text>
    <text x="606" y="30" font-size="17" font-weight="bold" text-anchor="middle">Mitochondrial (Part 5)</text>
    <text x="606" y="338" font-size="15" text-anchor="middle">affected mother → all children;</text>
    <text x="606" y="358" font-size="15" text-anchor="middle">fathers never transmit</text>
