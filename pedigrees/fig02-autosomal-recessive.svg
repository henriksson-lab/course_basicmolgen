<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Helvetica, Arial, sans-serif">
  <!-- fig02: autosomal recessive pedigree with a first-cousin marriage -->
  <!-- layout: x = 90 + slot*70; y = 40 + (generation-1)*105; symbols 34px -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#bc4749"/></marker>
  </defs>
  <!-- generation numerals -->
  <g fill="#1b2a3a" font-size="18" font-weight="bold">
    <text x="16" y="46">I</text>
    <text x="16" y="151">II</text>
    <text x="16" y="256">III</text>
    <text x="16" y="361">IV</text>
  </g>
  <!-- mating lines (double = consanguineous) and descent lines -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <!-- i1 x i2 -->
    <line x1="282.0" y1="40" x2="318.0" y2="40"/>
    <line x1="300.0" y1="40" x2="300.0" y2="104.0"/>
    <line x1="160" y1="104.0" x2="510" y2="104.0"/>
    <line x1="160" y1="104.0" x2="160" y2="128.0"/>
    <line x1="370" y1="104.0" x2="370" y2="128.0"/>
    <line x1="510" y1="104.0" x2="510" y2="128.0"/>
    <!-- s1 x a -->
    <line x1="107.0" y1="145" x2="143.0" y2="145"/>
    <line x1="125.0" y1="145" x2="125.0" y2="209.0"/>
    <line x1="90" y1="209.0" x2="195.0" y2="209.0"/>
    <line x1="90" y1="209.0" x2="90" y2="233.0"/>
    <line x1="195.0" y1="209.0" x2="195.0" y2="233.0"/>
    <!-- c x s2 -->
    <line x1="387.0" y1="145" x2="423.0" y2="145"/>
    <line x1="405.0" y1="145" x2="405.0" y2="209.0"/>
    <line x1="265.0" y1="209.0" x2="475.0" y2="209.0"/>
    <line x1="265.0" y1="209.0" x2="265.0" y2="233.0"/>
    <line x1="405.0" y1="209.0" x2="405.0" y2="233.0"/>
    <line x1="475.0" y1="209.0" x2="475.0" y2="233.0"/>
    <!-- k2 x k3 -->
    <line x1="212.0" y1="246.5" x2="248.0" y2="246.5"/><line x1="212.0" y1="253.5" x2="248.0" y2="253.5"/>
    <line x1="230.0" y1="253.5" x2="230.0" y2="314.0"/>
    <line x1="160" y1="314.0" x2="300" y2="314.0"/>
    <line x1="160" y1="314.0" x2="160" y2="338.0"/>
    <line x1="230" y1="314.0" x2="230" y2="338.0"/>
    <line x1="300" y1="314.0" x2="300" y2="338.0"/>
  </g>
  <!-- individuals: square = male, circle = female, filled = affected, half = carrier -->
  <g><!-- i1: M n -->
    <rect x="248.0" y="23.0" width="34" height="34" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <line x1="242.0" y1="63.0" x2="288.0" y2="17.0" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="265.0" y="74.0" font-size="13" fill="#555" text-anchor="middle">1</text>
  </g>
  <g><!-- i2: F n -->
    <circle cx="335.0" cy="40" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <line x1="312.0" y1="63.0" x2="358.0" y2="17.0" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="335.0" y="74.0" font-size="13" fill="#555" text-anchor="middle">2</text>
  </g>
  <g><!-- s1: F n -->
    <circle cx="90" cy="145" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="90" y="179.0" font-size="13" fill="#555" text-anchor="middle">1</text>
  </g>
  <g><!-- a: M n -->
    <rect x="143.0" y="128.0" width="34" height="34" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="160" y="179.0" font-size="13" fill="#555" text-anchor="middle">2</text>
  </g>
  <g><!-- c: F n -->
    <circle cx="370" cy="145" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="370" y="179.0" font-size="13" fill="#555" text-anchor="middle">3</text>
  </g>
  <g><!-- s2: M n -->
    <rect x="423.0" y="128.0" width="34" height="34" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="440" y="179.0" font-size="13" fill="#555" text-anchor="middle">4</text>
  </g>
  <g><!-- e: F n -->
    <circle cx="510" cy="145" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="510" y="179.0" font-size="13" fill="#555" text-anchor="middle">5</text>
  </g>
  <g><!-- k1: F n -->
    <circle cx="90" cy="250" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="90" y="284.0" font-size="13" fill="#555" text-anchor="middle">1</text>
  </g>
  <g><!-- k2: M n -->
    <rect x="178.0" y="233.0" width="34" height="34" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="195.0" y="284.0" font-size="13" fill="#555" text-anchor="middle">2</text>
  </g>
  <g><!-- k3: F n -->
    <circle cx="265.0" cy="250" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="265.0" y="284.0" font-size="13" fill="#555" text-anchor="middle">3</text>
  </g>
  <g><!-- k4: M n -->
    <rect x="388.0" y="233.0" width="34" height="34" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="405.0" y="284.0" font-size="13" fill="#555" text-anchor="middle">4</text>
  </g>
  <g><!-- k5: F n -->
    <circle cx="475.0" cy="250" r="17.0" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="475.0" y="284.0" font-size="13" fill="#555" text-anchor="middle">5</text>
  </g>
  <g><!-- v1: F a -->
    <circle cx="160" cy="355" r="17.0" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="160" y="389.0" font-size="13" fill="#555" text-anchor="middle">1</text>
  </g>
  <g><!-- v2: M n -->
    <rect x="213.0" y="338.0" width="34" height="34" fill="#fff" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="230" y="389.0" font-size="13" fill="#555" text-anchor="middle">2</text>
  </g>
  <g><!-- v3: M a -->
    <rect x="283.0" y="338.0" width="34" height="34" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="2.2"/>
    <line x1="257.0" y1="394.0" x2="278.0" y2="377.0" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arr)"/>
    <text x="300" y="389.0" font-size="13" fill="#555" text-anchor="middle">3</text>
  </g>
  <!-- annotations -->
  <g font-size="15" fill="#1b2a3a">
    <text x="540" y="70" font-size="17" font-weight="bold" fill="#1b2a3a">Autosomal recessive</text>
    <text x="540" y="98">• affected children of unaffected</text>
    <text x="554" y="118">parents (IV-1, IV-3): it skips</text>
    <text x="554" y="138">generations</text>
    <text x="540" y="164">• parents of an affected child are</text>
    <text x="554" y="184">obligate carriers (III-2, III-3)</text>
    <text x="540" y="210">• often consanguinity: III-2 and</text>
    <text x="554" y="230">III-3 are first cousins</text>
    <text x="540" y="256">• both sexes affected about equally</text>
  </g>
</svg>
