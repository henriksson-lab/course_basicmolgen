<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" font-family="Helvetica, Arial, sans-serif" width="900" height="432">
  <!-- Four kinds of genomic variant, each with a reference and a variant allele.
       SNP: HBB codon 6-8 region, HbS (c.20A>T), coding strand. Indel: CFTR F508del (c.1521_1523delCTT), coding strand.
       STR: HTT CAG repeat (schematic counts). CNV: schematic. -->
  <g font-size="15" font-weight="bold" fill="#1b2a3a">
    <text x="20" y="28">SNP (single-nucleotide variant)</text>
    <text x="20" y="128">Indel (insertion or deletion)</text>
    <text x="20" y="228">Microsatellite (short tandem repeat, STR)</text>
    <text x="20" y="328">Copy-number variant (CNV)</text>
  </g>
  <g font-size="12" fill="#5a6b7a">
    <text x="20" y="62">reference</text><text x="20" y="86">variant</text>
    <text x="20" y="162">reference</text><text x="20" y="186">variant</text>
    <text x="20" y="262">allele 1</text><text x="20" y="286">allele 2</text>
    <text x="20" y="362">1 copy</text><text x="20" y="390">3 copies</text>
  </g>
  <!-- SNP -->
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#1b2a3a">
    <text x="100" y="62" xml:space="preserve">C T G A C T C C T G <tspan fill="#2a6f97">A</tspan> G G A G A A G</text>
    <text x="100" y="86" xml:space="preserve">C T G A C T C C T G <tspan fill="#bc4749">T</tspan> G G A G A A G</text>
  </g>
  <text x="520" y="62" font-size="13" fill="#1b2a3a"><tspan font-style="italic">HBB</tspan> c.20A&gt;T (rs334): Glu7Val, HbS</text>
  <text x="520" y="84" font-size="13" fill="#5a6b7a">one base differs; the most common kind of variant</text>
  <!-- indel -->
  <g font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#1b2a3a">
    <text x="100" y="162" xml:space="preserve">A A T A T C A T <tspan fill="#2a6f97">C T T</tspan> T G G T G T T</text>
    <text x="100" y="186" xml:space="preserve">A A T A T C A T <tspan fill="#bc4749">- - -</tspan> T G G T G T T</text>
  </g>
  <text x="520" y="162" font-size="13" fill="#1b2a3a"><tspan font-style="italic">CFTR</tspan> c.1521_1523del (F508del)</text>
  <text x="520" y="184" font-size="13" fill="#5a6b7a">3 bases lost: one codon, in frame; most common CF allele</text>
  <!-- STR -->
  <g font-family="Courier New, monospace" font-size="16" font-weight="bold">
    <rect x="100" y="246" width="44" height="22" rx="3" fill="#cfe0ec"/><rect x="146" y="246" width="44" height="22" rx="3" fill="#cfe0ec"/>
    <rect x="192" y="246" width="44" height="22" rx="3" fill="#cfe0ec"/><rect x="238" y="246" width="44" height="22" rx="3" fill="#cfe0ec"/>
    <rect x="100" y="272" width="44" height="22" rx="3" fill="#cfe0ec"/><rect x="146" y="272" width="44" height="22" rx="3" fill="#cfe0ec"/>
    <rect x="192" y="272" width="44" height="22" rx="3" fill="#cfe0ec"/><rect x="238" y="272" width="44" height="22" rx="3" fill="#cfe0ec"/>
    <rect x="284" y="272" width="44" height="22" rx="3" fill="#f1d3d3"/><rect x="330" y="272" width="44" height="22" rx="3" fill="#f1d3d3"/>
    <rect x="376" y="272" width="44" height="22" rx="3" fill="#f1d3d3"/>
    <g fill="#1b2a3a" text-anchor="middle">
      <text x="122" y="263">CAG</text><text x="168" y="263">CAG</text><text x="214" y="263">CAG</text><text x="260" y="263">CAG</text>
      <text x="122" y="289">CAG</text><text x="168" y="289">CAG</text><text x="214" y="289">CAG</text><text x="260" y="289">CAG</text>
      <text x="306" y="289">CAG</text><text x="352" y="289">CAG</text><text x="398" y="289">CAG</text>
    </g>
  </g>
  <text x="520" y="262" font-size="13" fill="#1b2a3a">number of repeat units differs (here 4 vs 7)</text>
  <text x="520" y="284" font-size="13" fill="#5a6b7a">many alleles per locus, high mutation rate; e.g. <tspan font-style="italic">HTT</tspan> CAG repeat</text>
  <!-- CNV -->
  <line x1="100" y1="358" x2="500" y2="358" stroke="#1b2a3a" stroke-width="3"/>
  <rect x="250" y="349" width="70" height="18" rx="3" fill="#6a994e"/>
  <line x1="100" y1="386" x2="500" y2="386" stroke="#1b2a3a" stroke-width="3"/>
  <rect x="180" y="377" width="70" height="18" rx="3" fill="#6a994e"/>
  <rect x="252" y="377" width="70" height="18" rx="3" fill="#6a994e"/>
  <rect x="324" y="377" width="70" height="18" rx="3" fill="#6a994e"/>
  <text x="520" y="362" font-size="13" fill="#1b2a3a">a segment of 1 kb to several Mb, with genes,</text>
  <text x="520" y="384" font-size="13" fill="#5a6b7a">present in different numbers of copies (gene dosage)</text>
  <text x="20" y="424" font-size="13" fill="#5a6b7a">Larger structural variants (inversions, translocations) are the topic of Part 5.</text>
</svg>
