<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif" width="900" height="380">
  <!-- Haplotypes and linkage disequilibrium: a new mutation arises on one chromosome (one haplotype);
       generations of recombination shorten the stretch of that ancestral haplotype around it. Schematic. -->
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#1b2a3a">1. A new mutation arises on one chromosome</text>
  <line x1="60" y1="62" x2="380" y2="62" stroke="#d08c2f" stroke-width="10" stroke-linecap="round"/>
  <circle cx="220" cy="62" r="9" fill="#bc4749" stroke="#fff" stroke-width="2"/>
  <line x1="60" y1="92" x2="380" y2="92" stroke="#9db7cc" stroke-width="10" stroke-linecap="round"/>
  <line x1="60" y1="122" x2="380" y2="122" stroke="#b8c2cc" stroke-width="10" stroke-linecap="round"/>
  <text x="400" y="67" font-size="13" fill="#1b2a3a">its haplotype: the alleles it happens to sit with</text>
  <text x="400" y="97" font-size="13" fill="#5a6b7a">other chromosomes in the population</text>
  <text x="400" y="127" font-size="13" fill="#5a6b7a">(other haplotypes)</text>

  <text x="20" y="170" font-size="16" font-weight="bold" fill="#1b2a3a">2. Many generations later: recombination has cut the haplotype down</text>
  <!-- carriers: orange block around the mutation, shrinking with distance; flanks from other haplotypes -->
  <g stroke-width="10" stroke-linecap="butt">
    <line x1="60" y1="200" x2="130" y2="200" stroke="#9db7cc"/><line x1="130" y1="200" x2="330" y2="200" stroke="#d08c2f"/><line x1="330" y1="200" x2="380" y2="200" stroke="#b8c2cc"/>
    <line x1="60" y1="226" x2="170" y2="226" stroke="#b8c2cc"/><line x1="170" y1="226" x2="290" y2="226" stroke="#d08c2f"/><line x1="290" y1="226" x2="380" y2="226" stroke="#9db7cc"/>
    <line x1="60" y1="252" x2="150" y2="252" stroke="#9db7cc"/><line x1="150" y1="252" x2="260" y2="252" stroke="#d08c2f"/><line x1="260" y1="252" x2="380" y2="252" stroke="#9db7cc"/>
    <line x1="60" y1="278" x2="185" y2="278" stroke="#b8c2cc"/><line x1="185" y1="278" x2="350" y2="278" stroke="#d08c2f"/><line x1="350" y1="278" x2="380" y2="278" stroke="#b8c2cc"/>
    <line x1="60" y1="310" x2="380" y2="310" stroke="#9db7cc"/>
    <line x1="60" y1="336" x2="200" y2="336" stroke="#b8c2cc"/><line x1="200" y1="336" x2="380" y2="336" stroke="#9db7cc"/>
  </g>
  <g fill="#bc4749" stroke="#fff" stroke-width="2">
    <circle cx="220" cy="200" r="8"/><circle cx="220" cy="226" r="8"/><circle cx="220" cy="252" r="8"/><circle cx="220" cy="278" r="8"/>
  </g>
  <rect x="183" y="190" width="79" height="98" fill="none" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="215" y="304" font-size="12" fill="#1b2a3a" text-anchor="middle">shared by all carriers</text>
  <text x="400" y="205" font-size="13" fill="#1b2a3a">carriers (red)</text>
  <text x="400" y="315" font-size="13" fill="#5a6b7a">non-carriers</text>
  <g font-size="13" fill="#1b2a3a">
    <text x="580" y="210">Near the mutation, every carrier still has</text>
    <text x="580" y="228">the same neighbouring alleles: those SNPs are</text>
    <text x="580" y="246">in <tspan font-weight="bold">linkage disequilibrium</tspan> (LD) with it.</text>
    <text x="580" y="276">Far away, recombination has mixed them:</text>
    <text x="580" y="294">no association (linkage equilibrium).</text>
    <text x="580" y="324">A young or strongly selected allele sits on</text>
    <text x="580" y="342">a <tspan font-weight="bold">long</tspan> shared haplotype.</text>
  </g>
  <text x="20" y="372" font-size="13" fill="#5a6b7a">Each row is one chromosome (one haplotype). Colours show which ancestral chromosome each stretch came from.</text>
</svg>
