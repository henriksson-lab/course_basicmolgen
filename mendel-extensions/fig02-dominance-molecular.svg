<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif">
  <!-- fig02: three molecular reasons why a mutant allele can be dominant -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ============ panel (a): haploinsufficiency ============ -->
  <rect x="10" y="8" width="300" height="314" rx="12" fill="#f4f6f8" stroke="#d5dce3"/>
  <text x="160" y="38" font-size="20" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Haploinsufficiency</text>
  <text x="160" y="62" font-size="15" font-style="italic" fill="#5c6b7a" text-anchor="middle">half the protein is not enough</text>
  <!-- axis: amount 0..100% maps to y 240..100 -->
  <line x1="60" y1="240" x2="290" y2="240" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="60" y1="240" x2="60" y2="94" stroke="#1b2a3a" stroke-width="2"/>
  <text x="54" y="105" font-size="13" fill="#5c6b7a" text-anchor="end">100%</text>
  <text x="54" y="175" font-size="13" fill="#5c6b7a" text-anchor="end">50%</text>
  <text x="54" y="244" font-size="13" fill="#5c6b7a" text-anchor="end">0</text>
  <!-- bars: +/+ 100%, +/- 50%, -/- 0% -->
  <rect x="80" y="100" width="50" height="140" fill="#2a6f97"/>
  <rect x="155" y="170" width="50" height="70" fill="#bc4749"/>
  <rect x="230" y="237" width="50" height="3" fill="#bc4749"/>
  <!-- threshold at 70% = y 142 -->
  <line x1="60" y1="142" x2="290" y2="142" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="212" y="134" font-size="13" fill="#1b2a3a" text-anchor="middle">needed for normal</text>
  <text x="105" y="262" font-size="16" font-style="italic" fill="#1b2a3a" text-anchor="middle">+/+</text>
  <text x="180" y="262" font-size="16" font-style="italic" fill="#1b2a3a" text-anchor="middle">+/−</text>
  <text x="255" y="262" font-size="16" font-style="italic" fill="#1b2a3a" text-anchor="middle">−/−</text>
  <text x="160" y="290" font-size="15" fill="#1b2a3a" text-anchor="middle">+/− looks mutant, so the</text>
  <text x="160" y="310" font-size="15" fill="#1b2a3a" text-anchor="middle">loss-of-function allele is dominant</text>

  <!-- ============ panel (b): dominant negative ============ -->
  <rect x="330" y="8" width="300" height="314" rx="12" fill="#f4f6f8" stroke="#d5dce3"/>
  <text x="480" y="38" font-size="20" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Dominant negative</text>
  <text x="480" y="62" font-size="15" font-style="italic" fill="#5c6b7a" text-anchor="middle">the mutant subunit spoils the normal one</text>
  <text x="480" y="90" font-size="15" fill="#1b2a3a" text-anchor="middle">+/− cell: subunits pair at random</text>
  <!-- four dimers: blue = normal subunit, red = mutant subunit -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <circle cx="380" cy="135" r="17" fill="#2a6f97"/><circle cx="410" cy="135" r="17" fill="#2a6f97"/>
    <circle cx="455" cy="135" r="17" fill="#2a6f97"/><circle cx="485" cy="135" r="17" fill="#bc4749"/>
    <circle cx="380" cy="200" r="17" fill="#bc4749"/><circle cx="410" cy="200" r="17" fill="#2a6f97"/>
    <circle cx="455" cy="200" r="17" fill="#bc4749"/><circle cx="485" cy="200" r="17" fill="#bc4749"/>
  </g>
  <text x="395" y="174" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">works</text>
  <text x="470" y="174" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">dead</text>
  <text x="395" y="239" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">dead</text>
  <text x="470" y="239" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">dead</text>
  <!-- key -->
  <circle cx="530" cy="130" r="8" fill="#2a6f97" stroke="#1b2a3a"/><text x="544" y="135" font-size="14" fill="#1b2a3a">normal</text>
  <circle cx="530" cy="158" r="8" fill="#bc4749" stroke="#1b2a3a"/><text x="544" y="163" font-size="14" fill="#1b2a3a">mutant</text>
  <text x="480" y="270" font-size="15" fill="#1b2a3a" text-anchor="middle">only 1 dimer in 4 works,</text>
  <text x="480" y="290" font-size="15" fill="#1b2a3a" text-anchor="middle">less than the 1/2 left by a</text>
  <text x="480" y="310" font-size="15" fill="#1b2a3a" text-anchor="middle">plain loss of function</text>

  <!-- ============ panel (c): gain of function ============ -->
  <rect x="650" y="8" width="300" height="314" rx="12" fill="#f4f6f8" stroke="#d5dce3"/>
  <text x="800" y="38" font-size="20" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Gain of function</text>
  <text x="800" y="62" font-size="15" font-style="italic" fill="#5c6b7a" text-anchor="middle">the mutant protein does too much</text>
  <!-- membrane band -->
  <rect x="665" y="150" width="270" height="22" fill="#e9d8a6"/>
  <!-- normal receptor: on only with signal -->
  <rect x="712" y="110" width="26" height="100" rx="8" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="725" cy="100" r="10" fill="#e8b923" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="725" y="84" font-size="13" fill="#5c6b7a" text-anchor="middle">signal</text>
  <line x1="725" y1="212" x2="725" y2="236" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="725" y="256" font-size="14" fill="#1b2a3a" text-anchor="middle">on</text>
  <text x="725" y="276" font-size="14" fill="#5c6b7a" text-anchor="middle">normal</text>
  <!-- mutant receptor: on without signal -->
  <rect x="862" y="110" width="26" height="100" rx="8" fill="#bc4749" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="875" y="96" font-size="13" fill="#5c6b7a" text-anchor="middle">no signal</text>
  <line x1="875" y1="212" x2="875" y2="236" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="875" y="256" font-size="14" font-weight="bold" fill="#bc4749" text-anchor="middle">on anyway</text>
  <text x="875" y="276" font-size="14" fill="#5c6b7a" text-anchor="middle">mutant</text>
  <text x="800" y="310" font-size="15" fill="#1b2a3a" text-anchor="middle">e.g. FGFR3 in achondroplasia</text>
</svg>
