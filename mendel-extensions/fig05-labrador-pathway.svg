<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif">
  <!-- fig05: recessive epistasis in Labrador coat colour, drawn as a simplified two-step pathway.
       E_ lets dark pigment into the hair; B_ makes that dark pigment black instead of brown.
       ee dogs are yellow whatever their B genotype, so ee is epistatic to B/b: 9 : 3 : 4. -->
  <defs>
    <marker id="arr" markerWidth="16" markerHeight="16" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,6 L0,12 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- pathway row -->
  <rect x="20" y="40" width="180" height="56" rx="10" fill="#e8b923" stroke="#1b2a3a" stroke-width="2"/>
  <text x="110" y="66" font-size="17" fill="#1b2a3a" text-anchor="middle">no dark pigment</text>
  <text x="110" y="87" font-size="15" fill="#1b2a3a" text-anchor="middle">(yellow coat)</text>
  <rect x="360" y="40" width="180" height="56" rx="10" fill="#7b4a26" stroke="#1b2a3a" stroke-width="2"/>
  <text x="450" y="74" font-size="17" fill="#ffffff" text-anchor="middle">brown pigment</text>
  <rect x="700" y="40" width="180" height="56" rx="10" fill="#262626" stroke="#1b2a3a" stroke-width="2"/>
  <text x="790" y="74" font-size="17" fill="#ffffff" text-anchor="middle">black pigment</text>
  <line x1="202" y1="68" x2="354" y2="68" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="542" y1="68" x2="694" y2="68" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arr)"/>
  <text x="246" y="56" font-size="17" font-weight="bold" fill="#1b2a3a">needs <tspan font-style="italic">E</tspan>_</text>
  <text x="586" y="56" font-size="17" font-weight="bold" fill="#1b2a3a">needs <tspan font-style="italic">B</tspan>_</text>
  <text x="20" y="24" font-size="15" fill="#5c6b7a">simplified pathway for the dark pigment in the hair</text>

  <!-- the four dihybrid classes of BbEe x BbEe -->
  <text x="20" y="140" font-size="17" fill="#1b2a3a">F<tspan dy="4" font-size="12">2</tspan><tspan dy="-4"> of </tspan><tspan font-style="italic">BbEe</tspan> × <tspan font-style="italic">BbEe</tspan>:</text>
  <!-- class boxes, width proportional to 16ths: 40 px per 16th, start x 20 -->
  <rect x="20" y="156" width="358" height="50" rx="6" fill="#262626"/>
  <rect x="382" y="156" width="118" height="50" rx="6" fill="#7b4a26"/>
  <rect x="504" y="156" width="118" height="50" rx="6" fill="#e8b923"/>
  <rect x="626" y="156" width="38" height="50" rx="6" fill="#e8b923"/>
  <text x="199" y="179" font-size="15" fill="#ffffff" text-anchor="middle" font-style="italic">B_E_</text>
  <text x="199" y="198" font-size="15" fill="#ffffff" text-anchor="middle">black 9/16</text>
  <text x="441" y="179" font-size="15" fill="#ffffff" text-anchor="middle" font-style="italic">bbE_</text>
  <text x="441" y="198" font-size="15" fill="#ffffff" text-anchor="middle">brown 3/16</text>
  <text x="563" y="179" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">B_ee</text>
  <text x="563" y="198" font-size="15" fill="#1b2a3a" text-anchor="middle">yellow 3/16</text>
  <text x="645" y="187" font-size="13" fill="#1b2a3a" text-anchor="middle">1/16</text>
  <text x="645" y="226" font-size="13" font-style="italic" fill="#5c6b7a" text-anchor="middle">bbee</text>
  <!-- brace for the yellow classes -->
  <path d="M506,232 L506,242 L662,242 L662,232" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <text x="584" y="266" font-size="16" fill="#1b2a3a" text-anchor="middle">both yellow: 4/16</text>
  <text x="700" y="187" font-size="26" font-weight="bold" fill="#1b2a3a">9 : 3 : 4</text>
  <text x="20" y="290" font-size="15" fill="#5c6b7a"><tspan font-style="italic">ee</tspan> hides whatever <tspan font-style="italic">B</tspan>/<tspan font-style="italic">b</tspan> does: <tspan font-style="italic">ee</tspan> is epistatic to <tspan font-style="italic">B</tspan>.</text>
</svg>
