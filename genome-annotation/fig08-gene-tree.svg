<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif" width="900" height="360">
  <!-- Gene tree of four globin genes: one gene duplication (alpha/beta) followed by one speciation (human/mouse) in each lineage.
       Shows which pairs are orthologs and which are paralogs. Topology only; branch lengths are not to scale. -->
  <g stroke="#1b2a3a" stroke-width="2.5" fill="none">
    <line x1="450" y1="40" x2="450" y2="90"/>
    <polyline points="250,170 250,90 650,90 650,170"/>
    <polyline points="170,250 170,170 330,170 330,250"/>
    <polyline points="570,250 570,170 730,170 730,250"/>
  </g>
  <text x="462" y="48" font-size="13" fill="#5a6b7a">ancestral globin gene</text>
  <!-- duplication node -->
  <rect x="441" y="81" width="18" height="18" fill="#bc4749"/>
  <text x="470" y="80" font-size="13" fill="#bc4749">gene duplication</text>
  <!-- speciation nodes -->
  <circle cx="250" cy="170" r="10" fill="#2a6f97"/>
  <circle cx="650" cy="170" r="10" fill="#2a6f97"/>
  <text x="264" y="192" font-size="13" fill="#2a6f97">speciation</text>
  <text x="664" y="192" font-size="13" fill="#2a6f97">speciation</text>
  <text x="240" y="135" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="end">α-globin lineage</text>
  <text x="660" y="135" font-size="14" font-weight="bold" fill="#1b2a3a">β-globin lineage</text>
  <!-- leaves -->
  <g font-size="14" fill="#1b2a3a" text-anchor="middle">
    <text x="170" y="270">human <tspan font-style="italic">HBA1</tspan></text>
    <text x="330" y="270">mouse <tspan font-style="italic">Hba-a1</tspan></text>
    <text x="570" y="270">human <tspan font-style="italic">HBB</tspan></text>
    <text x="730" y="270">mouse <tspan font-style="italic">Hbb-b1</tspan></text>
  </g>
  <!-- relationship brackets -->
  <g fill="none" stroke-width="1.8">
    <polyline points="170,282 170,292 330,292 330,282" stroke="#2a6f97"/>
    <polyline points="570,282 570,292 730,292 730,282" stroke="#2a6f97"/>
    <polyline points="170,300 170,322 570,322 570,300" stroke="#bc4749"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="250" y="310" fill="#2a6f97">orthologs</text>
    <text x="650" y="310" fill="#2a6f97">orthologs</text>
    <text x="370" y="340" fill="#bc4749">paralogs (split by the duplication)</text>
  </g>
  <text x="20" y="40" font-size="13" fill="#5a6b7a">Two genes are</text>
  <text x="20" y="57" font-size="13" fill="#5a6b7a">orthologs if they last</text>
  <text x="20" y="74" font-size="13" fill="#5a6b7a">split at a speciation,</text>
  <text x="20" y="91" font-size="13" fill="#5a6b7a">paralogs if at a</text>
  <text x="20" y="108" font-size="13" fill="#5a6b7a">duplication.</text>
  <text x="882" y="216" font-size="13" fill="#5a6b7a" text-anchor="end">Human α and mouse β</text>
  <text x="882" y="233" font-size="13" fill="#5a6b7a" text-anchor="end">are also paralogs.</text>
</svg>
