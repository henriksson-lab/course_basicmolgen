  <g font-size="14" fill="#1b2a3a">
    <text x="20" y="262">Query: human β-globin (P68871). Hit: mouse β-globin (P02088). Over all 147 residues: <tspan font-weight="bold">118 identical (80%)</tspan>, no gaps.</text>
    <text x="20" y="288"><tspan font-weight="bold">Read:</tspan> Per. Ident (identical positions in the alignment), Query Cover (how much of the query aligns),</text>
