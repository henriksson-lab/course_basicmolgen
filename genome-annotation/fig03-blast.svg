<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif" width="900" height="330">
  <!-- BLAST idea: seed word hit, extension, and the reported alignment. Sequences: human beta-globin (UniProt P68871) vs mouse beta-1 globin (P02088), residues 1-40; full length 118/147 identical, no gaps. -->
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#1b2a3a">How BLAST finds and scores a match</text>
  <g font-size="14" fill="#1b2a3a">
    <text x="20" y="58"><tspan font-weight="bold" fill="#2a6f97">1. Seed.</tspan> Find short words (3 amino acids, or 11+ bases) shared by the query and a database sequence.</text>
    <text x="20" y="80"><tspan font-weight="bold" fill="#2a6f97">2. Extend.</tspan> Grow the match in both directions while the score keeps rising: +points for matches, −points for mismatches and gaps.</text>
    <text x="20" y="102"><tspan font-weight="bold" fill="#2a6f97">3. Report.</tspan> Keep alignments whose score is too high to be chance (small E-value).</text>
  </g>
