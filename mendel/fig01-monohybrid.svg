<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica, Arial, sans-serif">
  <!-- Mendel's monohybrid cross for seed shape: P round x wrinkled, F1 all round, F2 5474 : 1850.
       Three rows (P, F1, F2), generation labels in a left column, seeds drawn from two shapes in defs. -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/>
    </marker>
    <!-- round seed, radius 20 -->
    <g id="round">
      <circle r="20" fill="#e9d27c" stroke="#8a6d1f" stroke-width="2"/>
      <circle cx="-6" cy="-7" r="5" fill="#f6eab8"/>
    </g>
    <!-- wrinkled seed: radius 20 with bumps -->
    <g id="wrinkled">
      <path d="M21.2,0.0 L22.6,2.0 L21.9,3.9 L20.5,5.5 L19.5,7.1 L18.8,8.8 L17.4,10.0 L15.0,10.5 L12.7,10.7 L11.9,11.9 L12.4,14.7 L12.7,18.2 L11.7,20.3 L9.5,20.4 L7.1,19.5 L5.1,19.0 L3.4,19.2 L1.7,19.2 L0.0,18.2 L-1.5,17.1 L-3.1,17.5 L-5.2,19.6 L-7.9,21.6 L-10.1,21.6 L-11.2,19.3 L-11.4,16.3 L-11.8,14.1 L-13.1,13.1 L-14.4,12.1 L-15.2,10.6 L-15.6,9.0 L-17.1,8.0 L-19.9,7.2 L-22.7,6.1 L-23.4,4.1 L-21.6,1.9 L-18.8,0.0 L-17.3,-1.5 L-17.5,-3.1 L-18.2,-4.9 L-18.1,-6.6 L-17.4,-8.1 L-17.2,-10.0 L-17.8,-12.4 L-17.9,-15.0 L-16.4,-16.4 L-13.3,-15.9 L-10.2,-14.6 L-8.3,-14.3 L-7.4,-15.8 L-6.6,-18.1 L-5.3,-19.7 L-3.6,-20.2 L-1.8,-20.7 L-0.0,-21.8 L2.0,-22.8 L3.9,-21.9 L5.1,-19.1 L5.8,-16.0 L6.8,-14.6 L8.8,-15.3 L11.6,-16.5 L13.9,-16.5 L15.2,-15.2 L16.2,-13.6 L17.6,-12.3 L19.0,-11.0 L19.2,-8.9 L17.7,-6.5 L16.0,-4.3 L16.0,-2.8 L18.3,-1.6 Z" fill="#e9d27c" stroke="#8a6d1f" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- generation column -->
  <g font-size="22" font-weight="bold" fill="#1b2a3a">
    <text x="20" y="66">P</text>
    <text x="20" y="196">F<tspan font-size="15" dy="5">1</tspan></text>
    <text x="20" y="336">F<tspan font-size="15" dy="5">2</tspan></text>
  </g>
  <g font-size="14" fill="#5b6b7a">
    <text x="20" y="88">true-breeding</text>
    <text x="20" y="104">parents</text>
    <text x="20" y="218">hybrids</text>
    <text x="20" y="358">F1 selfed</text>
  </g>

  <!-- P row: round x wrinkled -->
  <use xlink:href="#round" x="250" y="60"/>
  <text x="250" y="104" font-size="16" fill="#1b2a3a" text-anchor="middle">round</text>
  <text x="250" y="124" font-size="16" font-style="italic" fill="#2a6f97" text-anchor="middle">RR</text>
  <text x="340" y="68" font-size="26" fill="#1b2a3a" text-anchor="middle">×</text>
  <use xlink:href="#wrinkled" x="430" y="60"/>
  <text x="430" y="104" font-size="16" fill="#1b2a3a" text-anchor="middle">wrinkled</text>
  <text x="430" y="124" font-size="16" font-style="italic" fill="#bc4749" text-anchor="middle">rr</text>
  <text x="520" y="56" font-size="14" fill="#5b6b7a">either way round</text>
  <text x="520" y="73" font-size="14" fill="#5b6b7a">(reciprocal crosses</text>
  <text x="520" y="90" font-size="14" fill="#5b6b7a">give the same F1)</text>

  <!-- arrow P -> F1 -->
  <line x1="340" y1="132" x2="340" y2="160" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- F1 row: all round -->
  <use xlink:href="#round" x="290" y="190"/>
  <use xlink:href="#round" x="340" y="190"/>
  <use xlink:href="#round" x="390" y="190"/>
  <text x="430" y="186" font-size="16" fill="#1b2a3a">all round</text>
  <text x="430" y="206" font-size="16" font-style="italic" fill="#1b2a3a">Rr</text>
  <text x="520" y="186" font-size="14" fill="#5b6b7a">wrinkled has not</text>
  <text x="520" y="203" font-size="14" fill="#5b6b7a">vanished: it is hidden</text>

  <!-- arrow F1 -> F2, with self symbol -->
  <line x1="340" y1="220" x2="340" y2="290" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="352" y="262" font-size="15" fill="#5b6b7a">self-pollinate</text>

  <!-- F2 row: 3 round : 1 wrinkled -->
  <use xlink:href="#round" x="230" y="330"/>
  <use xlink:href="#round" x="280" y="330"/>
  <use xlink:href="#round" x="330" y="330"/>
  <use xlink:href="#wrinkled" x="400" y="330"/>
  <text x="280" y="378" font-size="17" font-weight="bold" fill="#2a6f97" text-anchor="middle">5474 round</text>
  <text x="400" y="378" font-size="17" font-weight="bold" fill="#bc4749" text-anchor="middle">1850 wrinkled</text>
  <text x="485" y="326" font-size="17" fill="#1b2a3a">2.96 : 1  ≈  3 : 1</text>
  <text x="485" y="348" font-size="14" fill="#5b6b7a">7324 seeds in total</text>
</svg>
