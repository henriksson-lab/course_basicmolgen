  <rect x="294" y="286" width="66" height="56" fill="#f1d3d3" stroke="#fff" stroke-width="3"/>
  <text x="327" y="319" font-size="15" font-style="italic" fill="#1b2a3a" text-anchor="middle">rryy</text>
  <rect x="96" y="118" width="264" height="224" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- phenotype table -->
  <g font-size="14" fill="#5b6b7a">
    <text x="480" y="100">phenotype</text>
    <text x="670" y="100" text-anchor="middle">cells</text>
    <text x="760" y="100" text-anchor="end">Mendel</text>
    <text x="860" y="100" text-anchor="end">expected</text>
  </g>
  <line x1="420" y1="110" x2="865" y2="110" stroke="#c9d3dd" stroke-width="1"/>
  <!-- round yellow -->
  <rect x="420" y="118" width="8" height="48" fill="#2a6f97"/>
  <circle cx="454" cy="142" r="20" fill="#e9d27c" stroke="#6b6b3a" stroke-width="2"/>
