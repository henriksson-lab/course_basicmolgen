  <text x="327" y="207" font-size="15" font-style="italic" fill="#1b2a3a" text-anchor="middle">Rryy</text>
  <rect x="96" y="230" width="66" height="56" fill="#cfe0ec" stroke="#fff" stroke-width="3"/>
  <text x="129" y="263" font-size="15" font-style="italic" fill="#1b2a3a" text-anchor="middle">RrYY</text>
  <rect x="162" y="230" width="66" height="56" fill="#cfe0ec" stroke="#fff" stroke-width="3"/>
  <text x="195" y="263" font-size="15" font-style="italic" fill="#1b2a3a" text-anchor="middle">RrYy</text>
  <rect x="228" y="230" width="66" height="56" fill="#f6e2c2" stroke="#fff" stroke-width="3"/>
  <text x="261" y="263" font-size="15" font-style="italic" fill="#1b2a3a" text-anchor="middle">rrYY</text>
