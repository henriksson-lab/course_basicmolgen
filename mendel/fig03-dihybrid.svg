  <text x="760" y="316" font-size="17" font-weight="bold" fill="#bc4749" text-anchor="end">32</text>
  <text x="860" y="316" font-size="16" fill="#1b2a3a" text-anchor="end">34.75</text>
  <line x1="420" y1="342" x2="865" y2="342" stroke="#c9d3dd" stroke-width="1"/>
  <text x="486" y="364" font-size="15" fill="#1b2a3a">total, 9 : 3 : 3 : 1</text>
  <text x="760" y="364" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="end">556</text>
  <text x="860" y="364" font-size="15" fill="#1b2a3a" text-anchor="end">556</text>
