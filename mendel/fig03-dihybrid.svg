  <text x="860" y="260" font-size="16" fill="#1b2a3a" text-anchor="end">104.25</text>
  <!-- wrinkled green -->
  <rect x="420" y="286" width="8" height="48" fill="#bc4749"/>
  <use xlink:href="#wr" x="454" y="310" fill="#a8c47a" stroke="#6b6b3a" stroke-width="2" stroke-linejoin="round"/>
