  <text x="84" y="320" font-size="17" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="end">ry</text>
  <rect x="96" y="118" width="66" height="56" fill="#cfe0ec" stroke="#fff" stroke-width="3"/>
  <text x="129" y="151" font-size="15" font-style="italic" fill="#1b2a3a" text-anchor="middle">RRYY</text>
  <rect x="162" y="118" width="66" height="56" fill="#cfe0ec" stroke="#fff" stroke-width="3"/>
  <text x="195" y="151" font-size="15" font-style="italic" fill="#1b2a3a" text-anchor="middle">RRYy</text>
  <rect x="228" y="118" width="66" height="56" fill="#cfe0ec" stroke="#fff" stroke-width="3"/>
