  </defs>

  <!-- title -->
  <text x="14" y="26" font-size="18" font-weight="bold" fill="#1b2a3a">F<tspan font-size="13" dy="4">1</tspan><tspan dy="-4"> selfed:</tspan></text>
  <text x="104" y="26" font-size="18" font-weight="bold" font-style="italic" fill="#1b2a3a">Rr Yy  ×  Rr Yy</text>
  <text x="14" y="50" font-size="14" fill="#5b6b7a">each parent makes 4 kinds of gamete, ¼ each; 16 equally likely cells</text>

  <!-- everything below the title is shifted up 20 px -->
  <g transform="translate(0,-20)">
  <!-- Punnett square: column = gamete from one parent, row = gamete from the other -->
  <text x="129" y="106" font-size="17" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">RY</text>
  <text x="195" y="106" font-size="17" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">Ry</text>
  <text x="261" y="106" font-size="17" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">rY</text>
