  <rect x="162" y="174" width="66" height="56" fill="#dbe8d1" stroke="#fff" stroke-width="3"/>
  <text x="195" y="207" font-size="15" font-style="italic" fill="#1b2a3a" text-anchor="middle">RRyy</text>
  <rect x="228" y="174" width="66" height="56" fill="#cfe0ec" stroke="#fff" stroke-width="3"/>
  <text x="261" y="207" font-size="15" font-style="italic" fill="#1b2a3a" text-anchor="middle">RrYy</text>
