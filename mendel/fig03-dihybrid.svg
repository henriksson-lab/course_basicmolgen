<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 372" width="880" height="372" font-family="Helvetica, Arial, sans-serif">
  <!-- Mendel's dihybrid cross: F1 Rr Yy selfed. Left: 4x4 Punnett square of the F1 gametes, cells
       tinted by phenotype class (blue R_Y_, green R_yy, orange rrY_, red rryy). Right: the four
       phenotypes with seed drawings, expected fraction, Mendel's counts (556 seeds) and 556 x 9:3:3:1. -->
