<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 284" width="780" height="284" font-family="Helvetica, Arial, sans-serif">
  <!-- Branch-line (forked-line) method for the F2 of Rr Yy x Rr Yy.
       Column 1: seed shape (3/4 round, 1/4 wrinkled); column 2: seed colour, the same split under
       each branch; column 3: the four phenotypes and their probabilities by the product rule. -->
  <g font-size="14" fill="#5b6b7a">
    <text x="30" y="22">gene 1: seed shape</text>
    <text x="290" y="22">gene 2: seed colour</text>
    <text x="468" y="22">phenotype</text>
    <text x="760" y="22" text-anchor="end">product rule</text>
  </g>
  <line x1="30" y1="32" x2="760" y2="32" stroke="#c9d3dd" stroke-width="1"/>

  <!-- ¾ round branch -->
  <text x="30" y="106" font-size="18" font-weight="bold" fill="#1b2a3a">¾ round</text>
  <text x="30" y="126" font-size="15" font-style="italic" fill="#5b6b7a">R_</text>
  <path d="M150,100 L 180,100 L 280,68" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="290" y="74" font-size="18" fill="#1b2a3a">¾ yellow <tspan font-size="15" font-style="italic" fill="#5b6b7a">Y_</tspan></text>
  <line x1="420" y1="68" x2="456" y2="68" stroke="#7a8794" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="464" y="54" width="8" height="28" fill="#2a6f97"/>
  <text x="480" y="74" font-size="18" fill="#1b2a3a">round yellow</text>
  <text x="698" y="74" font-size="18" fill="#1b2a3a" text-anchor="end">¾ × ¾ =</text><text x="706" y="74" font-size="18" font-weight="bold" fill="#2a6f97">9/16</text>
  <path d="M150,100 L 180,100 L 280,132" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="290" y="138" font-size="18" fill="#1b2a3a">¼ green <tspan font-size="15" font-style="italic" fill="#5b6b7a">yy</tspan></text>
  <line x1="420" y1="132" x2="456" y2="132" stroke="#7a8794" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="464" y="118" width="8" height="28" fill="#6a994e"/>
  <text x="480" y="138" font-size="18" fill="#1b2a3a">round green</text>
  <text x="698" y="138" font-size="18" fill="#1b2a3a" text-anchor="end">¾ × ¼ =</text><text x="706" y="138" font-size="18" font-weight="bold" fill="#6a994e">3/16</text>

  <!-- ¼ wrinkled branch -->
  <text x="30" y="236" font-size="18" font-weight="bold" fill="#1b2a3a">¼ wrinkled</text>
  <text x="30" y="256" font-size="15" font-style="italic" fill="#5b6b7a">rr</text>
  <path d="M150,230 L 180,230 L 280,198" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="290" y="204" font-size="18" fill="#1b2a3a">¾ yellow <tspan font-size="15" font-style="italic" fill="#5b6b7a">Y_</tspan></text>
  <line x1="420" y1="198" x2="456" y2="198" stroke="#7a8794" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="464" y="184" width="8" height="28" fill="#d08c2f"/>
  <text x="480" y="204" font-size="18" fill="#1b2a3a">wrinkled yellow</text>
  <text x="698" y="204" font-size="18" fill="#1b2a3a" text-anchor="end">¼ × ¾ =</text><text x="706" y="204" font-size="18" font-weight="bold" fill="#d08c2f">3/16</text>
  <path d="M150,230 L 180,230 L 280,262" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="290" y="268" font-size="18" fill="#1b2a3a">¼ green <tspan font-size="15" font-style="italic" fill="#5b6b7a">yy</tspan></text>
  <line x1="420" y1="262" x2="456" y2="262" stroke="#7a8794" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="464" y="248" width="8" height="28" fill="#bc4749"/>
  <text x="480" y="268" font-size="18" fill="#1b2a3a">wrinkled green</text>
  <text x="698" y="268" font-size="18" fill="#1b2a3a" text-anchor="end">¼ × ¼ =</text><text x="706" y="268" font-size="18" font-weight="bold" fill="#bc4749">1/16</text>
</svg>
