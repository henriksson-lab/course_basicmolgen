<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" font-family="Helvetica, Arial, sans-serif">
  <!-- Law of segregation in meiosis: an Aa cell (after DNA replication) -> meiosis I separates the
       two homologues -> meiosis II separates sister chromatids -> four gametes, half A and half a.
       Blue = homologue carrying A, red = homologue carrying a. -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- column headings -->
  <g font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">
    <text x="113" y="22" text-anchor="end" font-style="italic">Aa</text>
    <text x="118" y="22" text-anchor="start">cell</text>
    <text x="390" y="22">meiosis I</text>
    <text x="610" y="22">meiosis II</text>
  </g>
  <g font-size="13.5" fill="#5b6b7a" text-anchor="middle">
    <text x="120" y="40">DNA replicated</text>
    <text x="390" y="40">homologues separate</text>
    <text x="610" y="40">sister chromatids separate</text>
  </g>

  <!-- stage 1: one cell, two replicated homologues (each = two sister chromatids) -->
  <circle cx="120" cy="190" r="82" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
  <g fill="#2a6f97">
    <rect x="82" y="150" width="11" height="80" rx="5"/>
    <rect x="95" y="150" width="11" height="80" rx="5"/>
  </g>
  <g fill="#bc4749">
    <rect x="134" y="150" width="11" height="80" rx="5"/>
    <rect x="147" y="150" width="11" height="80" rx="5"/>
  </g>
  <text x="72" y="196" font-size="20" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="end">A</text>
  <text x="168" y="196" font-size="20" font-weight="bold" font-style="italic" fill="#bc4749">a</text>

  <!-- arrows to meiosis I products -->
  <line x1="196" y1="158" x2="334" y2="115" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="196" y1="222" x2="334" y2="265" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stage 2: two cells, one homologue each -->
  <circle cx="390" cy="112" r="56" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
  <g fill="#2a6f97">
    <rect x="377" y="82" width="11" height="60" rx="5"/>
    <rect x="390" y="82" width="11" height="60" rx="5"/>
  </g>
  <text x="368" y="119" font-size="18" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="end">A</text>
  <circle cx="390" cy="268" r="56" fill="#f4f6f8" stroke="#7a8794" stroke-width="2"/>
  <g fill="#bc4749">
    <rect x="377" y="238" width="11" height="60" rx="5"/>
    <rect x="390" y="238" width="11" height="60" rx="5"/>
  </g>
  <text x="410" y="275" font-size="18" font-weight="bold" font-style="italic" fill="#bc4749">a</text>

  <!-- arrows to meiosis II products -->
  <line x1="446" y1="104" x2="578" y2="81" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="446" y1="122" x2="578" y2="147" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="446" y1="260" x2="578" y2="235" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="446" y1="278" x2="578" y2="301" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stage 3: four gametes, one chromatid each -->
  <g fill="#f4f6f8" stroke="#7a8794" stroke-width="2">
    <circle cx="610" cy="76" r="32"/>
    <circle cx="610" cy="152" r="32"/>
    <circle cx="610" cy="230" r="32"/>
    <circle cx="610" cy="306" r="32"/>
  </g>
  <g fill="#2a6f97">
    <rect x="605" y="58" width="11" height="36" rx="5"/>
    <rect x="605" y="134" width="11" height="36" rx="5"/>
  </g>
  <g fill="#bc4749">
    <rect x="605" y="212" width="11" height="36" rx="5"/>
    <rect x="605" y="288" width="11" height="36" rx="5"/>
  </g>
  <g font-size="17" font-weight="bold" font-style="italic">
    <text x="596" y="82" fill="#2a6f97" text-anchor="end">A</text>
    <text x="596" y="158" fill="#2a6f97" text-anchor="end">A</text>
    <text x="596" y="236" fill="#bc4749" text-anchor="end">a</text>
    <text x="596" y="312" fill="#bc4749" text-anchor="end">a</text>
  </g>

  <!-- gamete frequencies, bracketed -->
  <path d="M652,52 L660,52 L660,176 L652,176" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <path d="M652,206 L660,206 L660,330 L652,330" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="670" y="121" font-size="20" font-weight="bold" fill="#2a6f97">½ <tspan font-style="italic">A</tspan></text>
  <text x="670" y="275" font-size="20" font-weight="bold" fill="#bc4749">½ <tspan font-style="italic">a</tspan></text>
</svg>
