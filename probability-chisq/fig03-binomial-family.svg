<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif">
  <!-- Binomial: number of affected children among 4, parents Aa x Aa, P(affected) = 1/4.
       Left: the 6 birth orders with exactly 2 affected. Right: bar chart of P(k of 4).
       Bars: baseline y = 270, 0.5 -> 200 px (400 px per unit). Bar centres x = 400 + 60k. -->

  <!-- left panel: the six orders -->
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1b2a3a">Exactly 2 of 4 affected: 6 orders</text>
  <g font-size="13" fill="#5c6b7a" text-anchor="middle">
    <text x="58" y="56">1st</text><text x="94" y="56">2nd</text><text x="130" y="56">3rd</text><text x="166" y="56">4th</text>
  </g>
  <!-- filled red = affected (aa), open = unaffected -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <!-- row 1: A A U U -->
    <circle cx="58" cy="76" r="11" fill="#bc4749"/><circle cx="94" cy="76" r="11" fill="#bc4749"/><circle cx="130" cy="76" r="11" fill="#fff"/><circle cx="166" cy="76" r="11" fill="#fff"/>
    <!-- row 2: A U A U -->
    <circle cx="58" cy="106" r="11" fill="#bc4749"/><circle cx="94" cy="106" r="11" fill="#fff"/><circle cx="130" cy="106" r="11" fill="#bc4749"/><circle cx="166" cy="106" r="11" fill="#fff"/>
    <!-- row 3: A U U A -->
    <circle cx="58" cy="136" r="11" fill="#bc4749"/><circle cx="94" cy="136" r="11" fill="#fff"/><circle cx="130" cy="136" r="11" fill="#fff"/><circle cx="166" cy="136" r="11" fill="#bc4749"/>
    <!-- row 4: U A A U -->
    <circle cx="58" cy="166" r="11" fill="#fff"/><circle cx="94" cy="166" r="11" fill="#bc4749"/><circle cx="130" cy="166" r="11" fill="#bc4749"/><circle cx="166" cy="166" r="11" fill="#fff"/>
    <!-- row 5: U A U A -->
    <circle cx="58" cy="196" r="11" fill="#fff"/><circle cx="94" cy="196" r="11" fill="#bc4749"/><circle cx="130" cy="196" r="11" fill="#fff"/><circle cx="166" cy="196" r="11" fill="#bc4749"/>
    <!-- row 6: U U A A -->
    <circle cx="58" cy="226" r="11" fill="#fff"/><circle cx="94" cy="226" r="11" fill="#fff"/><circle cx="130" cy="226" r="11" fill="#bc4749"/><circle cx="166" cy="226" r="11" fill="#bc4749"/>
  </g>
  <g font-size="13.5" fill="#1b2a3a">
    <text x="190" y="81">each order:</text>
    <text x="190" y="100">¼ × ¼ × ¾ × ¾</text>
    <text x="190" y="119">= 9/256</text>
  </g>
  <text x="20" y="266" font-size="15" fill="#1b2a3a">P(2 of 4) = 6 × 9/256 = 54/256 ≈ 0.21</text>
  <text x="20" y="290" font-size="13.5" fill="#5c6b7a">6 = "4 choose 2" = (4 × 3) / (2 × 1)</text>
  <g font-size="13" fill="#1b2a3a">
    <circle cx="26" cy="314" r="7" fill="#bc4749" stroke="#1b2a3a" stroke-width="1.2"/>
    <text x="38" y="319">affected (<tspan font-style="italic">aa</tspan>), ¼</text>
    <circle cx="160" cy="314" r="7" fill="#fff" stroke="#1b2a3a" stroke-width="1.2"/>
    <text x="172" y="319">unaffected, ¾</text>
  </g>

  <!-- right panel: bar chart -->
  <text x="360" y="28" font-size="16" font-weight="bold" fill="#1b2a3a">P(k of 4 children affected)</text>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="370" y1="190" x2="690" y2="190"/>
    <line x1="370" y1="110" x2="690" y2="110"/>
  </g>
  <line x1="370" y1="270" x2="690" y2="270" stroke="#1b2a3a" stroke-width="1.5"/>
  <g font-size="13" fill="#1b2a3a" text-anchor="end">
    <text x="364" y="274">0</text>
    <text x="364" y="194">0.2</text>
    <text x="364" y="114">0.4</text>
  </g>
  <!-- heights: 0.316 -> 126.6, 0.422 -> 168.8, 0.211 -> 84.4, 0.047 -> 18.8, 0.004 -> 1.6 -->
  <g fill="#eaf1f7" stroke="#2a6f97" stroke-width="2">
    <rect x="382" y="143.4" width="46" height="126.6"/>
    <rect x="442" y="101.2" width="46" height="168.8"/>
    <rect x="502" y="185.6" width="46" height="84.4" fill="#f6e1e1" stroke="#bc4749"/>
    <rect x="562" y="251.2" width="46" height="18.8"/>
    <rect x="622" y="268.4" width="46" height="1.6"/>
  </g>
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="405" y="137">0.316</text>
    <text x="465" y="95">0.422</text>
    <text x="525" y="179" fill="#bc4749" font-weight="bold">0.211</text>
    <text x="585" y="245">0.047</text>
    <text x="645" y="262">0.004</text>
  </g>
  <g font-size="14" fill="#1b2a3a" text-anchor="middle">
    <text x="405" y="290">0</text><text x="465" y="290">1</text><text x="525" y="290">2</text><text x="585" y="290">3</text><text x="645" y="290">4</text>
  </g>
  <text x="525" y="312" font-size="14" fill="#1b2a3a" text-anchor="middle">k = number affected</text>
</svg>
