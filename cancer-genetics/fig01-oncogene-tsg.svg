<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif">
  <!-- fig01: oncogene (gain of function, one hit is enough) vs tumour suppressor (loss of function, two hits) -->
  <!-- palette: ink #1b2a3a, blue #2a6f97, red #bc4749, green #6a994e, grey #555 -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/></marker>
  </defs>

  <!-- panel titles -->
  <text x="215" y="30" font-size="21" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Oncogene: gain of function</text>
  <text x="215" y="54" font-size="16" fill="#555" text-anchor="middle">dominant at the cell level: one hit is enough</text>
  <text x="675" y="30" font-size="21" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Tumour suppressor: loss of function</text>
  <text x="675" y="54" font-size="16" fill="#555" text-anchor="middle">recessive at the cell level: two hits are needed</text>
  <line x1="450" y1="20" x2="450" y2="385" stroke="#ccc" stroke-width="1.5"/>

  <!-- ===== left panel: oncogene ===== -->
  <!-- normal cell -->
  <g>
    <ellipse cx="110" cy="170" rx="80" ry="62" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="2"/>
    <rect x="70" y="146" width="80" height="12" rx="6" fill="#2a6f97"/>
    <rect x="70" y="180" width="80" height="12" rx="6" fill="#2a6f97"/>
    <text x="110" y="255" font-size="16" fill="#1b2a3a" text-anchor="middle">normal cell</text>
    <text x="110" y="276" font-size="15" fill="#555" text-anchor="middle">two proto-oncogene alleles,</text>
    <text x="110" y="295" font-size="15" fill="#555" text-anchor="middle">signal only when asked</text>
  </g>
  <line x1="196" y1="170" x2="236" y2="170" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="216" y="158" font-size="15" fill="#bc4749" text-anchor="middle">hit 1</text>
  <!-- one mutant allele -->
  <g>
    <ellipse cx="320" cy="170" rx="80" ry="62" fill="#f8e3e3" stroke="#bc4749" stroke-width="2.5"/>
    <rect x="280" y="146" width="80" height="12" rx="6" fill="#bc4749"/>
    <polygon points="320,140 324,148 333,148 326,153 329,162 320,157 311,162 314,153 307,148 316,148" fill="#ffd166" stroke="#1b2a3a" stroke-width="1"/>
    <rect x="280" y="180" width="80" height="12" rx="6" fill="#2a6f97"/>
    <text x="320" y="255" font-size="16" font-weight="bold" fill="#bc4749" text-anchor="middle">divides without a signal</text>
    <text x="320" y="276" font-size="15" fill="#555" text-anchor="middle">one overactive allele is enough</text>
    <text x="290" y="295" font-size="15" fill="#555" text-anchor="end">e.g.</text>
    <text x="294" y="295" font-size="15" fill="#555"><tspan font-style="italic">KRAS</tspan> G12V</text>
  </g>
  <!-- left caption -->
  <text x="215" y="340" font-size="16" fill="#1b2a3a" text-anchor="middle">a stuck accelerator</text>
  <text x="215" y="362" font-size="15" fill="#555" text-anchor="middle">point mutation, amplification or translocation</text>

  <!-- ===== right panel: tumour suppressor ===== -->
  <g>
    <ellipse cx="530" cy="170" rx="62" ry="56" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="2"/>
    <rect x="500" y="148" width="60" height="12" rx="6" fill="#6a994e"/>
    <rect x="500" y="180" width="60" height="12" rx="6" fill="#6a994e"/>
    <text x="530" y="252" font-size="16" fill="#1b2a3a" text-anchor="middle">normal</text>
  </g>
  <line x1="596" y1="170" x2="616" y2="170" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="606" y="138" font-size="15" fill="#bc4749" text-anchor="middle">hit 1</text>
  <g>
    <ellipse cx="682" cy="170" rx="62" ry="56" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="2"/>
    <rect x="652" y="148" width="60" height="12" rx="6" fill="#ccc"/>
    <line x1="660" y1="142" x2="704" y2="166" stroke="#bc4749" stroke-width="3"/>
    <line x1="660" y1="166" x2="704" y2="142" stroke="#bc4749" stroke-width="3"/>
    <rect x="652" y="180" width="60" height="12" rx="6" fill="#6a994e"/>
    <text x="682" y="252" font-size="16" fill="#1b2a3a" text-anchor="middle">still normal</text>
    <text x="682" y="272" font-size="15" fill="#555" text-anchor="middle">one copy is enough</text>
  </g>
  <line x1="748" y1="170" x2="768" y2="170" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="758" y="138" font-size="15" fill="#bc4749" text-anchor="middle">hit 2</text>
  <g>
    <ellipse cx="830" cy="170" rx="58" ry="56" fill="#f8e3e3" stroke="#bc4749" stroke-width="2.5"/>
    <rect x="802" y="148" width="56" height="12" rx="6" fill="#ccc"/>
    <line x1="810" y1="142" x2="850" y2="166" stroke="#bc4749" stroke-width="3"/>
    <line x1="810" y1="166" x2="850" y2="142" stroke="#bc4749" stroke-width="3"/>
    <rect x="802" y="180" width="56" height="12" rx="6" fill="#ccc"/>
    <line x1="810" y1="174" x2="850" y2="198" stroke="#bc4749" stroke-width="3"/>
    <line x1="810" y1="198" x2="850" y2="174" stroke="#bc4749" stroke-width="3"/>
    <text x="830" y="252" font-size="16" font-weight="bold" fill="#bc4749" text-anchor="middle">no brake</text>
    <text x="806" y="272" font-size="15" fill="#555" text-anchor="end">e.g.</text>
    <text x="810" y="272" font-size="15" fill="#555"><tspan font-style="italic">RB1</tspan>, <tspan font-style="italic">TP53</tspan></text>
  </g>
  <!-- right caption -->
  <text x="675" y="340" font-size="16" fill="#1b2a3a" text-anchor="middle">broken brakes: both copies must go</text>
  <text x="675" y="362" font-size="15" fill="#555" text-anchor="middle">point mutation, deletion, loss of heterozygosity, silencing</text>
</svg>
